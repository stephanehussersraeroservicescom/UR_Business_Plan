services:
  ur-app:
    build:
      context: ../working-folder
      dockerfile: Dockerfile
    image: ur-app:latest
    container_name: ur_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:5050"
    environment:
      - PORT=5050
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      # Pages de lecture du plan et des annexes (accueil.py) : lues dans le depot, jamais copiees (D-023)
      - ../nouveau-business-plan:/nouveau-business-plan:ro
    networks:
      - ur_network

networks:
  ur_network:
    driver: bridge
