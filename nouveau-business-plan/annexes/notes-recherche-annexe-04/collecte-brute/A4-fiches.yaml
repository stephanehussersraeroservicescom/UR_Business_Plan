
# === ANNEXE 4 (chat 5, 19/11/2026) : France ===

A4-AIDA-NOMENCLATURE-V58-2026:
  titre: "Brochure de la nomenclature des installations classees, edition v58 (juin 2026)"
  editeur: "Ministere de la transition ecologique (DGPR), diffusee par l'INERIS (AIDA)"
  date: 2026-06-26
  annee_donnees: 2026
  type: reglementaire
  url: https://aida.ineris.fr/sites/default/files/2026-07/BrochureNom_v58.pdf
  emplacement: "p. 33 (rubriques 2771 et 2791), p. 38 (3520), p. 39 (3531, 3532)"
  contenu: "2771 : installation de traitement thermique de dechets non dangereux (hors 2971 et combustion de biomasse au sens de 2910) : regime A (autorisation), rayon 2 km. 2791 : traitement de dechets non dangereux, 10 t/j ou plus : A, rayon 2 km ; moins de 10 t/j : DC. 3520 : elimination ou valorisation de dechets dans des installations d'incineration ou de coincineration ; a) dechets non dangereux, capacite superieure a 3 tonnes par heure : A, rayon 3 km. 3532 : valorisation de dechets non dangereux non inertes de plus de 75 tonnes par jour, dont pretraitement des dechets destines a l'incineration ou a la coincineration : A, rayon 3 km."
  citation: "2771 Installation de traitement thermique de déchets non dangereux, à l’exclusion des installations visées à la rubrique 2971 | a) Pour les déchets non dangereux avec une capacité supérieure à 3 tonnes par heure | 3532 Valorisation ou un mélange de valorisation et d’élimination, de déchets non dangereux non inertes avec une capacité supérieure à 75 tonnes par jour"
  statut: lu
  consulte: '2026-11-19'
  note: "Document de diffusion ; seule la publication au Journal officiel (annexe de l'article R. 511-9 du code de l'environnement) a valeur juridique. PDF lu par Claude dans le navigateur de Stephane le 19/11/2026."

A4-DGPR-NOTE-DECHETS-2022:
  titre: "Note d'explication de la nomenclature ICPE des installations de gestion et de traitement de dechets (version du 27 avril 2022)"
  editeur: "Ministere de la transition ecologique, DGPR"
  date: 2022-04-27
  annee_donnees: 2022
  type: reglementaire
  url: https://aida.ineris.fr/sites/aida/files/gesdoc/108548/BPGD-22-041 Note-dechets_27042022.pdf
  emplacement: "p. 10 (paragraphe 7.1), p. 57 a 61 (rubriques 2770 et 2771), p. 84 (annexe 4)"
  contenu: "Rubriques 277X : installations ou les dechets sont portes a une temperature superieure a 180 C ; elles couvrent les procedes de traitement thermochimique de type pyrolyse, gazeification ou torche a plasma (temperatures du tableau : 250-700 C pour la pyrolyse). Rubrique 2771 : traitement thermique des dechets non dangereux, y compris pyrolyse et gazeification. Articulation avec les rubriques IED 3510, 3520 et 3550 ; la rubrique 3520 correspond aux rubriques 2770, 2771 et 2971. Un dechet ne perd pas son statut de dechet a la sortie d'une installation 27XX sans criteres de sortie."
  citation: "un procédé de traitement thermochimique de type pyrolyse, gazéification ou torche à plasma | les installations où les déchets sont portés à une température supérieure à 180 °C"
  statut: lu
  consulte: '2026-11-19'
  note: "Note d'interpretation de l'administration (2022, antérieure aux modifications de 2023 a 2026 de certaines rubriques). Lue par WebFetch le 19/11/2026 en deux parties ; citations transcrites par un modele intermediaire, a recontroler."

A4-DRIEAT-AENV-2024:
  titre: "Reforme de l'autorisation environnementale, loi Industrie verte (octobre 2024)"
  editeur: "DRIEAT Ile-de-France (document diffuse sur son site)"
  date: 2024-10
  annee_donnees: 2024
  type: reglementaire
  url: https://www.drieat.ile-de-france.developpement-durable.gouv.fr/IMG/pdf/reforme_de_l_autorisation_environnementale_-_loi_industrie_verte_-_octobre_2024.pdf
  emplacement: "sections phase d'examen et de consultation, phase de decision"
  contenu: "Dossiers deposes a partir du 22/10/2024. Consultation parallelisee : 3 mois de consultation et 3 semaines pour le rapport du commissaire enqueteur. Enquete publique unique ou participation par voie electronique : examen et consultation l'une apres l'autre, 5 mois minimum. Phase de decision : 2 mois, plus 1 si avis du CODERST ou de la CDNPS."
  citation: "3 mois de consultation + 3 semaines pour la réception du rapport du commissaire enquêteur | La phase d'examen et de consultation se réalisent l'une après l'autre : 5 mois minimum | 2 mois (+1 si avis CODERST/CDNPS"
  statut: lu
  consulte: '2026-11-19'
  note: "Document de l'administration regionale. Lu par WebFetch le 19/11/2026. Ne donne pas de duree totale ni la duree de preparation du dossier."

A4-CENV-L541-1-2021:
  titre: "Code de l'environnement, article L. 541-1 (objectifs de la politique nationale de prevention et de gestion des dechets), version en vigueur depuis le 25/08/2021"
  editeur: "Legifrance"
  date: 2021-08-25
  annee_donnees: 2021
  type: reglementaire
  url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074220/LEGISCTA000006176615/
  emplacement: "article L. 541-1, I, 4°, 4° bis, 7°, 7° bis, 9°"
  contenu: "Objectifs : 65 % des dechets non dangereux non inertes orientes vers la valorisation matiere en 2025 (55 % en 2020) ; 55 % des DMA prepares en vue de la reutilisation ou recycles en 2025, 60 % en 2030, 65 % en 2035 ; tendre vers 100 % de plastique recycle au 1er janvier 2025 ; reduire de 30 % en 2020 et de 50 % en 2025 par rapport a 2010 les dechets non dangereux non inertes admis en stockage ; DMA admis en stockage limites a 10 % des DMA produits en 2035 ; valorisation energetique d'au moins 70 % des dechets ne pouvant faire l'objet d'une valorisation matiere d'ici 2025, notamment par les combustibles solides de recuperation."
  citation: "Réduire de 30 % les quantités de déchets non dangereux non inertes admis en installation de stockage en 2020 par rapport à 2010, et de 50 % en 2025 | Réduire les quantités de déchets ménagers et assimilés admis en installation de stockage en 2035 à 10 % | Assurer la valorisation énergétique d'au moins 70 % des déchets ne pouvant faire l'objet d'une valorisation matière d'ici 2025"
  statut: lu
  consulte: '2026-11-19'
  note: "Lu par Claude dans le navigateur de Stephane (Legifrance) le 19/11/2026. Modifie notamment par la loi n. 2020-105 du 10/02/2020 (AGEC) et la loi n. 2021-1104 du 22/08/2021."
