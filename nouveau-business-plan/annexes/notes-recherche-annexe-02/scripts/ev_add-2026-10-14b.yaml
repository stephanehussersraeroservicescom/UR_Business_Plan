  citation: Seawater desalination Test ; Chloride ion mg/L 31,000 31 140,000
  contenu: 'Essai de dessalement d''eau de mer (eau brute / eau traitee / eau residuelle) : pH 7,2 / 5,3 / 7,2 ; matieres en suspension 2 / 3 / 270 mg/L ; sodium 15 000 / 26 / 66 000 mg/L ; chlorures 31 000 / 31 / 140 000 mg/L ; durete 170 / 4 / 650 mg/L. Capacite annoncee environ 330 t/jour d''eau avec un ventilateur TAIYO FA-B de 3 500 m3/min (ecart de vapeur saturante 82,8 - 17,2 = 65,6 g/m3 entre 50 et 20 C). Brevet JP 6391698, WO2016143848 A1.'
