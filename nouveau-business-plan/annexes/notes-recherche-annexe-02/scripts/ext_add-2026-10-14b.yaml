REFUELEU-2023-2405:
  titre: Reglement (UE) 2023/2405 (ReFuelEU Aviation), article 3 et annexe I
  editeur: Parlement europeen et Conseil (texte reproduit par lawplayer.com)
  date: '2023-10-18'
  type: reglementaire
  url: https://lawplayer.com/eu/act/32023R2405
  emplacement: Article 3 points 7 et 9 ; annexe I
  contenu: 'SAF = carburants d''aviation synthetiques, biocarburants d''aviation ou carburants d''aviation a carbone recycle. Carburants a carbone recycle = recycled carbon fuels au sens de la directive (UE) 2018/2001 art. 2 point 35, conformes au seuil de reduction d''emissions de l''art. 29a(2) et certifies selon l''art. 30. Parts minimales de SAF : 6 % en 2030, 20 % en 2035 (dont 5 % synthetiques), 70 % en 2050 (dont 35 % synthetiques).'
  citation: '''sustainable aviation fuels'' (''SAF'') means aviation fuels that are either: synthetic aviation fuels; aviation biofuels; or recycled carbon aviation fuels'
  statut: lu
  consulte: '2026-10-14'
  note: Lu sur une reproduction (lawplayer), EUR-Lex inaccessible le 14/10/2026. La definition de la directive 2018/2001 et le seuil de l'art. 29a(2) ne sont pas lus (NON TROUVE).
