
# === ANNEXE 2 : NORMES D'EMISSION ET CONVERSIONS (chat 1 v3, 14/10/2026) ====

IED-2010-75-ANX6-P3:
  titre: "Directive 2010/75/UE relative aux emissions industrielles, annexe VI, partie 3 : valeurs limites d'emission dans l'air des installations d'incineration des dechets"
  editeur: "Parlement europeen et Conseil (texte adopte, reproduit par legislation.gov.uk)"
  date: 2010-11-24
  type: reglementaire
  url: "https://legislation.gov.uk/eudr/2010/75/annex/VI/part/3/adopted?view=plain"
  emplacement: "Annexe VI, partie 3, points 1, 1.1, 1.4 et 1.5 ; article 42(1) second alinea"
  contenu: >
    Valeurs a 273,15 K, 101,3 kPa, gaz sec, 11 % d'oxygene. Moyennes journalieres (mg/Nm3) : poussieres 10 ;
    COT 10 ; HCl 10 ; HF 1 ; SO2 50 ; NOx (en NO2) 200 pour les installations neuves ou existantes de plus de
    6 t/h, 400 pour les existantes de 6 t/h au plus. Dioxines et furannes 0,1 ng/Nm3 sur 6 a 8 h. CO 50 mg/Nm3
    en moyenne journaliere. Article 42(1) : le chapitre ne s'applique pas a une pyrolyse dont les gaz sont
    purifies au point de ne plus etre des dechets et n'emettent pas plus que la combustion de gaz naturel.
  citation: "All emission limit values shall be calculated at a temperature of 273,15 K, a pressure of 101,3 kPa"
  statut: verifie
  consulte: 2026-10-14
  note: "Lu sur la reproduction legislation.gov.uk du texte adopte ; a relire sur EUR-Lex (JO L 334 du 17/12/2010)."

BAT-WI-2019-2010:
  titre: "Decision d'execution (UE) 2019/2010 etablissant les conclusions sur les meilleures techniques disponibles (MTD) pour l'incineration des dechets"
  editeur: "Commission europeenne (texte reproduit par legislation.gov.uk)"
  date: 2019-11-12
  type: reglementaire
  url: "https://www.legislation.gov.uk/eudn/2019/2010/data.html"
  emplacement: "Considerations generales (conditions de reference, 11 % d'O2) ; MTD 25 tableau 3 ; MTD 27 tableau 5 ; MTD 29 tableau 6 ; MTD 30 tableau 7"
  contenu: >
    NEA-MTD, gaz sec, 273,15 K, 101,3 kPa, 11 % d'O2. Poussieres < 2-5 mg/Nm3 (moyenne journaliere).
    HCl < 2-6 (neuve), < 2-8 (existante) ; HF < 1 ; SO2 5-30 (neuve), 5-40 (existante). NOx 50-120 (neuve),
    50-150 (existante) ; CO 10-50 ; NH3 2-10 mg/Nm3. PCDD/F < 0,01-0,04 ng I-TEQ/Nm3 (neuve, moyenne sur la
    periode d'echantillonnage), < 0,01-0,06 (existante).
  statut: verifie
  consulte: 2026-10-14
  note: "Lu sur la reproduction legislation.gov.uk ; la formule de correction d'O2 y est une image (definitions ER, OR, EM, OM lues)."

WALLONIE-2003-ANX6-O2:
  titre: "Arrete du Gouvernement wallon du 27 fevrier 2003 (incineration et co-incineration des dechets), annexe VI : formule de correction a la teneur standard en oxygene"
  editeur: "Gouvernement wallon"
  date: 2003-02-27
  type: reglementaire
  url: "https://wallex.wallonie.be/files/medias/5/2851.pdf"
  emplacement: "Annexe VI"
  contenu: "ES = (21 - OS) / (21 - OM) x EM ; ES concentration au pourcentage standard d'oxygene, EM concentration mesuree, OS oxygene standard, OM oxygene mesure."
  citation: "ES = concentration d'emission calculee au pourcentage standard de la concentration d'oxygene"
  statut: verifie
  consulte: 2026-10-14
  note: "Texte de plus de huit ans ; sert uniquement pour la formule de correction, identique dans son principe aux definitions de BAT-WI-2019-2010."

DK-EPA-2002-PPM:
  titre: "Danish EPA, Guidelines for Air Emission Regulation, section 9.7 : conversion des ppm en mg/Nm3"
  editeur: "Danish Environmental Protection Agency (Miljostyrelsen)"
  date: 2002
  type: etude_publique
  url: "https://www2.mst.dk/udgiv/publications/2002/87-7972-035-8/html/kap09_eng.htm"
  emplacement: "section 9.7"
  contenu: "1 ppm NO2 = 2,05 mg/Nm3 ; 1 ppm SO2 = 2,93 mg/Nm3 ; 1 ppm HCl = 1,63 mg/Nm3 ; 1 ppm CO = 1,25 mg/Nm3, a 0 C et 101,3 kPa."
  citation: "1 ppm NO2 = 2.05 mg/normal m3 NO2 at 0oC and 101.3 kPa."
  statut: verifie
  consulte: 2026-10-14
  note: "Donnee de plus de huit ans (2002) ; facteurs physiques de conversion."
