# Corrections de registres, annexe 2, 25/11/2026 (chat de correction). A fusionner par le chat principal.
meta:
  auteur: Claude (chat de correction de l annexe 2)
  date: '2026-11-25'
  objet: Corrections de registres issues des lots 1 et 2 de Codex sur l'annexe 2 (ecarts-annexe-02-2026-11-25.md). A fusionner par le chat principal.
  ne_pas_appliquer_sans: relecture du chat principal
fiches:
  nouvelles:
    A2-IED-2010-75-ANX6-P6:
      registre: registre-sources.yaml
      titre: 'Directive 2010/75/UE, annexe VI, partie 6, point 2.1 : surveillance des emissions des installations d''incineration (mesures en continu et periodiques)'
      editeur: Parlement europeen et Conseil
      date: '2010-11-24'
      type: reglementaire
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32010L0075
      emplacement: Annexe VI, partie 6, point 2.1 a), b) et c)
      citation: '(a) continuous measurements of the following substances: NOx, provided that emission limit values are set, CO, total dust, TOC, HCl, HF, SO2;'
      citation_c: (c) at least two measurements per year of heavy metals and dioxins and furans;
      contenu: 'Mesures en continu : NOx, CO, poussieres totales, COT, HCl, HF, SO2 ; parametres de procede en continu au point b) (oxygene, pression, temperature, vapeur d''eau des gaz) ; au moins deux
        mesures par an des metaux lourds et des dioxines et furannes (une tous les 3 mois les 12 premiers mois).'
      statut: lu
      consulte: '2026-11-25'
      reserve: Lu par Claude via l'outil de lecture web (texte EUR-Lex consolide au format HTML d'origine, sans verification de version consolidee ulterieure a 2010) ; le point b) est une paraphrase de
        l'outil, citation exacte a recontroler. Utilise dans l'annexe 2, section 2.7.2 (conditions d'une demonstration de permis).
  champs_a_ajouter_ou_remplacer:
    UR2000-JP-P05-BILAN:
      registre: _evidence.yaml
      citation_volumes: 一般ゴミ 200ton. ▶ 200m3 (200,000L) ; 炭化物 25% (50m3/ 加工利用可能 ) ; 混合油 ( 軽油・重油 ) 5% (10,000ℓ / 再利用可能 ) ; OFF ガス 5% (10,000ℓ / 再利用 )
      valeurs_lues_2026_11_25: 'p. 5 relue par Claude (pdftotext) le 25/11/2026 : les quantites imprimees sont les pourcentages appliques au volume d''entree (25 % de 200 m3 = 50 m3 ; 5 % de 200 000 L =
        10 000 L, pour l''huile comme pour l''off-gas).'
      reserve_remplace: CONSTRUCTEUR. Pourcentages imprimes, rapportes au volume d'entree de 200 m3 (200 000 L) ; base massique non definie ; ne pas utiliser comme bilan massique (R-010). Aucune mesure
        jointe.
      motif: Lot 1 Codex E-1 (reserve R-4) ; remplace « 60 a 65 % de l entree non affectes ».
    OW-ENG-P16-BILAN:
      registre: _evidence.yaml
      citation_perte: Recovery Loss 11.5 % 11,730ℓ (11.73ton) ; Mainly discharged as flue gas; a very small amount will be carbide.
      valeurs_lues_2026_11_25: 'p. 16 relue par Claude (pdftotext, mise en page en colonnes reconstituee) le 25/11/2026 : la ligne de 11,5 % s''appelle « Recovery Loss », pas gaz ; aucune composition donnee.'
      reserve_ajout: La « Recovery Loss » de 11,5 % n'est pas une part mesuree de gaz combustible ; son assimilation au gaz KANSO est l'hypothese D-038 (lot 2 Codex E-1).
    CHIBA-PROCEDE-HUILE:
      registre: _evidence.yaml
      reserve_remplace: 'Le rapport ne dit ni la fonction du catalyseur (dechloration ou autre), ni sa nature, ni son etat. Il ne decrit pas la conversion du volume jauge en masse : chaque fiche imprime
        volume, densite et poids, en general coherents (ex. 60 L x 0,823 = 49,4 kg, PDF p. 24), avec un ecart p. 26 (18 L x 0,874 = 15,7 kg contre 16,1 kg imprimes). Conversion par la densite : inference,
        non methode decrite.'
      motif: Lot 1 Codex, verdict 8 (reserve R-5) ; pages 24, 26 et 29 relues par Claude le 25/11/2026.
    CHIBA-CONSTATS:
      registre: _evidence.yaml
      citation_p40: マテリアルバランスの水(排水)の蒸散水については、計算値とした。
      valeurs_lues_2026_11_25: 'PDF p. 40 relue par Claude (pdftotext) le 25/11/2026 : l''eau evaporee du bilan matiere est une valeur calculee (27 L et 15 L, PDF p. 42, soit 100 L moins 73 L et 85 L rejetes).'
      motif: Lot 1 Codex, verdict 9 ; citee dans la section 2.2.3.
    CHIBA-OOSUMI-FUMEES:
      registre: _evidence.yaml
      valeurs_lues_2026_11_25: 'PDF p. 55 et 56 (images) vues par Claude le 25/11/2026 : rapports marques 仮 2022/10/18 ; parametres : ばいじん, 硫黄酸化物, 窒素酸化物 et, le 15/09 seulement, ダイオキシン類 ; aucune teneur en
        oxygene, ni CO, ni HCl ; mesures ponctuelles a 350, 450 et 550 C ; ppm en volume a 0 C et 101,3 kPa (備考).'
      motif: Lot 2 Codex E-2 et E-3.
    IED-2010-75-ART50:
      registre: registre-sources.yaml
      citation_complete: If hazardous waste with a content of more than 1 % of halogenated organic substances, expressed as chlorine, is incinerated or co-incinerated, the temperature required to comply
        with the first and second subparagraphs shall be at least 1 100 °C.
      relu: 2026-11-25 (Claude, EUR-Lex HTML)
      motif: 'Lot 2 Codex E-5 : perimetre (dechets dangereux, declencheur de temperature, pas une limite d acceptation).'
