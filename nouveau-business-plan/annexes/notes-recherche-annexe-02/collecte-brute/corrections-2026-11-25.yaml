decisions:
  nouvelles: {}
  note: 'Aucune nouvelle decision creee : les corrections appliquent D-022, D-029, D-033 a D-035 et D-038 sans les modifier. Points a trancher par Stephane : voir ecarts-annexe-02-2026-11-25.md (D-058 a
    D-061 restent libres).'
recherches:
  complements:
    R-010:
      complement_2026_11_25: 'UR2000-JP p. 5 relue : les pourcentages (char 25 %, huile 5 %, off-gas 5 %) sont des parts du volume d''entree de 200 m3 (50 m3, 10 000 L, 10 000 L). Demander la base massique
        et un bilan massique mesure sur ordures menageres.'
    R-011:
      complement_2026_11_25: 'Brochure anglaise p. 16 : que contient la « Recovery Loss » de 11,5 % (« mainly discharged as flue gas ; a very small amount will be carbide ») : masse de gaz de pyrolyse,
        composition, part brulee, eau ? Bilan gazeux mesure sur l''URC-2000 en continu.'
    R-012:
      complement_2026_11_25: 'Char : specification par lot pour le debouche CSR (chlore, cendres, humidite, homogeneite et autres caracterisations de l''arrete du 23 mai 2016).'
    R-016:
      complement_2026_11_25: 'Campagne de permis sur la charge cible en continu : mesures en continu de poussieres, COT, HCl, HF, SO2, NOx, CO, avec O2, temperature et vapeur d''eau, sur les periodes reglementaires
        (moyennes journalieres ; dioxines sur 6 a 8 h) ; mesures periodiques des metaux lourds et dioxines (directive 2010/75/UE, annexe VI, parties 3 et 6) ; rapports definitifs.'
    R-017:
      complement_2026_11_25: Essai de traitabilite sur l'eau de procede reelle (phenols, cyanures, DBO, pH 0,8), bilan eau en continu, filiere de traitement, destination des concentrats, criteres de rejet
        et garantie de performance.
