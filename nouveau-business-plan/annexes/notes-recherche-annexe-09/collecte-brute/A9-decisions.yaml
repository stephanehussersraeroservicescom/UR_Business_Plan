
D-050:
  date: 2026-11-19
  titre: "Prix de l'URC-2000 : 50 MEUR, toutes options comprises (PRIMO, SEA CORAL, FORCE 9), hors livraison"
  de: "prix connu seulement par l'ancienne annexe 9 archivee (ONEWORLD-COTATION, sans valeur de preuve) ; demande R-005"
  vers: "50 000 000 EUR pour une machine de 200 t/jour, options PRIMO, SEA CORAL et FORCE 9 comprises ; livraison non comprise (depend du site)"
  unite: "EUR"
  motif: >
    Decision de Stephane du 19/11/2026 (12 h 41, chat 5) : « C'est nous qui decidons du prix et il est fixe [...]
    50 millions, c'est le prix de la machine. [...] La machine de 200 tonnes, c'est 50 millions. Et ca comprend toutes
    les options. Primo, Sea Coral et Force 9. [...] Mais ce n'est pas livre, parce que la livraison depend de
    l'endroit. » Stephane fait partie d'Urban Rig, qui fixe le prix (D-027). Devise : l'euro, utilisee dans tout le
    projet et dans l'ancienne annexe 9 ; a corriger si Stephane precise autrement. R-005 devient sans objet pour le prix ;
    le cout de livraison reste a chiffrer selon le site (R-049).
  preuves: []
