# Collecte du 15/10/2026 par un sous-agent de recherche.
# Méthode Comext : l'API Eurostat (ec.europa.eu) est refusée par le proxy en ligne de commande, et WebFetch a été limité (HTTP 429)
# après deux requêtes. Les requêtes ont donc été exécutées en lecture seule dans le navigateur Chrome de l'utilisateur
# (onglet dédié ouvert puis refermé, fetch() GET des URL ci-dessous depuis la page de l'API, aucune connexion, aucun formulaire).
# Formule de prix unitaire utilisée partout : P (EUR/t) = VALUE_IN_EUROS / (QUANTITY_IN_100KG x 0,1 t) = 10 x V / Q.
# Base de l'API : https://ec.europa.eu/eurostat/api/comext/dissemination/statistics/1.0/data/DS-045409
# Jeu de données : « EU trade since 1988 by HS2-4-6 and CN8 », mis à jour le 2026-09-15 (horodatage DISSEMINATION_TIMESTAMP_DATA).
# Réserve générale Comext : valeur unitaire statistique (FAB à l'exportation, CAF à l'importation), moyenne de toutes les qualités
# déclarées sous le code NC, y compris intra-UE pour le déclarant FR/DE et partenaire WORLD ; ce n'est pas un prix de rachat
# d'un métal de qualité inférieure (métaux extraits d'un char de pyrolyse) ; c'est un plafond indicatif de marché.

