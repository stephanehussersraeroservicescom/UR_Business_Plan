A3-UE-DIR-2023-959-CONSID98:
  titre: "Directive (UE) 2023/959 du Parlement européen et du Conseil du 10 mai 2023 modifiant la directive 2003/87/CE (version EN, considérants)"
  editeur: "Union européenne, Journal officiel L 130 du 16/05/2023"
  date: "2023-05-10"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32023L0959"
  emplacement: "Considérant (98)"
  contenu: "Le considérant (98) prévoit qu'au plus tard en juillet 2026 la Commission fasse rapport sur la faisabilité d'inclure les installations d'incinération de déchets municipaux dans le SEQE-UE, en vue d'une inclusion à partir de 2028, et évalue le besoin éventuel d'une option de retrait (opt-out) pour un État membre jusqu'à fin 2030. Le texte opérationnel (article 1 modifiant l'article 30 et l'annexe I) n'a pas pu être lu : la page EUR-Lex est tronquée par l'outil avant ces points (HTML, PDF et version consolidée 02003L0087-20240301 essayés)."
  citation: "By July 2026 [...] the feasibility of including municipal waste incineration installations in the EU ETS, including with a view to their inclusion from 2028 [...] provide an assessment of the potential need for an option for a Member State to opt out until the end of 2030"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Citation en extraits juxtaposés (les [...] marquent les coupures de l'outil). Considérant, pas article : la date exacte « 31 juillet 2026 » n'apparaît pas dans l'extrait lu ; voir A3-ZWE-SEQE-ART30-2024 pour le texte de l'article (secondaire)."
  parametres: [seqe_incineration_calendrier_2023]

A3-ZWE-SEQE-ART30-2024:
  titre: "Incineration in the EU ETS (Zero Waste Europe, version finale)"
  editeur: "Zero Waste Europe (ONG)"
  date: "2024-09"
  type: etude_publique
  url: "https://zerowasteeurope.eu/wp-content/uploads/2024/09/ZWE-Incineration-in-the-EU-ETS-Final-Version.docx.pdf"
  emplacement: "Introduction, p. 7-8 (article 30, paragraphe 7, cité) ; p. 12 (annexe I modifiée et définition IED citées)"
  contenu: "Le document reproduit l'article 30(7) de la directive 2003/87/CE modifiée : rapport de la Commission au plus tard le 31/07/2026 sur l'inclusion des incinérateurs de déchets municipaux, en vue d'une inclusion à partir de 2028, avec évaluation d'une option d'opt-out jusqu'au 31/12/2030. Il reproduit aussi l'ajout à l'annexe I : à partir du 1er janvier 2024, la combustion de combustibles dans les installations d'incinération de déchets municipaux relève des articles 14 et 15 (surveillance, déclaration, vérification), sans obligation de restitution de quotas."
  citation: "By 31 July 2026, the Commission shall present a report to the European Parliament and to the Council [...] including with a view to their inclusion from 2028 [...] for a Member State to opt out until 31 December 2030 ; From 1 January 2024, combustion of fuels in installations for the incineration of municipal waste [...] for the purposes of Articles 14 and 15"
  statut: secondaire
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Source militante (ONG) qui cite le texte légal ; le texte légal lui-même (EUR-Lex) n'a pas pu être lu jusqu'à l'article 30 et à l'annexe I (troncature). Pagination du PDF incohérente selon l'outil."
  parametres: [seqe_incineration_calendrier_2023, seqe_incineration_mrv_2024]

A3-UE-DIR-2010-75-ART3:
  titre: "Directive 2010/75/UE relative aux émissions industrielles (IED), article 3"
  editeur: "Union européenne"
  date: "2010-11-24"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32010L0075"
  emplacement: "Article 3, points (40) et (41)"
  contenu: "Définition de l'installation d'incinération et de coïncinération des déchets : le traitement thermique inclut la pyrolyse, la gazéification et le procédé plasma, mais seulement si les substances issues du traitement sont ensuite incinérées. C'est cette définition à laquelle renvoie l'annexe I du SEQE (et la proposition COM(2026) 616). Une pyrolyse dont l'huile et le char sont vendus (et non brûlés sur place) ne serait donc pas une installation d'incinération au sens de l'IED ; le gaz brûlé sur place pose question (non tranché par le texte lu)."
  citation: "through the incineration by oxidation of waste as well as other thermal treatment processes [...] such as pyrolysis, gasification or plasma process [...] if the substances resulting from the treatment are subsequently incinerated"
  statut: ancien
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch (version de base 2010, non consolidée ; texte antérieur à 2018 mais toujours en vigueur sur ce point selon la lecture ; la directive (UE) 2024/1785 modifiant l'IED n'a pas été vérifiée). L'application à Urban Rig est une lecture, pas une position d'une autorité."
  parametres: [seqe_perimetre_pyrolyse]

A3-UE-COM-2026-616-EXPOSE:
  titre: "Proposal for a Directive amending Directive 2003/87/EC and Decision (EU) 2015/1814 as regards driving competitiveness and cost-effective decarbonisation, COM(2026) 616 final"
  editeur: "Commission européenne"
  date: "2026-07-17"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:52026PC0616"
  emplacement: "Exposé des motifs, section 5 « Detailed explanation of the specific provisions », rubrique « Municipal waste incineration »"
  contenu: "Proposition (procédure 2026/0212(COD)) d'étendre le SEQE à toute l'incinération et coïncinération de déchets non dangereux (seuil > 3 t/h, définitions IED), avec obligations de restitution introduites progressivement de 2031 à 2034 et une option de retrait national temporaire pour les États membres appliquant des mesures équivalentes ; l'incinération de déchets dangereux reste exclue. L'exposé des motifs ne mentionne ni la pyrolyse ni le recyclage chimique, ni le rapport de l'article 30(7). Il ne dit pas que des réductions hors périmètre donnent des crédits."
  citation: "gradually phased in over the period 2031 to 2034 ; Member States implementing appropriate equivalent measures should be eligible to a temporary national opt-out."
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Les articles du dispositif (après le caractère 100 000 de la page) n'ont pas pu être lus : seuls les considérants 10 à 39 sont apparus avec l'offset. Les pourcentages 25/50/75/100 % et la date de notification de l'opt-out ne sont donc pas vérifiés en source primaire (voir A3-LOYENS-2026-SEQE-DECHETS). Proposition, pas texte adopté."
  parametres: [seqe_incineration_proposition_2026]

A3-UE-COM-2026-616-ANNEXES-FR:
  titre: "ANNEXES de la proposition de DIRECTIVE DU PARLEMENT EUROPÉEN ET DU CONSEIL modifiant la directive 2003/87/CE et la décision (UE) 2015/1814 en ce qui concerne le renforcement de la compétitivité et de la décarbonation à coûts maîtrisés (COM(2026) 616 final, annexes 1 à 2 ; Conseil 12073/26 ADD 1)"
  editeur: "Commission européenne, transmis par le Conseil de l'UE"
  date: "2026-07-17"
  type: reglementaire
  url: "https://data.consilium.europa.eu/doc/document/ST-12073-2026-ADD-1/fr/pdf"
  emplacement: "Annexe I modifiée, p. 2 (point 5) et p. 4 (nouvelle ligne « Incinération et coïncinération des déchets »)"
  contenu: "La proposition supprime les mots « ou municipaux » de l'exclusion du point 5 de l'annexe I (l'exclusion des déchets dangereux demeure) et ajoute une activité : à partir du 1er janvier 2031, élimination ou valorisation de déchets (non dangereux) dans des installations d'incinération ou de coïncinération de capacité > 3 t/h, À L'EXCLUSION DU RECYCLAGE CHIMIQUE ; gaz visé : dioxyde de carbone. La pyrolyse n'est pas nommée. Pour les décharges : rapport de la Commission au plus tard le 31/07/2029 sur deux conditions, inclusion en 2031 ou 2034."
  citation: "au point 5, les mots suivants sont supprimés: «ou municipaux» ; À partir du 1er janvier 2031, l'élimination ou la valorisation des déchets dans des installations d'incinération [...] avec une capacité supérieure à 3 tonnes par heure, à l'exclusion du recyclage chimique."
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Proposition non adoptée. L'exclusion « recyclage chimique » est favorable à une pyrolyse de plastiques produisant une matière (si l'huile est qualifiée de recyclage chimique) ; elle ne couvre pas a priori une huile vendue comme combustible. Le texte ne définit pas le recyclage chimique dans l'extrait lu."
  parametres: [seqe_incineration_proposition_2026, seqe_perimetre_pyrolyse]

A3-LOYENS-2026-SEQE-DECHETS:
  titre: "European Commission proposal: extension of the EU ETS to waste incineration (From monitoring to surrender obligations)"
  editeur: "Loyens & Loeff (cabinet d'avocats)"
  date: "2026-07"
  type: entreprise
  url: "https://www.loyensloeff.com/insights/news--events/news/european-commission-proposal-extension-of-the-eu-ets-to-waste-incineration/"
  emplacement: "Article web, corps du texte"
  contenu: "Selon le cabinet, la proposition du 17/07/2026 soumettrait l'incinération des déchets municipaux à la tarification carbone à partir de 2031 ; restitutions égales à 25 % des émissions de 2031, 50 % en 2032, 75 % en 2033, 100 % à partir de 2034 ; exemption temporaire possible jusqu'à l'année de référence 2035 si au moins deux de trois conditions sont remplies, demande à notifier au plus tard le 31/07/2029 ; captage du carbone éligible au soutien (Industrial Decarbonisation Bank, Fonds d'innovation, Fonds de modernisation)."
  citation: "On 17 July 2026, the European Commission published a proposal to revise the EU Emissions Trading System. ; equivalent to 25% of the relevant total in 2031, 50% in 2032, 75% in 2033 and 100% as of 2034 ; The Member State must notify its request to the Commission by 31 July 2029."
  statut: secondaire
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Source commerciale (cabinet) qui résume la proposition COM(2026) 616 ; les pourcentages et la date du 31/07/2029 n'ont pas été lus dans le texte primaire (articles tronqués)."
  parametres: [seqe_incineration_proposition_2026]

