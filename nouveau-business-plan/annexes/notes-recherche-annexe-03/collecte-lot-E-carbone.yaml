A3-FR-ARRETE-LBC-2025:
  titre: "Arrêté du 5 septembre 2025 définissant le référentiel du Label bas carbone (JO n° 208 du 7 septembre 2025)"
  editeur: "Ministère chargé de l'écologie (texte reproduit par INERIS, AIDA)"
  date: "2025-09-05"
  type: reglementaire
  url: "https://aida.ineris.fr/reglementation/arrete-050925-definissant-referentiel-label-bas-carbone"
  emplacement: "Articles 2, 3, 6, 8, 15, 19"
  contenu: "Remplace l'arrêté du 28/11/2018 (abrogé par son article 33, voir https://aida.ineris.fr/reglementation/arrete-281118-definissant-referentiel-label-bas-carbone-abroge). Crédits seulement pour des projets additionnels, au-delà d'un scénario de référence qui intègre les obligations réglementaires ; éligibilité limitée aux projets réduisant les émissions au sens d'une méthode approuvée ; exclusion des émissions directement soumises au SEQE-UE ; crédits non utilisables pour les obligations de restitution ni pour la CDN. Une nouvelle méthode passe par note de concept, avis DGEC, avis du Groupe scientifique et technique, consultation publique, approbation du DGEC. Aucune mention des déchets ou de l'économie circulaire dans le texte."
  citation: "Les crédits carbone ne peuvent être générés que par des projets additionnels. ; Seules les réductions d'émissions et les séquestrations allant au-delà de ce scénario de référence sont reconnues. ; Tout projet permettant de réduire les émissions anthropiques de gaz à effet de serre, au sens d'une méthode approuvée ; à l'exception de celles directement soumises au système d'échange de quotas d'émissions de l'Union européenne"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch sur AIDA. Conséquence : sans méthode approuvée couvrant le traitement des déchets ou la pyrolyse, aucun crédit Label bas-carbone n'est possible ; développer une méthode est une procédure longue (articles 6 et 15)."
  parametres: [label_bas_carbone_conditions]

