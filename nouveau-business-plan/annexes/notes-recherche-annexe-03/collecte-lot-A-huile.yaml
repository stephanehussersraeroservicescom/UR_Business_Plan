A3-CODE-ENV-L541-4-3:
  titre: "Article L541-4-3 du code de l'environnement (sortie du statut de déchet), reproduction"
  editeur: "OPPBTP (preventionbtp.fr), reproduction du code de l'environnement, mise à jour du 2 juillet 2026"
  date: "2026-07-02 (date de mise à jour de la page)"
  type: reglementaire
  url: "https://content.preventionbtp.fr/pdf/droit_de_la_prevention/article-l541-4-3-du-code-de-l-environnement-sortie-du-statut-de-dechet.pdf"
  emplacement: "Article L541-4-3, I, I bis, I ter, III, IV"
  contenu: "Un déchet cesse d'être un déchet après traitement et valorisation s'il remplit quatre conditions (usage spécifique, demande ou marché, exigences techniques et normes produits, absence d'effets nocifs). I bis : l'autorité administrative définit les critères (arrêtés). I ter : un produit fabriqué dans une installation de production utilisant des déchets n'est pas un déchet s'il est similaire à celui fabriqué sans déchets et satisfait les conditions du I. III : le premier metteur sur le marché d'une matière sortie du statut de déchet respecte la législation sur les substances chimiques et les produits (REACH implicitement)."
  citation: "Un déchet cesse d'être un déchet après avoir été traité et avoir subi une opération de valorisation, | il existe une demande pour une telle substance ou objet ou elle répond à un marché ; | respecte les exigences pertinentes de la législation applicable sur les substances chimiques"
  statut: secondaire
  consulte: 2026-10-15
  note: "Reproduction par un organisme (OPPBTP), Légifrance inaccessible ; texte modificatif non indiqué. La portée exacte du I ter pour une huile de pyrolyse n'est pas établie."
  parametres: [statut_dechet_huile]

A3-DECRET-2012-602-SSD:
  titre: "Décret n° 2012-602 du 30 avril 2012 relatif à la procédure de sortie du statut de déchet (articles D. 541-12-4 et suivants du code de l'environnement)"
