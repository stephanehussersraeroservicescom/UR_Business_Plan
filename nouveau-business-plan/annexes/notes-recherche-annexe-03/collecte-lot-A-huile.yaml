A3-ARRETE-SSD-HUILE-PYROLYSE-2024:
  titre: "Arrêté du 19 février 2024 fixant les critères de sortie du statut de déchet pour l'huile de pyrolyse issue de la pyrolyse de déchets de matières plastiques, en vue d'une valorisation matière au sein d'une installation pétrochimique relevant de la directive 2010/75/UE, pour un usage dans une unité de vapocraquage ou dans une unité de purification à destination d'une unité de vapocraquage (NOR TREP2403460A)"
  editeur: "Ministère de la transition écologique ; JO n° 56 du 7 mars 2024 ; texte reproduit par AIDA (INERIS)"
  date: "2024-02-19"
  type: reglementaire
  url: "https://aida.ineris.fr/reglementation/arrete-190224-fixant-criteres-sortie-statut-dechet-lhuile-pyrolyse-issue-pyrolyse"
  emplacement: "Notice ; art. 1er (définitions), art. 2 a) à h) ; art. 3 à 7 ; annexe I sections 1.1 à 1.3, 2.1, 3.3 (tableaux A et B), 4.4 ; annexe II"
  contenu: "Seule voie française de sortie du statut de déchet pour l'huile de pyrolyse de plastiques : usage matière en vapocraqueur (rubrique ICPE 3410) ou purification préalable, avec contrat de cession avec une installation pétrochimique IED (points 1.2 ou 4.1). Production de pyrolyse soumise à autorisation ICPE. Intrants : liste fermée de codes déchets plastiques (dont 15 01 02, 15 01 05, 15 01 06, 19 12 04, 20 01 39 ; pas d'ordures ménagères résiduelles 20 03 01), PE + PP + PS au moins 85 % de la matière sèche, PVC au plus 3 %, PET < 5 %, PU < 5 %, ABS < 10 %, humidité au plus 10 %. Huile, tableau A (sans purification) : soufre 3 000 ppm ; azote 5 000 ppm ; oxygène total 10 000 ppm ; somme Br + Cl + F + I 500 ppm (dont F 10, Br 5) ; somme métaux (Al, Cr, Co, Cu, Mn, Ni, V, Fe, Zn, Ca, Mg, K, Cd, Ti) 500 ppm ; As + Hg + Pb + Sb 10 ppm. Tableau B (avec purification, pour les composés traités) : soufre 5 000 ; azote 10 000 ; oxygène 40 000 ; halogènes 30 000 (dont Br 100, F 100) ; métaux 5 000 ; As + Hg + Pb + Sb 100 ppm. Lot au plus 2 semaines de production, analyses au moins mensuelles, attestation de conformité par lot, conformité REACH et CLP (annexe I, 3.4). La notice précise que la production de combustible n'est pas du recyclage. Comparaison : chlore mesuré 1 370 à 5 260 ppm, supérieur au plafond de 500 ppm du tableau A, inférieur au plafond de 30 000 ppm du tableau B ; intrants ordures ménagères hors champ."
  citation: "est au moins de 85 % en masse de matière sèche | Somme des halogénés : Br + Cl + F + I | 500 ppm | Somme des halogénés : Br + Cl + F + I | 30 000 ppm | la production de combustible n'est pas considérée comme du recyclage | inférieure ou égale à 3 % en masse de matière sèche en PVC"
  statut: lu
  consulte: 2026-10-15
  note: "Lu via WebFetch sur AIDA (deux pages concordantes : node/42293 et la page réglementation). Légifrance inaccessible. AIDA n'indique aucune modification ultérieure. Pas de teneur en eau ni de point d'éclair fixés pour l'huile."
  parametres: [ssd_huile_pyrolyse_criteres, ssd_huile_pyrolyse_halogenes, ssd_huile_pyrolyse_intrants, debouche_vapocraqueur]

