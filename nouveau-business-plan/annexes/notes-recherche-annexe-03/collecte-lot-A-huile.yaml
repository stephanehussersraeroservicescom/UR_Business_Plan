A3-REACH-ART2-2006:
  titre: "Règlement (CE) n° 1907/2006 (REACH), article 2, paragraphes 2 et 7 d), texte adopté"
  editeur: "Union européenne, JO L 396 du 30/12/2006 ; PDF reproduit par legislation.gov.uk"
  date: "2006-12-18"
  type: reglementaire
  url: "https://www.legislation.gov.uk/eur/2006/1907/pdfs/eur_20061907_adopted_en.pdf"
  emplacement: "Article 2(2), p. L 396/48 ; article 2(7)(d), p. L 396/52 à 53 (pagination indiquée par l'outil)"
  contenu: "Les déchets ne sont pas des substances, mélanges ou articles au sens de REACH (art. 2(2)). Une substance valorisée est exemptée d'enregistrement seulement si elle est identique à une substance déjà enregistrée et si les informations de sécurité de cette substance sont disponibles pour l'établissement qui valorise (art. 2(7)(d)). Une huile sortie du statut de déchet doit donc être enregistrée par Urban Rig sauf à démontrer l'identité avec une substance enregistrée."
  citation: "Waste as defined in Directive 2006/12/EC of the European Parliament and of the Council | substances, on their own, in preparations or in articles, which have been registered in accordance with Title II"
  statut: lu
  consulte: 2026-10-15
  note: "EUR-Lex inaccessible ; texte d'origine (2006), la référence à la directive 2006/12 vaut aujourd'hui directive 2008/98. Citations partielles : la suite de l'article 2(7)(d) a été résumée par l'outil, pas citée."
  parametres: [reach_huile_pyrolyse]

