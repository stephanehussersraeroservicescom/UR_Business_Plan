  emplacement: "Section 1 (introduction, p. 2), sections 2.2.1, 2.2.3.2, 2.2.4"
  contenu: "Les déchets ne sont pas des substances au sens de REACH ; à la sortie du statut de déchet, les exigences de REACH s'appliquent comme pour tout autre matériau ; exemption de l'art. 2(7)(d) si la substance valorisée est identique à la substance enregistrée et si les fiches (art. 31 ou 32) sont disponibles ; une matière valorisée de composition variable peut être traitée comme UVCB. Le guide ne mentionne pas les huiles de pyrolyse."
  citation: "ne sont pas une substance, une préparation ou un article au sens de l'article 3 | les exigences de REACH s'appliquent en principe de la même manière que pour un autre matériau | la substance qui résulte du processus de valorisation est identique à la substance qui a été enregistrée"
