A3-AIDA-AM-23052016-COMBUSTION-CSR:
  titre: "Arrêté du 23/05/16 relatif aux installations de production de chaleur et/ou d'électricité à partir de déchets non dangereux préparés sous forme de combustibles solides de récupération dans des installations prévues à cet effet [...] (rubrique 2971)"
  editeur: "INERIS (AIDA), texte du ministère chargé de l'environnement"
  date: "2016-05-23 (JO du 25/05/2016), modifié en 2017, 2020, 01/12/2025 et 04/06/2026"
  type: reglementaire
  url: "https://aida.ineris.fr/reglementation/arrete-230516-relatif-installations-production-chaleur-etou-delectricite-a-partir"
  emplacement: "articles 1, 2, 7, 8, 17, 18 ; rubrique Texte modifié par"
  contenu: "Champ : installations de co-incinération soumises à autorisation sous la rubrique 2971. Le CSR y est défini comme un combustible préparé dans une installation de préparation des CSR ; les combustibles doivent avoir une qualité constante en PCI ; contrôle visuel de chaque lot, analyse annuelle par fournisseur des paramètres de l'article 5 de l'arrêté préparation ; refus immédiat d'un lot non conforme. Les valeurs limites d'émission sont en annexe I (non reproduite sur la page). Dernière modification : arrêté du 4 juin 2026 (JO n° 141 du 18/06/2026)."
  citation: "« Le présent arrêté fixe les prescriptions applicables aux installations de co-incinération soumises à autorisation » [...] « un combustible préparé dans une installation de préparation des CSR » [...] « Les combustibles utilisés présentent une qualité constante dans le temps en matière de PCI. »"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Réserve importante : un char de pyrolyse n'est pas un CSR « préparé dans une installation de préparation des CSR » au sens de la définition ; son admission dans une chaufferie 2971 n'est donc pas acquise (point à faire trancher par la DREAL ; aucune source lue ne traite ce cas). L'annexe I n'est pas lisible sur AIDA."
  parametres: [char_debouche_chaufferie_csr]

