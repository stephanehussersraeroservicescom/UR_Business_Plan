A3-VICAT-CRECHY-CARBOR-2008:
  titre: "Arrêté complémentaire n° 3024/08 : société VICAT, cimenterie de Créchy, essais de co-incinération de CARBOR (sous-produit de thermolyse de déchets ménagers)"
  editeur: "Préfecture de l'Allier (Géorisques)"
