A3-PURO-BIOCHAR-METHODOLOGIE-2025-V2:
  titre: "Puro.earth Certification Framework, Biochar, Edition 2025, v. 2"
  editeur: "Puro.earth"
  date: "2025-11-27 (approbation)"
  type: norme
  url: "https://7518557.fs1.hubspotusercontent-na1.net/hubfs/7518557/Puro%20Biochar%20Methodology%20-%20Edition%202025%20(version%202)%20-%20For%20Publication.pdf"
  emplacement: "glossaire ; sections 3.1.1, 3.4.4, 3.4.5 (catégories A et J non admises), 3.4.8, 3.4.16, 3.4.24, 3.4.26"
  contenu: "La biomasse est la matière organique d'origine récente ; toute part de matière non démontrée éligible rend le biochar inéligible. Les déchets municipaux en mélange et assimilés (catégorie A) ne sont pas admis, même après tri post-collecte d'une fraction organique. Plastiques non volatilisables, composites et caoutchoucs synthétiques interdits ; thermoplastiques ajoutés limités à 5 % m/m sec ; carbone fossile du gisement estimé et considéré comme intégralement réémis. Conclusion du sous-agent : un char de déchets municipaux et plastiques mélangés n'est pas éligible aux CORC Puro."
  citation: "« Mixed municipal solid waste (MSW) and assimilated waste. » [...] « Any share of biomass feedstock which cannot be demonstrated to be eligible will lead to the resulting biochar not being eligible. » [...] « The inclusion of non-volatilizing plastics, composite materials or synthetic rubbers » [...] « the total plastic content must not exceed 5% w/w (dry basis). » [...] « Biomass is not allowed to be mixed and co-fired with fossil coal nor fossil oil. »"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Norme privée d'un registre de crédits volontaires. Les limites de métaux lourds du biochar (section 3.5 et suivantes) n'ont pas été lues (troncature)."
