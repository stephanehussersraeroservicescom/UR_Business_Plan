A3-CE-L541-4-3-REPRO:
  titre: "Article L541-4-3 du code de l'environnement (sortie du statut de déchet), reproduction"
  editeur: "OPPBTP (preventionbtp.fr), reproduction du code de l'environnement"
  date: "2026-07-02 (mise à jour de la page)"
  type: reglementaire
