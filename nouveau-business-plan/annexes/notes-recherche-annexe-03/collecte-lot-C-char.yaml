A3-UE-REG-2024-3012-CRCF:
  titre: "Règlement (UE) 2024/3012 du Parlement européen et du Conseil établissant un cadre de certification de l'Union relatif aux absorptions permanentes de carbone, à l'agriculture carbonée et au stockage du carbone dans des produits"
  editeur: "Parlement européen et Conseil (EUR-Lex)"
  date: "2024-11-27"
