A3-UE-REG-DELEGUE-2026-285-CRCF:
  titre: "Commission Delegated Regulation (EU) 2026/285 of 3 February 2026 supplementing Regulation (EU) 2024/3012 by establishing the certification methodologies for permanent carbon removals activities"
  editeur: "Commission européenne (EUR-Lex)"
  date: "2026-02-03 (JO L du 17/04/2026)"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32026R0285"
  emplacement: "considérant 10 ; annexe, section 2.2.3 (définition de Qbiochar) ; section 2.2.5.2(e)"
  contenu: "Lorsque le biochar est le produit principal (50 % ou plus des sorties d'énergie), l'activité BCR ne peut utiliser que des déchets ou résidus au sens de la directive (UE) 2018/2001. La masse de biochar créditée exclut toute fraction issue de matière non biogénique co-traitée ; si plus de 2 % du carbone du gisement peut être non biogénique, la fraction biogénique doit être mesurée par le carbone 14. Le biochar doit respecter les seuils de substances limitées des sections 4.4.1 à 4.4.3 (non lues). Conclusion du sous-agent : seule la fraction biogénique (mesurée au 14C) d'un char de déchets mélangés pourrait au mieux être comptée, sous réserve de l'éligibilité du gisement (section 4, non lue) et des seuils de contaminants."
  citation: "« can only use feedstocks coming from waste or residue as defined in Article 2, points (23) and (43), » [...] « The mass of biochar shall exclude any fraction from non-biogenic material also processed in the biochar production process. » [...] « If the biochar feedstock may be expected to contain a fraction of non-biogenic carbon greater than 2 % » [...] « shall be identified by carbon 14 (14C) testing; »"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Les sections 4.1 à 4.4 de l'annexe (durabilité, gisements admis, seuils de contaminants) n'ont pas pu être atteintes (page EUR-Lex tronquée, document du Conseil ST 6272/26 ADD 1 aussi tronqué). Le projet de 2025 (koda.ee) indiquait que le char co-traité avec de la matière non biogénique ne peut pas être appliqué aux sols ; cette mention n'a pas été retrouvée dans le texte adopté lu (citation non obtenue)."
  parametres: [char_credit_carbone_eligibilite]

