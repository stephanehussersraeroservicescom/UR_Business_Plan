  contenu: "Une absorption de carbone est le retrait anthropique de carbone de l'atmosphère et son stockage durable ; une absorption permanente capte et stocke du carbone atmosphérique ou biogénique pendant plusieurs siècles. Le carbone fossile d'un plastique n'est ni atmosphérique ni biogénique (déduction du sous-agent)."
