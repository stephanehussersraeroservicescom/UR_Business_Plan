  emplacement: "article 3.2 (caractéristiques du CARBOR) ; article 7 (déchets admis)"
  contenu: "Précédent direct d'un char de thermolyse d'ordures ménagères (CARBOR, site Arthelyse de Saint-Laurent-Blangy) en cimenterie : essais de 6 mois autorisés ; caractéristiques maximales du CARBOR : PCI sur sec 2 800 à 3 600 kcal/kg (environ 11,7 à 15,1 MJ/kg, conversion du sous-agent), chlore total 0,2 à 0,5 %, soufre total 0,3 à 0,5 % ; au plus 20 % de CARBOR dans le mélange. Critères généraux du site : refus des déchets dangereux à plus de 10 mg/kg de Hg, plus de 100 mg/kg de Cd+Tl+Hg, plus de 10 000 mg/kg de métaux lourds ; refus des déchets à plus de 4 % de chlore ; déchets non dangereux limités à 4 % de soufre."
  citation: "« PCI sur sec Kcal/kg 2 800 3 600 » [...] « Chlore total % 0,2 0,5 » [...] « Soufre total % 0,3 0,5 » [...] « avec une proportion maximale de CARBOR® de 20% dans le mélange » [...] « les déchets dangereux contenant plus de 100 mg/kg de cadmium, thallium, mercure et leurs composés » [...] « les déchets à teneur en chlore supérieure à 4 % »"
  statut: ancien
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Donnée de 2008 (plus de huit ans) ; autorisation d'essai propre à un site, pas une spécification générale. Le char Urban Rig (PCS 32 MJ/kg sur char d'uréthane) aurait un PCI bien supérieur au CARBOR ; Cd 31-36 mg/kg compatible avec le seuil 100 mg/kg (Cd+Tl+Hg) ; chlore non mesuré, donc conformité au seuil 0,5 % inconnue."
  parametres: [char_debouche_cimenterie, char_spec_cimenterie]

