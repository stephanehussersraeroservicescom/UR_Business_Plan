  emplacement: "article L541-4-3, I"
  contenu: "Un déchet cesse d'être un déchet s'il remplit l'ensemble de quatre conditions (usage spécifique, demande ou marché, exigences techniques et normes produits, absence d'effets globaux nocifs). Tant que ces conditions ne sont pas reconnues par une procédure, le char reste un déchet et sa combustion relève de la co-incinération."
