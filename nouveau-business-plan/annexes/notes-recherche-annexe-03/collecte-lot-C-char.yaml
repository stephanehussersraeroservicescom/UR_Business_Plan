  contenu: "Un déchet est dangereux HP 7 s'il contient une substance cancérogène Carc. 1A ou 1B à 0,1 % ou plus, ou Carc. 2 à 1,0 % ou plus. Calcul du sous-agent (non écrit dans la source) : Cd 31 à 36 mg/kg = 0,0031 à 0,0036 % en cadmium élément, très en dessous de 0,1 % même si tout le cadmium était sous forme d'un composé Carc. 1B ; cela ne suffit pas à conclure sur le classement (autres propriétés HP, notamment HP 14, non évaluées ; spéciation et hydrocarbures du char non mesurés)."
