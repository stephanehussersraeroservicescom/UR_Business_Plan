  note: "Lu le 15/10/2026 via WebFetch (libellés restitués par l'outil). La page de métadonnées nrg_pc_204_sims lue via WebFetch donne la même définition (« ID: customers consuming 2000 MWh or more but less than 20000 MWh. », mise à jour indiquée 1 février 2024) mais la même URL renvoie 404 dans le navigateur ; la page nrg_pc_205_sims renvoie une erreur ou 404. La bande ID est donc la bonne pour 4,7 à 5,3 GWh/an ; les valeurs IE déjà au registre ne correspondent pas au profil de l'usine."
