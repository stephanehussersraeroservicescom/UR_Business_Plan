  emplacement: "réponse, points 1/ (électricité) et 3/ (combustibles)"
  contenu: "Accise sur l'électricité, tarifs normaux au 1er février 2026 : catégories « PME » et « haute puissance » 20,92 EUR/MWh avant majoration ZNI, 26,58 EUR/MWh après majoration ZNI (janvier 2026 : 20,90 EUR/MWh avant majoration). Ménages 30,85 EUR/MWh après majoration. Tarifs réduits industriels (art. L. 312-48, L. 312-64, L. 312-65 CIBS) de 0 à 12 EUR/MWh ; grille industrielle ramenée de sept à quatre tarifs au 1er janvier 2026. Accise sur les combustibles (charbons, fiouls lourds, fiouls domestiques, gaz naturel) au 1er février 2026 : 10,73 EUR/MWh avant majoration ZNI, 16,39 EUR/MWh après."
  citation: "Les tarifs normaux, après application de la majoration ZNI susmentionnée, s'établiront alors comme suit : 30,85 €/MWh pour la catégorie « ménages et assimilés » ; 26,58 €/MWh pour la catégorie « PME » ; 26,58 €/MWh pour la catégorie « haute puissance »."
  statut: lu
  consulte: 2026-10-15
  note: "Lu le 15/10/2026 via le navigateur. Rescrit publié avant l'adoption de la loi de finances pour 2026 : les montants sont « sous réserve des modifications législatives » (combustibles). Une baisse des tarifs pleins au 1er août 2026 est signalée par EDF (A3-EDF-TAXES-ELEC-2026), non vérifiée dans un texte officiel. Un site de 600 kW relève de la catégorie « haute puissance » (> 250 kVA) ; l'éligibilité à un tarif réduit industriel (0 à 12 EUR/MWh) n'est pas établie."
  parametres: [accise_electricite_2026, accise_combustibles_2026]

