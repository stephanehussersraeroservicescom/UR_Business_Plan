A3-BOFIP-RES-EAT-000240-2025-12-31:
  titre: "BOI-RES-EAT-000240 : Modalités pratiques d'application des tarifs d'accise sur l'électricité et les combustibles à compter du 1er janvier 2026 en l'absence d'adoption de la loi de finances pour 2026"
