A3I-FR-CEE-IND-UT-137:
  titre: "Fiche d'opération standardisée IND-UT-137 (vA84-3 à compter du 25/05/2026) : Système de pompe(s) à chaleur en rehausse de température de chaleur fatale récupérée"
  editeur: "Ministère de la transition écologique"
  date: "2026-05-25"
  type: reglementaire
  url: "https://www.ecologie.gouv.fr/sites/default/files/documents/IND-UT-137%20vA84-3%20%C3%A0%20compter%20du%2025-05-2026.pdf"
  emplacement: "Sections 1 (secteur), 2 (dénomination), 3 (conditions), 4 (montant)"
  contenu: "Seule fiche standardisée industrie lue qui valorise de la chaleur fatale d'un procédé du même site, y compris sur un site neuf, via des pompes à chaleur électriques (≤ 5 MW) ; montant 10,986 × (Q – Eélec) kWh cumac. Liste des 34 fiches industrie de la page ministérielle relevée : récupération de chaleur sur compresseur d'air (IND-UT-103), économiseur et condenseur sur fumées de chaudière vapeur (IND-UT-104, 130), brûleur avec récupération sur four (IND-UT-118), conversion de chaleur fatale en électricité ou air comprimé (IND-UT-138), stockage de chaleur fatale (IND-UT-139). Aucune fiche ne vise la valorisation d'un gaz de procédé ou de pyrolyse en combustible. Hors fiche, la voie est l'opération spécifique (non lue)."
  citation: "L'opération peut concerner un site existant, un nouveau site, une extension d'un site ; La chaleur fatale valorisée est issue d'un process industriel situé sur le site où l'opération est réalisée."
  statut: lu
  consulte: 2026-10-15
