A3I-UE-DIR-2003-87-ART24A:
  titre: "Directive 2003/87/CE consolidée au 01/03/2024, article 24a « Harmonised rules for projects that reduce emissions »"
  editeur: "Union européenne (EUR-Lex)"
  date: "2024-03-01"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02003L0087-20240301"
