  editeur: "Ministère de la transition écologique, DGEC"
  date: "2025-10-06 (mise à jour de la page)"
  type: reglementaire
  url: "https://label-bas-carbone.ecologie.gouv.fr/presentation-des-methodes-du-label-bas-carbone"
  emplacement: "Rubriques « Les méthodes approuvées » et « Le label bas-carbone ne s'applique pas... »"
  contenu: "Liste nominative officielle : forêt (Boisement, Reconstitution de peuplements forestiers dégradés, Balivage, Gestion forestière à stock continu) ; agriculture (CarbonAgri, Haies, Plantation de vergers, SOBAC'ECO TMM, Ecométhane, Grandes cultures) ; bâtiment (Rénovation, Bâtiment neuf biosourcé) ; transport (Tiers-lieux) ; marin (Herbiers de Posidonie, Restauration de mangroves ou forêts marécageuses) ; urbain (Ville arborée) ; plus Restauration hydraulique des tourbières dégradées (lien de la page d'accueil). Aucune méthode déchets, recyclage, plastiques, pyrolyse ou industrie. La page cite le secteur « déchet » parmi les secteurs diffus visés, exclut les émissions directement soumises au SEQE, mais admet que des réductions INDIRECTES puissent être reconnues pour ces quantités."
  citation: "Un projet ne peut être labellisé que s’il est mis en œuvre conformément à une méthode approuvée ; Le Label bas-carbone vise à susciter le développement de projets dans tous les secteurs diffus : agriculture, forêt, écosystèmes marins, transports, bâtiment, déchet, etc. ; le Label bas-carbone ne s’applique pas aux émissions de GES directement soumises au système d'échange de quotas d'émissions de l'Union européenne (SEQE-UE). ; Des réductions d'émissions indirectes peuvent toutefois être reconnues par le label bas-carbone pour ce type de quantités de GES."
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 dans le navigateur Chrome (mtect.fr/714 redirige vers label-bas-carbone.ecologie.gouv.fr ; texte extrait par script, lecture seule). Le décompte (forêt « trois méthodes » mais quatre noms listés) est celui de la page. Les arrêtés d'approbation de chaque méthode au JO n'ont pas été lus (Légifrance bloqué)."
