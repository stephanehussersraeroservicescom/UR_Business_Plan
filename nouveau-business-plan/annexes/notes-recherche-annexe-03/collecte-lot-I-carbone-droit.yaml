  contenu: "La Commission PEUT adopter des mesures (actes délégués) pour délivrer des quotas ou crédits pour des projets gérés par les États membres réduisant des émissions hors SEQE, sans double comptage. C'est une faculté. Le paragraphe 3 permet à un État membre de refuser des crédits pour certains types de projets sur son territoire. Aucun acte délégué établissant cette procédure n'a été trouvé (voir NON TROUVÉ) : l'article est donc inopérant à ce jour. Le considérant 20 du règlement (UE) 2018/842 (répartition de l'effort) mentionne la possibilité de partenariats public-privé pour ces projets."
  citation: "the Commission may adopt measures for issuing allowances or credits in respect of projects administered by Member States that reduce greenhouse gas emissions not covered by the EU ETS ; Any such measures shall not result in the double-counting of emission reductions ; A Member State can refuse to issue allowances or credits in respect of certain types of projects that reduce greenhouse gas emissions on its own territory."
  statut: lu
