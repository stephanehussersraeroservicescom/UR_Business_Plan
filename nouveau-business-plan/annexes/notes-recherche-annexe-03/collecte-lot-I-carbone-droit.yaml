A3I-UE-DIR-2003-87-ANNEXE-I:
  titre: "Directive 2003/87/CE établissant un système d'échange de quotas d'émission de gaz à effet de serre dans l'Union, version consolidée au 01/03/2024 (CELEX 02003L0087-20240301), article 2(1), article 3(t), annexe I"
  editeur: "Union européenne (EUR-Lex)"
  date: "2024-03-01 (dernière version consolidée listée par EUR-Lex le 15/10/2026)"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02003L0087-20240301"
  emplacement: "Article 2(1) ; article 3, point (t) ; annexe I, point 5 et ligne « Combustion of fuels »"
  contenu: "Le SEQE s'applique aux activités de l'annexe I. La combustion est toute oxydation de combustibles, quel que soit l'usage de l'énergie produite. L'activité « combustion » vise les installations de puissance thermique nominale totale > 20 MW, sauf les installations d'incinération de déchets dangereux ou municipaux ; depuis le 01/01/2024, l'incinération de déchets municipaux > 20 MW est seulement soumise à surveillance et déclaration (articles 14 et 15), sans restitution. Le SEQE est un système de quotas (obligation de restituer), il ne crée aucun crédit pour une installation qui réduit ou évite des émissions. Conséquence pour Urban Rig (lecture du sous-agent) : si la combustion du gaz de pyrolyse sur site dépasse 20 MW thermiques et que l'installation n'est pas une installation d'incinération de déchets municipaux, elle pourrait entrer dans le SEQE comme émetteur (coût), jamais comme générateur de crédits. Puissance thermique du brûleur Urban Rig : non connue du sous-agent, non estimée."
  citation: "This Directive shall apply to the activities listed in Annexes I and III ; ‘combustion’ means any oxidation of fuels, regardless of the way in which the heat, electrical or mechanical energy produced by this process is used ; Combustion of fuels in installations with a total rated thermal input exceeding 20 MW (except in installations for the incineration of hazardous or municipal waste) From 1 January 2024, combustion of fuels in installations for the incineration of municipal waste with a total rated thermal input exceeding 20 MW, for the purposes of Articles 14 and 15."
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 dans le navigateur Chrome de l'utilisateur (EUR-Lex, texte intégral, lecture seule) car WebFetch tronque la page à 119 000 caractères. Version anglaise. Le point 5 de l'annexe I dit aussi : « all units in which fuels are combusted, other than units for the incineration of hazardous or municipal waste, shall be included ». Remplace la fiche secondaire A3-ZWE-SEQE-ART30-2024 pour l'annexe I."
  parametres: [seqe_perimetre_pyrolyse, credit_carbone_seqe]

