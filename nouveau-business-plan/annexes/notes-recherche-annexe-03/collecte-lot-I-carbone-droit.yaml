  parametres: [cee_dispositif]

A3I-UE-DIR-2018-2001-ART2-GO:
  titre: "Directive (UE) 2018/2001 relative à la promotion de l'utilisation de l'énergie produite à partir de sources renouvelables, consolidée au 20/11/2023, article 2"
  editeur: "Union européenne (EUR-Lex)"
  date: "2023-11-20"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02018L2001-20231120"
  emplacement: "Article 2, second alinéa, points (1), (12) et (24)"
  contenu: "La garantie d'origine de la directive prouve une énergie produite à partir de sources renouvelables, non fossiles. La biomasse inclut seulement la fraction biodégradable des déchets d'origine biologique. Une énergie issue des plastiques (fossiles) n'ouvre pas de garantie d'origine renouvelable ; seule la fraction biogénique des ordures ménagères pourrait y prétendre, et Urban Rig ne produit pas d'électricité selon les consignes (gaz brûlé sur place). L'article 19 (régime des garanties d'origine) n'a pas été atteint par l'outil."
  citation: "energy from renewable non-fossil sources ; ‘guarantee of origin’ means an electronic document which has the sole function of providing evidence to a final customer ; that a given share or quantity of energy was produced from renewable sources; ; as well as the biodegradable fraction of waste, including industrial and municipal waste of biological origin;"
