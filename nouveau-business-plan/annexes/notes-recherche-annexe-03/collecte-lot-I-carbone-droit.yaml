A3I-VERRA-VCS-STANDARD-V5:
  titre: "VCS Standard, v5.0"
  editeur: "Verra"
  date: "2025-12-16"
  type: norme
  url: "https://verra.org/wp-content/uploads/2025/12/VCS-Standard-v5.0.pdf"
  emplacement: "Section 2.1.1, tableau 1 (p. 9 à 10 du document, pages 10-11 du PDF) ; section 3.22, règles 3.22.1 à 3.22.6 et notes 91 à 94 (p. 71 à 73)"
  contenu: "Aucune exclusion des pays de l'UE ni de l'annexe I : les unités sans étiquette article 6 peuvent servir au marché volontaire, y compris entre pays de l'annexe I « sauf réglementation contraire de ces pays ». Le tableau 1 réserve aux pays les moins avancés la substitution d'un combustible fossile par un autre moins carboné, MAIS exclut de cette restriction les déchets contenant des produits pétroliers usagés (plastiques usagés, huiles). Interdiction de créditer une réduction déjà couverte par un système d'échange ou une limite contraignante, sauf preuve (lettre de l'administrateur) d'absence de recouvrement ou d'annulation des unités. Interdiction du double crédit avec un autre certificat environnemental lié aux GES. Une méthodologie approuvée applicable reste nécessaire : les deux projets de méthodologies Verra proches (M0417 dépolymérisation de plastiques en produits chimiques, M0173 substitution de plastique vierge) ont été rejetés le 29/03/2026."
  citation: "This applies to all voluntary carbon market transactions globally, including within or between United Nations Framework Convention on Climate Change (UNFCCC) Annex I countries (unless otherwise regulated by those countries). ; Activities involving the following are not restricted to the default eligibility: • Captured flare or vent gas • Waste containing previously used petroleum products (e.g., used plastics, oils, lubricants) ; 3.22.3 Project proponents shall not seek credit for the same GHG emission reduction or carbon dioxide removal with the VCS Program and an emissions trading program or binding emission limit."
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 : PDF bloqué pour WebFetch (robots) et page HTML tronquée ; texte décodé par pdf.js dans un onglet verra.org du navigateur Chrome de l'utilisateur (lecture seule, onglet refermé). v4.7 reste active jusqu'au 01/01/2027. Pages M0417 et M0173 lues via WebFetch : https://verra.org/methodologies/methodology-for-the-production-of-chemical-products-from-raw-materials-derived-from-waste-plastic-depolymerization/ et https://verra.org/methodologies/methodology-for-the-displacement-of-virgin-petroleum-based-plastic-production/ (« Rejected on March 29, 2026 »). Aucune méthodologie VCS active couvrant la pyrolyse de déchets en combustible n'a été trouvée (recherche non exhaustive)."
  parametres: [credits_carbone_vcs_dechets, vcs_eligibilite_ue]

