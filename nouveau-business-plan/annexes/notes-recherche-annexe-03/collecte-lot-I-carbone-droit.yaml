  note: "Lu par un sous-agent de recherche le 15/10/2026 dans le navigateur Chrome (EUR-Lex, texte intégral). L'absence d'acte délégué est un constat de recherche (EUR-Lex), pas une citation d'un texte qui l'affirmerait."
