  contenu: "Ajout par rapport au lot E : l'arrêté définit des crédits INDIRECTS (scope 2 et 3), qui couvrent notamment l'utilisation ultérieure des produits vendus. Une méthode future pourrait donc en théorie reconnaître des réductions indirectes d'une huile ou d'un char se substituant à un combustible fossile chez un client. Usages : contribution ou compensation, sur notification au ministère ; exclus de la CDN et des restitutions SEQE. Le texte ne mentionne ni l'article 6 de l'accord de Paris, ni l'ajustement correspondant, ni le transfert international. La localisation en France n'est pas écrite mais découle de la compétence du préfet de région et de la notification de la commune du projet (le décret 2018-1043 vise le territoire français, voir A3-FR-DECRET-2018-1043)."
