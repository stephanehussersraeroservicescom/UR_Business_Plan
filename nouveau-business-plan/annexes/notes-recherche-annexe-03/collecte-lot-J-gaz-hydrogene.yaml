A3J-UE-DIR-2018-2001-ART2-RCF:
  titre: "Directive (UE) 2018/2001 relative à la promotion de l'utilisation de l'énergie produite à partir de sources renouvelables (texte consolidé au 16.07.2024, intégrant la directive (UE) 2023/2413)"
  editeur: "Union européenne (EUR-Lex)"
  date: "2024-07-16 (version consolidée)"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:02018L2001-20240716"
  emplacement: "article 2, points 24 (biomasse), 35 (carburants à base de carbone recyclé) et 36 (RFNBO)"
  contenu: "Un combustible gazeux (dont l'hydrogène) produit à partir de déchets solides d'origine non renouvelable (plastiques fossiles) qui ne se prêtent pas à la valorisation matière relève de la catégorie « combustibles ou carburants à base de carbone recyclé » (RCF). Il ne peut pas être un RFNBO, dont l'énergie doit provenir de sources renouvelables autres que la biomasse. La fraction biodégradable des déchets municipaux est de la biomasse : la part du gaz issue de la fraction biogénique des ordures ménagères relève donc des règles biomasse (article 29 et 31), pas des RCF."
  citation: "35) «combustibles ou carburants à base de carbone recyclé»: les combustibles ou carburants liquides et gazeux qui sont produits à partir de flux de déchets liquides ou solides d'origine non renouvelable ne se prêtant pas à la valorisation de matières conformément à l'article 4 de la directive 2008/98/CE, ou à partir de gaz issus du traitement des déchets et de gaz d'échappement d'origine non renouvelable qui découlent inévitablement et involontairement de processus de production dans des installations industrielles; 36) «carburants renouvelables d'origine non biologique»: les carburants et combustibles liquides et gazeux dont le contenu énergétique provient de sources renouvelables autres que la biomasse; 24) «biomasse»: [...] ainsi que la fraction biodégradable des déchets, notamment les déchets industriels et municipaux d'origine biologique;"
  statut: lu
  consulte: 2026-10-15
  note: "Lu le 15/10/2026 dans le navigateur Chrome (EUR-Lex refuse WebFetch, robots.txt). Version consolidée du 16.07.2024 ; une consolidation postérieure peut exister. La qualification RCF exige que les déchets « ne se prêtent pas à la valorisation de matières » (hiérarchie des déchets) : à démontrer pour les plastiques entrants."
  parametres: [statut_h2_dechets_plastiques, definition_rcf]

A3J-UE-DIR-2024-1788-ART2:
  titre: "Directive (UE) 2024/1788 concernant des règles communes pour les marchés intérieurs du gaz renouvelable, du gaz naturel et de l'hydrogène"
  editeur: "Union européenne (JO L, 2024/1788)"
  date: "2024"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=OJ:L_202401788"
  emplacement: "article 2, points 11 (hydrogène bas carbone), 12 (gaz bas carbone) et 13 (carburants bas carbone)"
  contenu: "Les carburants bas carbone comprennent les RCF au sens de la directive 2018/2001 et l'hydrogène bas carbone, à condition d'atteindre 70 % de réduction des émissions par rapport au combustible fossile de référence des RFNBO (méthode du règlement 2023/1185). Un hydrogène ou un gaz issu de déchets plastiques fossiles peut donc être « gaz bas carbone » s'il est un RCF atteignant 70 %."
  citation: "11) «hydrogène bas carbone»: l'hydrogène dont la teneur énergétique provient de sources non renouvelables et qui respecte le niveau de réduction des émissions de gaz à effet de serre de 70 % par rapport au combustible fossile de référence pour les carburants renouvelables d'origine non biologique [...] ; 12) «gaz bas carbone»: la part de carburants gazeux présente dans les carburants à base de carbone recyclé, tels qu'ils sont définis à l'article 2, point 35), de la directive (UE) 2018/2001, dans l'hydrogène bas carbone [...] qui respectent le niveau de réduction des émissions de gaz à effet de serre de 70 % [...] ; 13) «carburants bas carbone»: les carburants à base de carbone recyclé, tels qu'ils sont définis à l'article 2, point 35), de la directive (UE) 2018/2001, l'hydrogène bas carbone et les carburants gazeux synthétiques [...] qui respectent le niveau de réduction des émissions de gaz à effet de serre de 70 %"
  statut: lu
  consulte: 2026-10-15
  note: "Lu le 15/10/2026 dans le navigateur Chrome (EUR-Lex refuse WebFetch). Les règles d'injection d'hydrogène aux points d'interconnexion (seuil de mélange) n'ont pas été recherchées dans ce texte (extraction infructueuse)."
  parametres: [statut_h2_dechets_plastiques, seuil_reduction_bas_carbone]

A3J-UE-REG-DEL-2025-2359:
  titre: "Règlement délégué (UE) 2025/2359 de la Commission du 8 juillet 2025 complétant la directive (UE) 2024/1788 en précisant une méthode d'évaluation des réductions des émissions de gaz à effet de serre réalisées grâce aux carburants bas carbone"
  editeur: "Commission européenne (JO série L, 2025/2359, 21.11.2025)"
  date: "2025-07-08 (publié 2025-11-21)"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=OJ:L_202502359"
  emplacement: "considérant 2 ; articles 1 et 2 ; annexe, point 2 (formule et combustible de référence) ; annexe (traitement des intrants biogéniques, déchets municipaux en mélange)"
  contenu: "La méthode « bas carbone » de 2025 EXCLUT les carburants à base de carbone recyclé : pour un hydrogène issu de déchets plastiques fossiles (RCF), c'est le règlement 2023/1185 (déjà au registre) qui s'applique. Seuil 70 %, réduction = (EF - E)/EF, combustible de référence identique à celui des RFNBO du règlement 2023/1185 (94 gCO2e/MJ, valeur déjà au registre). Pour les intrants qui contiennent dès le départ une part biogénique, comme les déchets municipaux en mélange, la part biomasse suit l'article 31 de la directive 2018/2001."
  citation: "(2) La méthode définie dans le règlement délégué (UE) 2023/1185 s'applique pour déterminer les réductions des émissions de gaz à effet de serre réalisées grâce aux carburants renouvelables d'origine non biologique ainsi qu'aux carburants à base de carbone recyclé, qui constituent une sous-catégorie des carburants bas carbone. Il convient donc d'exclure les carburants à base de carbone recyclé du champ d'application de la méthode définie dans le présent règlement. [...] Article premier : Le présent règlement précise la méthode de calcul des réductions des émissions de gaz à effet de serre réalisées grâce aux carburants bas carbone autres que les carburants à base de carbone recyclé. [...] Réductions = (E F – E) / E F [...] Pour tous les carburants bas carbone, le total des émissions provenant du combustible fossile de référence est égal au combustible fossile de référence pour les carburants renouvelables d'origine non biologique défini dans le règlement délégué (UE) 2023/1185. [...] ou lorsque les matières premières utilisées dans le procédé comprennent déjà une part biogénique dès le départ, comme dans le cas des déchets municipaux en mélange."
  statut: lu
  consulte: 2026-10-15
  note: "Lu le 15/10/2026 dans le navigateur Chrome (EUR-Lex refuse WebFetch, robots.txt) ; texte FR de 66 791 caractères, passages extraits par recherche de mots clés, lecture non intégrale de l'annexe. Entrée en vigueur indiquée par EUR-Lex : 11.12.2025 (métadonnées lues via WebFetch). Le signe « = » de la formule a été perdu à l'extraction et rétabli."
  parametres: [statut_h2_dechets_plastiques, methode_bas_carbone_ue, seuil_reduction_bas_carbone]

A3J-FR-ARRETE-2024-07-01-SEUIL-H2:
  titre: "Arrêté du 1er juillet 2024 précisant le seuil d'émissions de gaz à effet de serre et la méthodologie pour qualifier l'hydrogène comme renouvelable ou bas-carbone (modifié par arrêté du 7 juillet 2026)"
  editeur: "Ministre de l'économie (JO n° 157 du 4 juillet 2024, NOR ECOR2323734A), version consolidée AIDA/INERIS"
  date: "2024-07-01, modifié 2026-07-07 (JO n° 171 du 24 juillet 2026)"
  type: reglementaire
  url: "https://aida.ineris.fr/reglementation/arrete-010724-precisant-seuil-demissions-gaz-a-effet-serre-methodologie-qualifier"
  emplacement: "articles 1er, 2 et 3"
  contenu: "Seuil de l'article L. 811-1 du code de l'énergie : 3,38 kgCO2éq/kgH2. Méthode pour l'hydrogène renouvelable : annexe du règlement 2023/1185 ; pour l'hydrogène bas-carbone (depuis l'arrêté du 7 juillet 2026) : annexe du règlement délégué 2025/2359, avec certification par un système volontaire reconnu (régime transitoire par le directeur de l'énergie). L'arrêté ne mentionne ni déchets, ni carbone recyclé ; or le règlement 2025/2359 exclut les RCF : le traitement d'un hydrogène issu de déchets plastiques au regard du seuil français n'est donc pas réglé explicitement (lecture de l'agent, à confirmer juridiquement)."
  citation: "Le seuil d'émissions d'équivalent dioxyde de carbone, exprimé en kilogramme d'équivalent dioxyde de carbone par kilogramme d'hydrogène (kgCO2éq/kgH2), prévu à l'article L. 811-1 du code de l'énergie, est fixé à 3,38 kgCO2éq/kgH2. [...] (Article 3) « Les émissions de gaz à effet de serre [...] d'hydrogène bas-carbone, sont déterminées selon les règles définies pour le calcul des émissions de gaz à effet de serre de l'hydrogène décrites dans l'annexe du règlement délégué (UE) 2025/2359 [...] »"
  statut: lu
  consulte: 2026-10-15
  note: "Lu le 15/10/2026 sur AIDA (INERIS) dans le navigateur Chrome (WebFetch en erreur serveur ; Légifrance bloqué par une vérification anti-robot, non contournée). AIDA est une reprise consolidée, pas le JO."
  parametres: [seuil_h2_bas_carbone_fr, methode_h2_fr]

A3J-CRE-2025-229-AVIS-CDC-H2:
  titre: "Délibération n° 2025-229 du 1er octobre 2025 portant avis sur un projet de cahier des charges relatif à une procédure de mise en concurrence avec dialogue concurrentiel portant sur le soutien à la production d'hydrogène renouvelable ou bas-carbone"
  editeur: "Commission de régulation de l'énergie"
  date: "2025-10-01"
  type: reglementaire
  url: "https://www.cre.fr/fileadmin/Documents/Deliberations/2025/251001_2025-229_Avis_CDC_H2.pdf"
  emplacement: "page 1 (volume), page 3 (objet, durée, 200 MW, note 2 usages), page 8 (plafond), page 10 (notes 15 et 17)"
  contenu: "Le mécanisme de soutien français est réservé à l'hydrogène produit par électrolyse de l'eau (article L. 812-1 du code de l'énergie) : un hydrogène issu de pyrolyse de déchets n'y est PAS éligible. Aide au fonctionnement sur 15 ans, prix d'enchère plafonné à 4 EUR/kg, 1 GW sur trois périodes jusqu'en 2027 (200 MW en 1re période), projets de 5 à 100 MW ; usages exclus : chauffage (sauf > 400 °C), injection réseau de gaz, production d'électricité, transports. Seuil 3,38 kgCO2éq/kgH2 présenté comme -70 % par rapport à l'hydrogène fossile. Rappel de L. 811-1 : renouvelable = électrolyse avec électricité renouvelable ou autre technologie utilisant exclusivement des sources renouvelables ; bas-carbone = émissions inférieures ou égales au seuil."
  citation: "« Conformément à l'article L. 812-1 du code de l'énergie qui indique que le soutien est exclusivement réservé à la production d'hydrogène renouvelable ou bas carbone par électrolyse de l'eau. » ; « Enfin, le prix d'enchère est plafonné à 4 € par kilogramme d'hydrogène produit. » ; « Hydrogène bas-carbone = « l'hydrogène dont le procédé de production engendre des émissions inférieures ou égales au seuil retenu pour la qualification d'hydrogène renouvelable (…). » ; « Fixé à 3,38 kgCO2éq/kgH2, il permet de réduire les émissions de gaz à effet de serre de 70 % par rapport à l'hydrogène fossile. »"
  statut: lu
  consulte: 2026-10-15
  note: "Lu le 15/10/2026 via WebFetch (citations restituées par l'outil en extraits). Le texte de l'article L. 811-1 est cité ici par la CRE, pas lu sur Légifrance (bloqué) : statut secondaire pour L. 811-1 lui-même. Il s'agit d'un avis sur un PROJET de cahier des charges ; le cahier des charges définitif et les résultats n'ont pas été lus. L'hydrogène carboné (ni renouvelable ni bas-carbone) n'est pas défini dans l'extrait."
  parametres: [soutien_h2_france, eligibilite_h2_pyrolyse, plafond_aide_h2]

A3J-AIDA-RAPPORT-ORD-2021-167:
  titre: "Rapport au Président de la République relatif à l'ordonnance n° 2021-167 du 17 février 2021 relative à l'hydrogène"
  editeur: "Gouvernement (reprise AIDA/INERIS)"
  date: "2021-02-17"
  type: reglementaire
  url: "https://aida.ineris.fr/reglementation/rapport-president-republique-relatif-a-lordonnance-ndeg-2021-167-170221-relative-a"
  emplacement: "corps du rapport, 2e et 3e paragraphes"
  contenu: "L'ordonnance définit trois types d'hydrogène (renouvelable, bas carbone, carboné) et deux systèmes de traçabilité : garanties d'origine (cessibles séparément) et garanties de traçabilité (cédées avec l'hydrogène), gérées par un organisme indépendant. Ces garanties ne concernent que l'hydrogène renouvelable ou bas-carbone : un hydrogène issu de déchets plastiques qui ne serait ni l'un ni l'autre (hydrogène carboné) n'y aurait pas accès."
  citation: "La présente ordonnance que nous soumettons à votre approbation définit les différents types d'hydrogènes qui feront l'objet de régimes particuliers, hydrogène renouvelable, bas carbone ou carboné. Il prévoit deux systèmes de traçabilité de l'hydrogène pour que son caractère bas-carbone ou renouvelable puisse être connu de l'acheteur [...] Les garanties d'origine et de traçabilité seront gérées par un organisme indépendant, sur le modèle de celui qui existe déjà pour les garanties d'origine de l'électricité renouvelable."
  statut: lu
  consulte: 2026-10-15
  note: "Lu le 15/10/2026 sur AIDA dans le navigateur Chrome. Le texte de l'ordonnance (articles L. 811-1, L. 821-1 et suivants) et ses décrets d'application n'ont pas été lus (Légifrance bloqué) ; le projet d'ordonnance soumis à consultation (consultations-publiques.developpement-durable.gouv.fr, 202210113_ordonnance_consultation_v2.pdf) est un projet non daté, non retenu. Organisme gestionnaire désigné et prix des garanties : non trouvés."
  parametres: [tracabilite_h2_france]

A3J-ACER-H2-MARKETS-2025:
  titre: "European hydrogen markets, 2025 Monitoring Report"
  editeur: "ACER (Agence de l'Union européenne pour la coopération des régulateurs de l'énergie)"
  date: "2025 (données janvier à octobre 2025 ; webinaire 9 décembre 2025)"
  type: etude_publique
  url: "https://www.acer.europa.eu/sites/default/files/documents/Publications/ACER-2025-European-hydrogen-markets.pdf"
  emplacement: "pages 40 et 41 (paragraphes 78 à 80, figure 15, notes 65 et 66)"
  contenu: "Coûts de production (estimations S&P Global, janv.-oct. 2025) : hydrogène conventionnel par vaporeformage (SMR) un peu plus de 2 EUR/kg ; SMR avec captage 2,8 EUR/kg (hors transport et stockage du CO2) ; électrolyse Pays-Bas environ 7 EUR/kg (oct. 2025) ; RFNBO environ 8 EUR/kg (7 à 10 selon le pays). Prix de marché : indice EEX HYDRIX (hydrogène « vert », pas nécessairement renouvelable, offert en Allemagne) environ 8,2 EUR/kg en moyenne 2025, contre environ 7,8 EUR/kg en 2023 ; indice MIBGAS IBHYX (coût de production RFNBO, Espagne) autour de 6 EUR/kg en 2025 ; HYCLICX (coût marginal Pays-Bas) entre 6 et 8 EUR/kg depuis mi-2025."
  citation: "in 2025 (January to October), the average cost of conventional hydrogen produced via SMR was a bit higher than 2 EUR/kg, following the price trend of natural gas. Carbon capture brings the average cost of abated hydrogen during the same period to 2.8 EUR/kg, excluding CO 2 transportation and storage costs. [...] Notably, the average cost of RFNBO hydrogen remains significantly higher at around 8 EUR/kg, ranging between 7-10 EUR/kg [...] The market-based HYDRIX index issued by the European Energy Exchange (EEX) for renewable hydrogen has seen a slight increase in 2025, averaging approximately 8.2 EUR/kg up from approximately 7.8 EUR/kg in 2023. [...] EEX HYDRIX is a market-based index that aims to reflect the price for “green”, not necessarily renewable, hydrogen offered in Germany."
  statut: lu
  consulte: 2026-10-15
  note: "PDF lu le 15/10/2026 dans le navigateur Chrome (WebFetch refusé, robots.txt), texte extrait par pdf.js. Les coûts SMR sont des estimations S&P Global (source commerciale) reprises par ACER. Les valeurs HYDRIX sont reprises par ACER : les valeurs publiées par EEX elles-mêmes n'ont pas été lues (statut secondaire pour HYDRIX). Coût SMR de 2025 antérieur à la hausse du gaz de 2026 (Banque mondiale au registre : 25,42 USD/mmbtu en sept. 2026)."
  parametres: [cout_h2_gris_ue, cout_h2_bas_carbone_ue, cout_h2_renouvelable_ue, prix_hydrix]

