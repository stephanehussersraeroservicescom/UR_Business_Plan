  date: "2024-07-30"
  type: entreprise
  url: "https://eqs-news.com/news/corporate/pyrum-innovations-ag-concludes-framework-agreement-with-continental-for-long-term-acceptance-of-its-recovered-carbon-black/2101995"
  emplacement: "corps du communiqué"
