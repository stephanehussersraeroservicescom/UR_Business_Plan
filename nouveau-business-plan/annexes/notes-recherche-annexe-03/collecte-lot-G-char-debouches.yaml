  contenu: "Allemagne : le chlore des CSR destinés aux cimenteries doit être inférieur à 1 % ; PCI des CSR 12 à 18 MJ/kg ; livraison aux cimenteries en granulométrie 0-50 mm et 0-80 mm. Exemple de chaîne de prix : l'entreprise paie 150 EUR/t au fabricant de CSR, qui paie 50 EUR/t à la cimenterie pour qu'elle prenne le CSR ; la cimenterie ou la centrale paie un prix négatif pour son combustible. 1,16 Mt de plastiques utilisés comme combustibles de substitution en 2019 (cimenteries, centrales)."
  citation: "« So muss der Chlorgehalt von EBS unter 1 Prozent liegen. » [...] « in einer Korngröße von 0 bis 50 und 0 bis 80 Millimetern gehen die klimaschonenden EBS an Zement-Fabriken » [...] « 150 Euro pro Tonne an den EBS-Hersteller, der wiederum 50 Euro pro Tonne EBS an das Zementwerk abgibt. »"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Source d'entreprise (opérateur de déchets) ; le prix de 50 EUR/t est présenté comme un exemple de calcul, pas comme un prix de marché constaté. Concorde avec FNADE 2023 (gate fee CSR payé par le producteur, déjà au registre) et contredit la fourchette « vente 0 à 50 EUR/t » de l'Observatoire normand 2021. Le char Urban Rig (32 MJ/kg PCS) a un PCI très supérieur à ces CSR, ce qui n'est pas valorisé dans cet exemple."
  parametres: [char_prix_csr_cimenterie, char_spec_cimenterie, char_export_allemagne]

