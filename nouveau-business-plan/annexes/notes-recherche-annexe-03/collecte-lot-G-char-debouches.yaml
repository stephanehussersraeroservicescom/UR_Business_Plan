A3G-KHI-GOMI-TANKA-NENRYO:
  titre: "ごみ炭化燃料化システム (système de transformation des ordures en combustible carbonisé), dossier de prix 優秀環境装置, 日本産業機械工業会会長賞"
  editeur: "川崎重工業株式会社 (Kawasaki Heavy Industries), publié par la JSIM (Japan Society of Industrial Machinery Manufacturers)"
  date: "non indiquée dans le texte extrait (50e édition du concours selon l'URL)"
  type: entreprise
  url: "https://jsim.or.jp/pdf/commendation/50_13.pdf"
  emplacement: "p. 127 (utilisations) ; p. 129 (PCI, tableau 5, déchloration) ; p. 133-134 (économie)"
  contenu: "Char d'ordures ménagères vendu comme combustible de substitution à des installations utilisant des combustibles fossiles (centrales thermiques d'exploitants électriques, usines de traitement des déchets, centrales d'enrobage). PCI du char 16 000 kJ/kg ou plus (base anhydre). Ordures brutes à 1 à 3 % de chlore, concentré dans le char ; un déchlorateur ramène le chlore à environ 0,2 à 0,4 %. La collectivité vend le char à bas prix (elle évite le coût de mise en décharge des mâchefers et perçoit une recette), prix variable selon la collectivité, moins cher par unité de chaleur que le fioul lourd ; les montants en yens ne sont pas lisibles dans le texte extrait."
  citation: "« 炭化燃料の発熱量は16,000kJ/kg以上（乾燥条件：無水）であり、燃料として十分な発熱量 » [...] « 脱塩装置に供給された炭化物は、0.2-0.4%程度まで塩素濃度を低減可能な » [...] « 自治体は主灰の最終処理費用を負担せずに燃料として収入を得られることから、安価で販売が可能となるためである。 » [...] « 炭化燃料の販売価格は、自治体によって変わるが、 »"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch ; chiffres de capacité et de prix (円/t) absents ou corrompus dans l'extraction du PDF. Source de constructeur. Précédent qualitatif : un char d'OM est vendu, à bas prix, comme combustible ; le chlore brut du char d'OM (sans déchloration) est élevé, ce qui est le principal risque pour le char Urban Rig (chlore non mesuré)."
  parametres: [char_prix_exemples, char_chlore_reference]

