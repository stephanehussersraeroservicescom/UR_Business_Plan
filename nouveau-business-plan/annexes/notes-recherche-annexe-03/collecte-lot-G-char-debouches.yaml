  note: "Lu par un sous-agent de recherche le 15/10/2026 via le navigateur Chrome (même méthode que la fiche coke de pétrole). Valeur frontière CAF, hors taxe carbone et hors acheminement. Le PCI réel du charbon importé n'est pas connu (le PCI SDES de 26 GJ/t est conventionnel). Constat : en valeur frontière, le coke de pétrole (3,7 EUR/GJ en 2025) est nettement moins cher que le charbon (6,4 EUR/GJ), ce qui fixe le plafond de valeur d'un combustible substitué en cimenterie au niveau du coke de pétrole. Divergence avec INSEE EACEI (houille 215 EUR/t en 2024, prix rendu industriel) : écart d'environ 18 EUR/t avec la valeur frontière 2024."
