  citation: "\"product\":{\"index\":{\"27131100\":0},\"label\":{\"27131100\":\"Petroleum coke, non-calcined\"}} ; 2025 : \"value\":{\"0\":33055532,\"1\":2808287.68} ; 2024 : {\"0\":41416991,\"1\":3381869.31} ; 2023 : {\"0\":59669694,\"1\":3945099.42} ; mois 2026-01 à 2026-06 (valeur/quantité) : 332207/21120.78, 3719429/369087.28, 6670058/599609.27, 940146/51295.18, 4150925/319019.07, 1233653/26154.25"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via le navigateur Chrome de l'utilisateur (onglet dédié, fetch de l'API en lecture seule depuis une page ec.europa.eu, onglet refermé) ; curl et WebFetch ne restituaient pas la réponse brute. Valeur statistique à la frontière (CAF pour les importations), hors taxes, hors transport intérieur jusqu'à la cimenterie. La NC 2713 11 ne distingue pas le coke « fuel grade » (cimenterie) du coke destiné à d'autres usages ; c'est une valeur unitaire moyenne, pas un prix de marché. Les volumes mensuels sont très irréguliers (juin 2026 : 1 233 653 EUR pour 2 615 t, soit 471,7 EUR/t, valeur atypique probablement liée à un lot particulier) : préférer les moyennes annuelles. Divergence avec INSEE EACEI (coke de pétrole 254 EUR/t en 2024, déjà au registre) : l'EACEI mesure un prix d'achat moyen rendu usine des industriels, la valeur Comext un prix frontière ; écart d'environ 130 EUR/t en 2024."
