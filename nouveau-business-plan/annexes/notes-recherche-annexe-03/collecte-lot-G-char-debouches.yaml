  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Le communiqué des résultats 2025 (8 mai 2026, https://mfn.se/all/a/pyrum-innovations/pyrum-pyrum-innovations-ag-publishes-figures-for-the-2025-financial-year-d15ce56b) donne un chiffre d'affaires de 4,1 M EUR (2,0 M EUR en 2024) sans ventilation par produit ni prix. Le rCB de pneus est un débouché matière qui exige une matière première homogène (pneus) : non transposable à un char d'OM et de plastiques chargé en cendres et métaux."
