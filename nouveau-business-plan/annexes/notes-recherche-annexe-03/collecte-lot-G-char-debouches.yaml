  emplacement: "p. 6-4 (usine de Harima) ; p. 7-1 et 7-2 (bilan matière et PCI) ; p. 8-1 ; p. 9-2 (centre de carbonisation de Saikai)"
  contenu: "Cas d'étude : centre de traitement des déchets de Harima (Hyogo). Hypothèse de 50 t/j d'ordures, rendement en char 18 %, soit 9,0 t/j de char ; utilisation 1,2 t/j dans l'unité de carbonisation, 0,12 t/j dans l'usine de traitement des déchets, 7,7 t/j en chaudière en remplacement du charbon. PCI du char 3 000 kcal/kg (environ 12,6 MJ/kg, conversion du sous-agent) contre 5 375 kcal/kg pour le charbon. Aucune valeur de prix de vente du char dans le document ; coût d'abattement 132 000 JPY/t CO2."
  citation: "« 炭化燃料製造量 9.0 t/日 » ; « ボイラで炭化燃料使用量 7.7 t/日 » ; « 炭化物発熱量 3,000 kcal/kg » ; « 石炭発熱量 5,375 kcal/kg »"
  statut: lu
