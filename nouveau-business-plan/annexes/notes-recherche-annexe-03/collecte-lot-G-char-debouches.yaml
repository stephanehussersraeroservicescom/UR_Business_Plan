A3G-FDR-DECARBONATION-CIMENT-2023:
  titre: "Feuille de route de décarbonation de la filière Ciment"
  editeur: "Filière ciment (France Ciment) et ministère chargé de l'industrie, publiée sur entreprises.gouv.fr"
  date: "2023-05"
  type: federation
  url: "https://www.entreprises.gouv.fr/files/files/enjeux/d%C3%A9carbonation/feuille-de-route-ciment.pdf"
  emplacement: "introduction p. 3-4 (25 cimenteries, carte figure 1-1) ; § 2a-2b p. 5-8 (mix thermique) ; § 3b p. 12-13 (levier substitution) ; § 3d p. 17 (biomasse) ; § 4 p. 19-20 (projets Airvault, Saint-Pierre-la-Cour). Pagination approximative selon l'outil."
  contenu: "25 cimenteries en France (5 groupes : Heidelberg Materials, Eqiom/CRH, Imerys, Lafarge/Holcim, Vicat). Combustibles fossiles : principalement coke de pétrole, charbon (13 à 17 % du mix selon les années) et gaz naturel ; la part du coke de pétrole diminue et doit être remplacée par des combustibles alternatifs. Combustibles de substitution : 29 % de la consommation d'énergie en 2011, 44 % en 2021. Déchets consommés : 964 kt en 2015, 1 054 kt en 2021 ; objectif 80 % de la consommation d'énergie en 2030 (1 528 kt) et 85 % en 2050 (1 649 kt). Biomasse : 422 kt (2015) puis 577 kt (2021) ; part de biomasse dans les déchets visée 52,5 % en 2030 et 60 % en 2050. Projet Airvault : 88 % de combustibles alternatifs, plus de 200 000 t/an de déchets dont jusqu'à 150 000 t/an de CSR."
  citation: "« leur taux d'utilisation passant de 29% en 2011 à 44% en 2021. » [...] « Le secteur a consommé un volume de déchets estimé à 964 Kt en 2015 et 1054 Kt en 2021. » [...] « Le volume de déchets devrait représenter 80% de la consommation d'énergie en 2030 et 85% en 2050 » [...] « soit un volume de 1528 Kt en 2030 et 1649 Kt en 2050. » [...] « La production française de ciment se structure autour de 25 cimenteries »"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch (extraction par outil ; le tableau 3-2 des taux annuels et la carte des usines n'ont pas été restitués). Document de filière co-signé avec l'État. La part de biomasse visée (52,5 % puis 60 %) signifie qu'une part croissante du gisement recherché est biogénique, ce que le char d'OM et de plastiques n'est que partiellement (fraction biogénique non mesurée). L'écart entre 1 054 kt en 2021 et 1 528 kt en 2030 indique un besoin d'environ 470 kt/an de combustibles de substitution supplémentaires (calcul du sous-agent)."
  parametres: [char_debouche_cimenterie, cimenterie_taux_substitution, cimenterie_tonnage_dechets, cimenterie_nombre_usines]

