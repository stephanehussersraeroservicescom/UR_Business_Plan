A3-UE-REG-333-2011:
  titre: "Règlement (UE) n° 333/2011 du Conseil du 31 mars 2011 établissant les critères permettant de déterminer à quel moment certains types de débris métalliques cessent d'être des déchets au sens de la directive 2008/98/CE"
  editeur: "Union européenne (EUR-Lex)"
  date: "2011-03-31"
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32011R0333"
  emplacement: "Articles 3 et 4 ; annexe I points 1.1 à 1.7 et 2 (fer et acier) ; annexe II points 1.2 à 1.7 et 2 (aluminium)"
  contenu: "Fin du statut de déchet. Fer et acier : classement selon une spécification client, industrie ou norme ; corps étrangers (stériles) au plus 2 % en poids ; pas d'oxyde de fer en excès (hormis quantités usuelles du stockage extérieur) ; pas d'huiles, émulsions, lubrifiants ou graisses visibles ; certificat de radioactivité par expédition ; pas de propriétés dangereuses ni de conteneurs sous pression. Aluminium : corps étrangers au plus 5 % en poids OU rendement en métal au moins 90 % ; pas de PVC ; pas d'huiles visibles. Intrants : déchets contenant du fer, de l'acier ou de l'aluminium valorisables ; déchets dangereux admis seulement après traitement supprimant les propriétés dangereuses ; exclusion des copeaux huileux et fûts ayant contenu huiles ou peintures. Le texte lu ne mentionne ni mâchefers, ni incinération, ni pyrolyse."
  citation: "Les débris sont classés selon une spécification du client, une spécification de l'industrie ou une norme [...] ; La quantité totale de corps étrangers (stériles) est inférieure ou égale à 2 % en poids. ; Les débris ne contiennent pas d'oxyde de fer en excès sous aucune forme, [...] ; Les débris sont exempts d'huiles, émulsions huileuses, lubrifiants ou graisses visibles, [...] ; (annexe II) La quantité totale de corps étrangers est inférieure ou égale à 5 % en poids [...] le rendement en métal est supérieur ou égal à 90 %."
  statut: lu
  consulte: 2026-10-15
  note: "Lu par un sous-agent de recherche le 15/10/2026 via WebFetch (version initiale, CELEX 32011R0333). Les métaux mêlés au char (cendres, carbone, huile de pyrolyse résiduelle possible) devront satisfaire les critères stériles 2 % / 5 % et absence d'huile visible : point à vérifier sur échantillon."
  parametres: [statut_fin_de_dechet_metaux]

