  citation: '11) «hydrogène bas carbone»: l''hydrogène dont la teneur énergétique provient de sources non renouvelables et qui respecte le niveau
    de réduction des émissions de gaz à effet de serre de 70 % par rapport au combustible fossile de référence pour les carburants renouvelables
    d''origine non biologique [...] ; 12) «gaz bas carbone»: la part de carburants gazeux présente dans les carburants à base de carbone recyclé,
    tels qu''ils sont définis à l''article 2, point 35), de la directive (UE) 2018/2001, dans l''hydrogène bas carbone [...] qui respectent le
    niveau de réduction des émissions de gaz à effet de serre de 70 % [...] ; 13) «carburants bas carbone»: les carburants à base de carbone recyclé,
    tels qu''ils sont définis à l''article 2, point 35), de la directive (UE) 2018/2001, l''hydrogène bas carbone et les carburants gazeux synthétiques
    [...] qui respectent le niveau de réduction des émissions de gaz à effet de serre de 70 %'
