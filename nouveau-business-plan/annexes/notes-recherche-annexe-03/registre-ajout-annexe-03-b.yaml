  url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024R3012
  emplacement: Article 1(1) ; article 2, points (2) et (11) ; article 3 ; considérant (10)
  contenu: 'Le CRCF ne certifie que deux choses : des absorptions de carbone et des réductions d''émissions des SOLS (pools de carbone biogénique,
    sols agricoles). Le considérant 10 exclut expressément les activités qui ne produisent ni absorption ni réduction d''émissions des sols, en
    citant les projets d''énergie renouvelable. Le stockage dans des produits exige du carbone atmosphérique ou biogénique stocké au moins 35
    ans. Une réduction d''émissions industrielle, un CO2 évité par substitution de combustible ou par détournement de l''incinération n''entrent
    pas dans le champ. Le carbone fossile de l''huile ou du char d''Urban Rig n''est ni atmosphérique ni biogénique. Date du règlement vérifiée
    (27/11/2024), ce qui lève le doute noté dans la fiche du lot C.'
  citation: this Regulation establishes a voluntary Union framework for the certification of carbon removals and soil emission reductions ; ‘soil
    emission reduction’ means the reduction of net greenhouse gas emissions from biogenic carbon pools ; ‘carbon storage in products’ means any
    practice or process that captures and stores atmospheric or biogenic carbon for at least 35 years in long-lasting products ; activities which
    do not result in either carbon removals or soil emission reductions, such as avoided deforestation projects or renewable energy projects,
    should not be included in the scope of the Union certification framework.
