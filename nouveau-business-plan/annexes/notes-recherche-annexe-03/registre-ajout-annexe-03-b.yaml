  emplacement: article 2, points 11 (hydrogène bas carbone), 12 (gaz bas carbone) et 13 (carburants bas carbone)
  contenu: Les carburants bas carbone comprennent les RCF au sens de la directive 2018/2001 et l'hydrogène bas carbone, à condition d'atteindre
    70 % de réduction des émissions par rapport au combustible fossile de référence des RFNBO (méthode du règlement 2023/1185). Un hydrogène ou
