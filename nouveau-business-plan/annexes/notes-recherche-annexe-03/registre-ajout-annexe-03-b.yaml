A3J-UE-REG-DEL-2025-2359:
  titre: Règlement délégué (UE) 2025/2359 de la Commission du 8 juillet 2025 complétant la directive (UE) 2024/1788 en précisant une méthode d'évaluation
    des réductions des émissions de gaz à effet de serre réalisées grâce aux carburants bas carbone
  editeur: Commission européenne (JO série L, 2025/2359, 21.11.2025)
  date: 2025-07-08 (publié 2025-11-21)
  type: reglementaire
  url: https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=OJ:L_202502359
  emplacement: considérant 2 ; articles 1 et 2 ; annexe, point 2 (formule et combustible de référence) ; annexe (traitement des intrants biogéniques,
    déchets municipaux en mélange)
  contenu: 'La méthode « bas carbone » de 2025 EXCLUT les carburants à base de carbone recyclé : pour un hydrogène issu de déchets plastiques
    fossiles (RCF), c''est le règlement 2023/1185 (déjà au registre) qui s''applique. Seuil 70 %, réduction = (EF - E)/EF, combustible de référence
    identique à celui des RFNBO du règlement 2023/1185 (94 gCO2e/MJ, valeur déjà au registre). Pour les intrants qui contiennent dès le départ
    une part biogénique, comme les déchets municipaux en mélange, la part biomasse suit l''article 31 de la directive 2018/2001.'
  citation: '(2) La méthode définie dans le règlement délégué (UE) 2023/1185 s''applique pour déterminer les réductions des émissions de gaz à
    effet de serre réalisées grâce aux carburants renouvelables d''origine non biologique ainsi qu''aux carburants à base de carbone recyclé,
    qui constituent une sous-catégorie des carburants bas carbone. Il convient donc d''exclure les carburants à base de carbone recyclé du champ
    d''application de la méthode définie dans le présent règlement. [...] Article premier : Le présent règlement précise la méthode de calcul
    des réductions des émissions de gaz à effet de serre réalisées grâce aux carburants bas carbone autres que les carburants à base de carbone
    recyclé. [...] Réductions = (E F – E) / E F [...] Pour tous les carburants bas carbone, le total des émissions provenant du combustible fossile
    de référence est égal au combustible fossile de référence pour les carburants renouvelables d''origine non biologique défini dans le règlement
    délégué (UE) 2023/1185. [...] ou lorsque les matières premières utilisées dans le procédé comprennent déjà une part biogénique dès le départ,
    comme dans le cas des déchets municipaux en mélange.'
  statut: lu
  consulte: 2026-10-15
  note: 'Lu le 15/10/2026 dans le navigateur Chrome (EUR-Lex refuse WebFetch, robots.txt) ; texte FR de 66 791 caractères, passages extraits par
    recherche de mots clés, lecture non intégrale de l''annexe. Entrée en vigueur indiquée par EUR-Lex : 11.12.2025 (métadonnées lues via WebFetch).
    Le signe « = » de la formule a été perdu à l''extraction et rétabli.'
  parametres:
  - statut_h2_dechets_plastiques
  - methode_bas_carbone_ue
  - seuil_reduction_bas_carbone

