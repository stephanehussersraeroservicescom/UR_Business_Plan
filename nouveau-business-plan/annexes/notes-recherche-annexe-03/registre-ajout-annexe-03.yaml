A3-ARRETE-FIOULS-LOURDS-2000:
  titre: Arrêté du 25 avril 2000 relatif aux caractéristiques des fiouls lourds (NOR ECO10000214A), modifié par arrêtés du 6 novembre 2006 et
    du 16 novembre 2022
  editeur: Ministère chargé de l'industrie ; texte consolidé reproduit par AIDA (INERIS)
  date: '2000-04-25 (dernière modification citée : 2022-11-16)'
  type: reglementaire
  url: https://aida.ineris.fr/reglementation/arrete-250400-relatif-caracteristiques-fiouls-lourds
  emplacement: Articles 2 (caractéristiques), 3 (classes de soufre), 4 (usage), 5 (méthodes)
  contenu: 'Fioul lourd vendu en France : distillation moins de 65 % à 250 °C et moins de 85 % à 350 °C ; viscosité supérieure à 9,5 mm²/s à 20
    °C et inférieure à 40 mm²/s à 100 °C ; eau inférieure ou égale à 1,5 % en masse ; point d''éclair supérieur ou égal à 70 °C ; soufre : TBTS
    inférieur ou égal à 1 %, BTS 2 %, HTS 4 % en masse. Aucune limite de densité, de cendres ni de chlore dans le texte. Comparaison : l''huile
    Urban Rig (point éclair < 40 °C, viscosité 1,7 mm²/s à 50 °C) ne respecte ni le point d''éclair ni la viscosité minimale du fioul lourd.'
  citation: Supérieure à 9,5 mm²/s à 20 °C ; | Inférieure à 40 mm²/s à 100 °C ; | inférieure ou égale à 1,5 % en masse ; | supérieur ou égal à
    70 °C ; | un fioul lourd dont la teneur en soufre est inférieure ou égale à 1 % en masse.
  statut: lu
  consulte: 2026-10-15
  note: Lu par un sous-agent de recherche le 15/10/2026 via WebFetch sur AIDA (Légifrance inaccessible). Texte de 2000 (plus de huit ans) mais
    en vigueur, modifié en 2022. Confirmé par la page AIDA de l'arrêté modificatif du 6/11/2006 (https://aida.ineris.fr/node/28862).
  parametres:
  - spec_fioul_lourd_point_eclair
