  contenu: 'Quatre conditions cumulatives de sortie du statut de déchet ; procédure nationale (articles D. 541-12-4 et suivants, CERFA 14831,
    arrêté du 3 octobre 2012) si aucun critère européen. Onze arrêtés français existants (2014 à 2024), dont deux pour un usage combustible :
    broyats d''emballages en bois (combustion biomasse, 2014) et combustible en installation 2910-B (2016) ; la liste mentionne aussi l''huile
