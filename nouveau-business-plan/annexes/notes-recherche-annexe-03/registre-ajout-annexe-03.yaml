  titre: Décision de la Commission du 3 mai 2000 remplaçant la décision 94/3/CE établissant une liste de déchets [...] (texte consolidé)
  editeur: Commission européenne (EUR-Lex)
  date: 2023-12-06 (version consolidée)
  type: reglementaire
  url: https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:02000D0532-20231206
  emplacement: Annexe, section « Évaluation et classement », règles générales
  contenu: Tout déchet marqué d'un astérisque est un déchet dangereux. Lorsqu'un déchet peut recevoir un code dangereux ou non dangereux (entrée
    miroir, cas de 19 01 17*/19 01 18), il n'est classé dangereux que s'il contient des substances dangereuses lui conférant une ou plusieurs
    propriétés HP 1 à HP 8 et HP 10 à HP 15.
  citation: « Tout déchet marqué d'un astérisque (*) sur la liste des déchets est considéré comme un déchet dangereux »
  statut: lu
  consulte: 2026-10-15
  note: Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Seule la phrase sur l'astérisque a été obtenue verbatim ; la règle sur les
    entrées miroirs est une reformulation de l'outil (citation non obtenue). Le chapitre 19 de cette page n'a pas pu être atteint (page tronquée
    par l'outil après le chapitre 10).
  parametres:
  - char_statut_dechet
  - char_classement_dangereux

A3-LISTE-DECHETS-19-12-10-REPRO-DE:
  titre: Verordnung (EG) Nr. 1013/2006 über die Verbringung von Abfällen, Anhang (Abfallverzeichnis, Kapitel 19 und 20), reproduction umwelt-online
  editeur: umwelt-online.de (reproduction privée d'un texte de l'UE)
  date: non indiquée
  type: reglementaire
  url: https://umwelt-online.de/recht/eu/05_09/06_1013i.htm
  emplacement: liste des déchets, chapitre 19, rubriques 19 01 et 19 12
  contenu: 'Libellés allemands : 19 01 17* déchets de pyrolyse contenant des substances dangereuses ; 19 01 18 autres déchets de pyrolyse ; 19
    12 10 déchets combustibles (combustible issu de déchets, code usuel des CSR) relevant de la sous-rubrique 19 12 « déchets provenant du traitement
    mécanique des déchets ». Le char de pyrolyse étant issu d''un traitement thermique et non mécanique, son code naturel est 19 01 17*/19 01
    18 et non 19 12 10 (déduction, non écrite dans la source).'
  citation: « Abfälle aus der mechanischen Behandlung von Abfällen (z.B. Sortieren, Zerkleinern, Verdichten, Pelletieren) a. n. g. » [...] « 19
    12 10 brennbare Abfälle (Brennstoffe aus Abfällen) » [...] « 19 01 17* Pyrolyseabfälle, die gefährliche Stoffe enthalten » [...] « 19 01 18
    Pyrolyseabfälle mit Ausnahme derjenigen, die unter 19 01 17 fallen »
  statut: secondaire
  consulte: 2026-10-15
  note: Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Reproduction non officielle (site privé allemand) ; le libellé français
    officiel de 19 12 10 n'a pas été obtenu (pages 30-32 du PDF ministériel non extraites, EUR-Lex tronqué). La déduction sur le code applicable
    au char est celle du sous-agent.
  parametres:
  - char_code_dechet

A3-REG1357-2014-HP7:
  titre: Règlement (UE) n° 1357/2014 de la Commission du 18 décembre 2014 remplaçant l'annexe III de la directive 2008/98/CE (propriétés qui rendent
    les déchets dangereux)
  editeur: Commission européenne (EUR-Lex)
  date: '2014-12-18'
  type: reglementaire
  url: https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32014R1357
  emplacement: Annexe, HP 7 « Cancérogène », tableau 6
  contenu: 'Un déchet est dangereux HP 7 s''il contient une substance cancérogène Carc. 1A ou 1B à 0,1 % ou plus, ou Carc. 2 à 1,0 % ou plus.
    Calcul du sous-agent (non écrit dans la source) : Cd 31 à 36 mg/kg = 0,0031 à 0,0036 % en cadmium élément, très en dessous de 0,1 % même si
    tout le cadmium était sous forme d''un composé Carc. 1B ; cela ne suffit pas à conclure sur le classement (autres propriétés HP, notamment
    HP 14, non évaluées ; spéciation et hydrocarbures du char non mesurés).'
  citation: « Lorsqu'un déchet contient une substance classée au moyen de l'un des codes des classes et catégories de danger » [...] « est atteinte
    ou dépassée, le déchet est classé comme déchet dangereux de type HP 7. » [...] « Carc. 1A H350 0,1 % » [...] « Carc. 2 H351 1,0 % »
  statut: lu
  consulte: 2026-10-15
  note: 'Lu par un sous-agent de recherche le 15/10/2026 via WebFetch, version initiale du règlement. HP 14 (écotoxique) a été modifié depuis
    par le règlement (UE) 2017/997, non lu ici. Âge : texte de 2014 toujours en vigueur (HP 7 inchangé à notre connaissance, non vérifié).'
  parametres:
  - char_classement_dangereux

