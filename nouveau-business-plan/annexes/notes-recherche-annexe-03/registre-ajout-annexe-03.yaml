  emplacement: considérant 10 ; annexe, section 2.2.3 (définition de Qbiochar) ; section 2.2.5.2(e)
  contenu: 'Lorsque le biochar est le produit principal (50 % ou plus des sorties d''énergie), l''activité BCR ne peut utiliser que des déchets
    ou résidus au sens de la directive (UE) 2018/2001. La masse de biochar créditée exclut toute fraction issue de matière non biogénique co-traitée
    ; si plus de 2 % du carbone du gisement peut être non biogénique, la fraction biogénique doit être mesurée par le carbone 14. Le biochar doit
    respecter les seuils de substances limitées des sections 4.4.1 à 4.4.3 (non lues). Conclusion du sous-agent : seule la fraction biogénique
    (mesurée au 14C) d''un char de déchets mélangés pourrait au mieux être comptée, sous réserve de l''éligibilité du gisement (section 4, non
    lue) et des seuils de contaminants.'
  citation: « can only use feedstocks coming from waste or residue as defined in Article 2, points (23) and (43), » [...] « The mass of biochar
