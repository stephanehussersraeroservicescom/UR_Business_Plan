A3-OBS-NORMANDIE-CSR-2021:
  titre: 'Les combustibles solides de récupération (CSR), INFO OBS #02'
  editeur: Observatoire des déchets, de la ressource et de l'économie circulaire de Normandie (animé par Biomasse Normandie)
  date: 2021-06
  type: observatoire
  url: https://neci.normandie.fr/sites/default/files/2024-04/02%20info-dechet%20V1.0.pdf
  emplacement: page 2 (qualités, consommation cimenterie) ; page 6 (coûts et prix)
  contenu: 'CSR qualité cimentière : PCI supérieur à 18 MJ/kg et chlore inférieur à 0,5 % ; bonne qualité (chaudières dédiées) : PCI 12 à 18 MJ/kg,
    chlore inférieur à 1,5 %. Cimenteries françaises : 450 kt de CSR consommés en 2015, objectif 1 Mt/an en 2025. Prix : cimenteries, vente du
    CSR entre 0 et 50 EUR/t ; chaufferies rémunérées par un prix d''accueil de 10 à 30 EUR/t (le producteur paie) ; coût de production du CSR
    85 à 115 EUR/t ; transport environ 10 EUR/t pour 50 km ; coût médian d''élimination des refus et déchets résiduels 88 à 132 EUR/t selon la
    voie (source ADEME, référentiel des coûts, édition 2019).'
