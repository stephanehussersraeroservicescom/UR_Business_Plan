    resultat: 205.465

  CALC-A7-NONALLOUE-HAUT-KG-T:
    description: "Masse non attribuee par tonne, scenario optimiste (char corrige, D-054)"
    formule: 1000 - q
    entrees:
      q: {calc: CALC-A7-QUANT-HAUT-KG-T}
    unite: kg par tonne
    resultat: 172.5

  CALC-A7-BOIS-RESTE-CENT-KG-T:
    description: "Part du bois non convertie en char, scenario standard (gaz, liquide et eau du bois, non mesures)"
    formule: b * (100 - c) / 10
    entrees:
      b: {valeur: 28, unite: '%', source: A7-ADEME-TRI-DAE-2025, emplacement: "figure 14, bois"}
      c: {valeur: 30, unite: '%', source: D-045, emplacement: vers}
    unite: kg par tonne
    resultat: 196.0

  CALC-A7-GAZ-PLAST-MJ-T:
