decisions:

  D-054:
    date: 2026-11-25
    titre: "Annexe 7 : scenario optimiste, char des fibreux et textiles limite au complement a 100 % de leur liquide et de leur gaz (27 %)"
    de: "D-049 : char a 40 % (D-045) sur bois, fibreux et textiles, plus liquide 25 % et gaz 48 % (D-048) sur fibreux et textiles, soit 113 % de leur masse"
    vers: "scenario optimiste : bois a 40 % de char (D-045) ; fibreux et textiles a 25 % de liquide, 48 % de gaz et 27 % de char ; scenarios pessimiste (90 %) et standard (99 %) inchanges"
    unite: "regle de calcul"
    motif: >
      HYPOTHESE posee par Claude le 25/11/2026 apres l'ecart E-1 du lot 2 de Codex (annexe 7), a trancher par Stephane.
      Le cumul des hypotheses independantes D-045 et D-048 donnait 113 kg de produits pour 100 kg de fibreux et
      textiles : erreur physique. Le char de 27 % est proche des 28 a 32 % mesures sur papier et textiles a 500 C
      (A5-BHATT-2026-RSCADV, valeurs reprises dans D-045). Autre choix possible : garder 40 % de char et reduire
      liquide et gaz au prorata. Effet : char optimiste 139 kg/t au lieu de 152. Le meme cumul semble exister en
      annexe 5 (D-048 applique le char de D-045 aux textiles sanitaires) : a verifier par le chat principal.
    preuves: [A5-BHATT-2026-RSCADV, A7-ADEME-TRI-DAE-2025]
    a_verifier: "Choix entre complement a 100 % (char 27 %) et reduction au prorata ; essai OneWorld (R-021)."

  D-055:
    date: 2026-11-25
    titre: "Annexe 7 : masse non attribuee du bilan d'une tonne de DAE en melange affichee par scenario et traitee comme dans D-053"
    de: "fines et masse non attribuee laissees INCONNU, sans masse"
    vers: "fines (340 kg/t) et masse non attribuee (237,5 / 205,465 / 172,5 kg/t) affichees ; par defaut, dans le modele, cette masse ne donne ni chaleur ni produit vendable ; le liquide est traite comme une eau de procede a eliminer, comme dans D-053"
    unite: "regle d'interpretation"
    motif: >
      HYPOTHESE posee par Claude le 25/11/2026 apres l'ecart E-2 du lot 2 de Codex (annexe 7), a trancher par Stephane.
      Le reste est surtout le gaz, le liquide et l'eau du bois (196 kg/t au standard) et le residu des plastiques.
      Aucune mesure sur ce flux. A remplacer par le bilan massique de l'essai R-021 et la caracterisation R-052.
    preuves: [A7-ADEME-TRI-DAE-2025]
    a_verifier: "Traitement par defaut dans le modele ; essai OneWorld (R-021)."

recherches:

  R-048:
    action: modifier
    question: "Humidite, pouvoir calorifique, chlore et composition des fines des DAE en melange en France (et en Ile-de-France)"
    statut: introuvable
    complement_2026_11_25: "Le tonnage regional des DAE en melange est retire de la question : le rapport de suivi 3 du PRPGD publie 2,77 Mt en 2020, total minimal (A7-PRPGD-IDF-SUIVI3-2023, lu par Claude et Codex le 25/11/2026). Codex signale une specification publique de CSR prepare (PCI 12 a 18 MJ/kg, humidite 15 a 25 %) dans un dossier d'autorisation de chaufferie ; non lue par Claude et non representative du DAE brut : non reprise."
    sources_a_ajouter: []

  R-052:
    question: "Caracterisation d'un flux cible de DAE en melange ou de refus de tri de DAE : humidite, PCI, cendres, chlore, soufre, metaux, composition des fines, part et classe du bois (A, BR1, BR2), variabilite entre bennes et dans le temps ; specification d'admission, plan d'echantillonnage et criteres de refus pour un contrat"
    demande_par: Claude
    date: 2026-11-25
    statut: a_demander
    detenteur: "Detenteur du flux cible (centre de tri de DAE ou producteur) ; laboratoire d'analyse ; OneWorld pour l'essai (R-021)"
    cherche: "Rapport ADEME 2025 sur le tri des DAE (composition visuelle, sans humidite, PCI ni chlore) ; referentiel FCBA 2022 de classification des dechets bois (classes, pas d'analyse du flux) ; voir aussi R-048."
    sources: [A7-ADEME-TRI-DAE-2025, A7-FCBA-CLASSIF-BOIS-2022]
