# Sections : fiches (registre-sources.yaml), calculs (calculs.yaml), decisions (_decisions.yaml),
# recherches (a-rechercher.yaml).

fiches:

  # --- fiches existantes : champs a ajouter ou corriger ---

  A7-PRPGD-IDF-SUIVI3-2023:
    action: completer_et_corriger
    champs_a_ajouter:
      url_pdf: https://www.institutparisregion.fr/fileadmin/DataStorage/user_upload/Rapport-de-suivi-PRPGD_2023.pdf
      emplacement_complement: "section sur les DAE en melange : objectif p. 83 et tableau 'Total de DAE en melange entrant dans les centres de tri' p. 84 de la lecture WebFetch (p. 82 selon Codex ; pagination a confirmer)"
      contenu_complement: "DAE franciliens en melange : 3,41 Mt (2014), 3,93 Mt (2016), 3,35 Mt (2018), 2,77 Mt (2020) ; quantite entrant en centres de tri : 1,75 ; 2 ; 2,42 ; 1,62 Mt ; taux d'entree en centres de tri : 51 %, 51 %, 72 %, 58 %. Le total est un minimum : la totalite des flux de DAE en melange exportes hors Ile-de-France ne serait pas connue."
      citation_complement: "Total DAE franciliens en mélange 3,41 Mt 3,93 Mt 3,35 Mt 2,77 Mt | Taux de DAE en mélange entrant en centres de tri 51 % 51 % 72 % 58% | Par conséquent, le total des DAE franciliens en mélange correspond à un minimum. | 100 % des DAE en mélange orientés vers une chaîne de tri en 2025 (51 % en 2014)"
      lecture_2026_11_25: "Lu par Claude par WebFetch le 25/11/2026 (caracteres 100 000 a 200 000 du PDF de l'Institut Paris Region ; citations transcrites par un modele intermediaire). Meme valeur 2,77 Mt et meme mention de minimum lues par Codex le 25/11/2026 (lot 1, verdict 27) : deux lectures concordantes."
    champs_a_corriger:
      contenu: "Supprimer la phrase finale 'Pas de tonnage des DAE en melange.' : elle est fausse (tableau p. 84 de la lecture WebFetch)."
      note: "Remplacer '(la section 4-2, p. 80, sur le traitement des DAE n'a pas ete lue)' par '(section sur les DAE en melange lue le 25/11/2026, voir lecture_2026_11_25)'."
    statut: "inchange (verifie-recontrole) ; les nouvelles valeurs ont deux lectures (Claude et Codex)"
    date_lecture: '2026-11-25'

