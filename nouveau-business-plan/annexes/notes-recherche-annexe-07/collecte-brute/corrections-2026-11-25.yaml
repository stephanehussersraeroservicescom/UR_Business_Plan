  # --- nouvelle fiche ---

  A7-FCBA-CLASSIF-BOIS-2022:
    action: creer
    titre: "Referentiel de classification des dechets bois, version 05/2022"
    editeur: "FCBA, groupe de travail plan Dechets du CSF bois ; projet cofinance par l'ADEME"
    date: 2022-05
    annee_donnees: 2022
    type: referentiel_professionnel
    url: https://www.codifab.fr/uploads/media/62867d4fa564a/csf-classification-dechets-bois-v0.pdf
    emplacement: "p. 5 (definition biomasse IED, classes BR1 et BR2 non dangereuses), p. 6 (section 4.2, ancienne classe B), p. 9 (section 6.1, BR1), p. 10 (section 8.1, classe C)"
    contenu: "Classes A, BR1, BR2 et C. BR1 et BR2 representent globalement l'ancienne classe B, constituee des dechets de bois non dangereux mais contenant des substances chimiques a des concentrations superieures aux teneurs naturellement presentes dans la biomasse. L'acceptation en BR1 suppose un cahier des charges de seuils en organohalogenes et metaux lourds. La definition de la biomasse de la directive IED rappelle que le bois traite peut contenir des composes organiques halogenes ou des metaux lourds. Classe C : dechets de bois classes dangereux (par exemple bois creosotes). Les termes 'peint', 'verni' ou 'colle' ne figurent pas dans le texte lu."
    citation: "l'ancienne classe B, constituée des déchets de bois non dangereux mais contenant des substances chimiques | à des concentrations supérieures aux teneurs naturellement présentes dans la biomasse | respectant un cahier des charges de seuils de concentration en organohalogénés et métaux lourds"
    statut: lu
    consulte: '2026-11-25'
    nature_source: "referentiel professionnel (filiere bois), cofinance par l'ADEME ; pas un texte reglementaire"
    note: "Lu par Claude par WebFetch le 25/11/2026 ; citations transcrites par un modele intermediaire, a recontroler sur le PDF. Ajoute apres l'ecart E-3 du lot 1 de Codex (annexe 7)."

calculs:

  CALC-A7-IDF-DAE-ENFOUIS-REAFF-T:
    description: "DAE enfouis en Ile-de-France en 2022, origine economique apres reaffectation des refus a leurs producteurs initiaux"
    formule: t * p / 100
    entrees:
      t: {valeur: 2228079, unite: t, source: A8-CST-ORDIF-ISDND-2023, emplacement: "p. 5"}
      p: {valeur: 77.6, unite: '%', source: A8-CST-ORDIF-ISDND-2023, emplacement: "p. 5, apres reaffectation des refus"}
    unite: t
    resultat: 1728989.304

  CALC-A7-PART-MACHINE-DAE-IDF-PCT:
    description: "Part d'une URC-2000 (51 100 t/an) dans les DAE non dangereux non inertes franciliens de 2020"
    formule: c / (d * 10000)
    entrees:
      c: {calc: CALC-A8-CAPACITE-AN}
      d: {valeur: 5.09, unite: Mt, source: A7-PRPGD-IDF-SUIVI3-2023, emplacement: "p. 10"}
    unite: '%'
    resultat: 1.003929

  CALC-A7-PART-MACHINE-MELANGE-IDF-PCT:
    description: "Part d'une URC-2000 (51 100 t/an) dans les DAE franciliens en melange de 2020 (total minimal)"
    formule: c / (d * 10000)
    entrees:
      c: {calc: CALC-A8-CAPACITE-AN}
      d: {valeur: 2.77, unite: Mt, source: A7-PRPGD-IDF-SUIVI3-2023, emplacement: "tableau 'Total de DAE en melange entrant dans les centres de tri', 2020"}
    unite: '%'
    resultat: 1.844765

  CALC-A7-BOISB-PCT:
    description: "Part du bois B dans les flux en melange des centres de tri de DAE : bois (28 %) multiplie par les trois quarts (figure 14)"
    formule: b * f / 100
    entrees:
      b: {valeur: 28, unite: '%', source: A7-ADEME-TRI-DAE-2025, emplacement: "figure 14, bois"}
      f: {valeur: 75, unite: '%', source: A7-ADEME-TRI-DAE-2025, emplacement: "figure 14, 'dont les 3/4 correspondent a du bois B'"}
    unite: '%'
    resultat: 21.0

  CALC-A7-CHAR-FT-HAUT-PCT:
    description: "Char des fibreux et textiles, scenario optimiste : complement a 100 % du liquide (25 %) et du gaz (48 %) (D-048, D-054)"
    formule: 100 - l - g
    entrees:
      l: {valeur: 25, unite: '%', source: D-048, emplacement: vers}
      g: {valeur: 48, unite: '%', source: D-048, emplacement: vers}
    unite: '% de la masse des fibreux et textiles'
    resultat: 27

  CALC-A7-CHAR-HAUT-V2-KG-T:
    description: "Char par tonne de DAE en melange, scenario optimiste corrige : bois a 40 % (D-045), fibreux et textiles a 27 % (D-054). Remplace CALC-A7-CHAR-HAUT-KG-T (152 kg/t) dans l'annexe 7."
    formule: (b * cb + (f + t) * cft) / 10
    entrees:
      b: {valeur: 28, unite: '%', source: A7-ADEME-TRI-DAE-2025, emplacement: "figure 14, bois"}
      cb: {valeur: 40, unite: '%', source: D-045, emplacement: vers}
      f: {valeur: 7, unite: '%', source: A7-ADEME-TRI-DAE-2025, emplacement: "figure 14, fibreux"}
      t: {valeur: 3, unite: '%', source: A7-ADEME-TRI-DAE-2025, emplacement: "figure 14, textiles"}
      cft: {calc: CALC-A7-CHAR-FT-HAUT-PCT}
    unite: kg par tonne
    resultat: 139.0

  CALC-A7-NONCONV-KG-T:
    description: "Inertes, metaux et platre par tonne de DAE en melange (non convertis)"
    formule: n * 10
    entrees:
      n: {calc: CALC-A7-NONCONV-PCT}
