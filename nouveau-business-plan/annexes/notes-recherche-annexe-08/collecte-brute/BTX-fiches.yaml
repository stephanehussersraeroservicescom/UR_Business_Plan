  emplacement: "annexe, entrée 63 de l'annexe XVII, paragraphes 15 à 20"
  contenu: "Paragraphe 15 : interdiction si plomb au moins 0,1 % en poids du PVC ; paragraphe 16 : application au 29 novembre 2024 ; paragraphe 17 : dérogation PVC souple récupéré jusqu'au 28 mai 2025 ; paragraphe 18 : dérogation PVC rigide récupéré à moins de 1,5 % de plomb jusqu'au 28 mai 2033 pour certains profilés, plaques, tubes multicouches (hors eau potable) et raccords, couche couvrante à moins de 0,1 % pour certains usages, marquage, réexamen au 28 mai 2028, usages du recyclé limités à partir du 28 mai 2026 ; paragraphe 20 : exemption des articles mis sur le marché avant le 28 novembre 2024."
  citation: "if the concentration of lead is equal to or greater than 0,1 % by weight of the PVC material | Paragraph 15 shall apply with effect from 29 November 2024 | paragraph 15 shall not apply to PVC articles containing recovered flexible PVC until 28 May 2025 | until 28 May 2033, if the concentration of lead is lower than 1,5 % by weight | Contains ≥ 0,1 % lead"
