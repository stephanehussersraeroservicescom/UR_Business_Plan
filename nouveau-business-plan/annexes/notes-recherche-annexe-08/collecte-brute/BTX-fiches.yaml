  contenu: "Mises en marché 2025 : 917 604 t (3,6 milliards de pièces) ; collecte 272 479 t (3,96 kg/hab) ; tri 216 264 t dont 84 % en France ; devenir des tonnes TRIÉES (en %) : réutilisation 54,47 ; matières à recycler 25,31 ; chiffons d'essuyage 11,03 ; CSR 8,4 ; incinération avec valorisation énergétique 0,73 ; élimination sans valorisation 0,06. Éco-contributions 162,7 M€ (173,61 €/t mise en marché). Soutiens aux opérateurs de tri 48,8 M€."
  citation: "Mises en marché (Tonnes) 917 604 | Collecte (Tonnes) 272 479 | Tonnages triés (Tonnes) / dont France (%) 216 264/84 | Réutilisation (%) 54,47 | Matières à recycler (%) 25,31 | Chiffons d'essuyage (%) 11,03 | Combustibles Solides de Récupération (%) 8,4 | Élimination par incinération avec valorisation énergétique (%) 0,73 | Élimination sans valorisation énergétique (%) 0,06 | Contribution moyenne par tonne mise en marché (€) 173,61"
