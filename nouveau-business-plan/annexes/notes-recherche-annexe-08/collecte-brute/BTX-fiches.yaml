A8-BTX-VINYLPLUS-2026:
  titre: "VinylPlus Progress Report 2026"
  editeur: "VinylPlus (engagement volontaire de l'industrie européenne du PVC)"
  date: "mai à juillet 2026"
  annee_donnees: "2025"
  type: "federation"
  url: "https://www.vinylplus.eu/wp-content/uploads/2026/05/Progress-Report-2026-Digital-July.pdf"
  emplacement: "p. imprimées 20-22 (tonnages, graphique par région), 27-29 et 33 (plomb, additifs historiques, pyrolyse), 52 (tableau par application)"
  contenu: "765 972 t de PVC recyclées en Europe en 2025 dans le cadre VinylPlus (724 638 t en 2024), dont 58,8 % pré-consommation et 41,2 % post-consommation (315 413 t). Par application 2025 : fenêtres et profilés 416 889 t, sols 119 873 t, câbles 104 633 t, souples 53 812 t, tubes 41 001 t, films rigides 19 308 t, autres rigides 10 456 t. Part France du PVC recyclé : 13,6 % (rattachement à confirmer). Plomb : limite générale 0,1 %, dérogation 1,5 % pour le PVC rigide jusqu'au 28 mai 2033 ; la fin de la dérogation pourrait limiter le contenu recyclé à moins de 25 %. Le PVC contenant des additifs historiques comme le plomb ne peut pas être recyclé mécaniquement ; en pyrolyse au banc, le plomb sans impact mesurable sur l'huile."
  citation: "765,972 tonnes of PVC recycled in 2025 | A total of 765,972 tonnes of PVC waste were recycled, of which 58.8% was pre-consumer waste and 41.2% was post-consumer waste | RECYCLED PVC WASTE PER REGION IN 2025 | the general maximum lead concentration in PVC articles is 0.1% by weight. | ending the derogation for rigid PVC in 2033 could significantly affect profiles, pipes and fittings recycling. | lead had no measurable impact on pyrolysis oil yield or quality."
  statut: "lu"
  consulte: "2026-10-15"
  note: "Fédération professionnelle, plaidoyer pour prolonger la dérogation. Pas de tonnage par pays, seulement des parts par région ; l'extraction liste les 8 libellés puis les 8 pourcentages (France 3e = 13,6 %, Espagne et Portugal 4e = 13,6 %) : vérifier visuellement. Pas de répartition Recovinyl pour la France (RecoTrace : 508 109 t d'utilisation de recyclé en Europe)."

A8-BTX-REACHPLOMB-2023:
  titre: "Règlement (UE) 2023/923 de la Commission du 3 mai 2023 modifiant l'annexe XVII du règlement (CE) n° 1907/2006 en ce qui concerne le plomb et ses composés dans le PVC"
