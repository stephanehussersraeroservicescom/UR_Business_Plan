A8-BTX-ADEMEPMCB-2024:
  titre: "Filière des Produits et matériaux de construction du bâtiment : données 2024, Bilan annuel"
  editeur: "ADEME (J. Nicolas, L. Lijeour)"
  date: "décembre 2025"
  annee_donnees: "2024"
  type: "statistique_publique"
  url: "https://www.novabuild.fr/wp-content/uploads/2026/03/Bilan-filiere-PMCB_Donnees2024.pdf"
  emplacement: "p. 7-8 (mises sur le marché), p. 15-16 tableau 4 (collecte), p. 23 (définition du taux), p. 24 tableau 7 (recyclage par famille, catégorie 2), p. 26 tableau 8"
  contenu: "182,2 Mt de PMCB mis sur le marché en 2024 (169 Mt cat. 1, 13,2 Mt cat. 2) ; plastique = 8 % des mises sur le marché cat. 2. 10,7 Mt collectés (dont 0,5 Mt cat. 2). Plastique recyclé cat. 2 : 20 282 t, taux 7,0 % pour un objectif 2024 de 17 % (Valobat 9 249 t, 4,0 % ; Ecomaison 8 851 t, 19,6 % ; Valdelia 2 181 t, 15,4 %). Taux de recyclage total cat. 2 : 6,0 %. Gisement de référence cat. 2 : 5 925 kt."
  citation: "En 2024, 182,2 millions de tonnes (Mt) de PMCB mis sur le marché ont été déclarés en 2024 par les écoorganismes | Viennent ensuite le plastique (8 %), les menuiseries vitrées (5 %), et les autres PMCB. | 10,7 millions de tonnes (Mt) ont été collectés et déclarés par les éco-organismes PMCB en 2024 | on considère que le taux de recyclage est la proportion des tonnages recyclés | par rapport au gisement de référence de déchets | Plastique 20 282 7,0 % | dans une moindre mesure du plastique (7 % au lieu de 17 %)"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Copie intégrale hébergée par Novabuild ; original ADEME (librairie.ademe.fr réf. 8909/11204) derrière formulaire. Pas de ventilation par polymère (aucune mention PVC, PSE, menuiseries PVC) ; pas de tonnage plastique collecté (figure 16 en image) ; pas de valorisation énergétique chiffrée. Incohérences internes : 182,2 Mt contre 169 Mt en couverture ; texte '8 % au lieu de 39 %' contre tableau 6,0 %. Tableau reconstitué depuis une extraction brouillée."

