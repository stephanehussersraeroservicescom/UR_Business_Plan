A8-BTX-REFASHIONCARAC-2023:
  titre: "Étude de caractérisation des flux entrants et sortants de centres de tri (synthèse)"
  editeur: "Refashion"
  date: "avril 2023"
  annee_donnees: "mai 2021 à janvier 2022"
  type: "etude_publique"
  url: "https://media-pro.refashion.fr/2025/10/synthese_etude_caracterisation_refashion_2023_fr.pdf"
  emplacement: "synthèse p. 4, 8, 13, 14, 15, 17 (pagination imprimée 'Synthèse N')"
  contenu: "Composition des flux sortants de centres de tri non orientés vers la réutilisation (environ 14,6 t analysées) : coton 43 %, polyester 19 %, acrylique 12 %, élasthanne 0,7 %, non identifié 8,5 % ; mélanges environ 45 % ; articles à plus de 90 % synthétiques : 24 % des articles analysés ; articles simples à recycler (monocouche sans perturbateur) 22 %."
  citation: "Seuls les flux sortants des centres de tri non orientés vers la réutilisation ont été analysés. | Le coton (43%) est la matière dominante dans le gisement de déchets textiles non-réutilisables analysés. | On retrouve ensuite le polyester (19%), l'acrylique (12%), les fibres artificielles cellulosiques | les mélanges représentent environ 45% du gisement. | composés à plus de 90% de matières synthétiques | moins d'un quart du gisement (22%)"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Données 2021-2022 ; échantillon réduit (15 t analysées pour un gisement visé de 80 kt). Polyamide non chiffré. Ce n'est pas la composition des mises en marché."

