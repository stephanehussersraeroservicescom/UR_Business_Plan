ECOMAISON-2024:
  ouvert: "oui"
  emplacement: "Plaquette 'Chiffres clés 2024 : Ecomaison, accélérateur de circularité' (vers juin 2025), page unique non paginée"
  citation: "En 2024, Ecomaison a collecté 1,7 million de tonnes d'objets et matériaux de la maison et du bâtiment, | 1 749Kt collectées | 1 474 Kt ameublement | 148 Kt bâtiment (cat.2) | 98 Kt bricolage jardin | 29 Kt jouets | 44 % RECYCLAGE | 5 % RÉEMPLOI | 48 % VALORISATION ÉNERGÉTIQUE | 97% de valorisation | LES PRODUITS COLLECTÉS deviennent des matières recyclables ou de l'énergie | 800 Kt bois | 340 Kt combustible solide de récupération (CSR) | 41 Kt mousses | 34 Kt ferraille | 27 Kt plastiques | Avant la création d'Ecomaison (ex Eco-mobilier en 2012) 55% des meubles étaient enfouis."
  contenu: "Données 2024 : 1 749 kt collectées (ameublement 1 474, bâtiment cat. 2 148, bricolage-jardin 98, jouets 29) ; tous flux : 44 % recyclage, 48 % valorisation énergétique, 5 % réemploi, 97 % de valorisation ; matières sortantes : bois 800 kt, CSR 340 kt, mousses 41 kt, ferraille 34 kt, plastiques 27 kt."
  statut_propose: "lu"
  note: "URL valide. Les taux portent sur tous les flux ; plastiques et mousses = matières sortantes, pas plastique collecté. Mises sur le marché par filière non rattachables avec certitude dans l'extraction. Rien sur matelas, PVC, brome. Remplacée par l'édition 2025 (A8-BTX-ECOMAISON-2025)."
