  date: "février 2026"
  annee_donnees: "non précisée"
  type: "entreprise"
  url: "https://clients-cms.citeo.com/uploads/guide_des_emballages_sans_film_pvc_dans_l_economat_744c3250f0.pdf"
  emplacement: "p. 6"
  contenu: "L'économat (films de coupe pour fromage, charcuterie, viande en grande distribution) absorbe près de la moitié du PVC souple d'emballage. Le PVC n'a pas de filière de recyclage dans l'emballage ménager et émet des composés chlorés lors de la régénération."
