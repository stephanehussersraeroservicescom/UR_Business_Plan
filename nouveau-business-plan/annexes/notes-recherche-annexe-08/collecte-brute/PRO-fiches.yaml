  note: "Ordre des colonnes : Acier, Aluminium, Papier-carton, Plastique, Verre, Bois. Copie AIDA, pas Légifrance. Modifié par un arrêté du 13/07/2026 (§ 4.1.9, annexes II et III) non lu."
