  note: "Meilleure source pour Q2. Le taux de 26 % n'a pas de source citée (origine probable : déclaration Eurostat ou données ADEME, à confirmer). PVC non mentionné. Document d'origine à lire : 'Etude ADEME 2025 sur le coût de gestion opérateurs' (non trouvé en ligne). Libellé exact des deux colonnes du tableau p. 2 à confirmer visuellement."
A8-PRO-ADIVALOR-RA-2024:
  titre: "Rapport d'activité A.D.I.VALOR 2024 (titre de couverture non extrait)"
  editeur: "A.D.I.VALOR (organisme de la filière volontaire des déchets agricoles)"
  date: "2025"
  annee_donnees: "2024"
  type: "observatoire"
  url: "https://www.adivalor.fr/_script/ntsp-document-file_download.php?document_id=37936&document_file_id=65651"
  emplacement: "p. 9 (chiffres clés), p. 33 (films), p. 35 (filets), p. 44 (financement), p. 45"
  contenu: "2024 : 102 000 t de plastiques et emballages collectés ; taux de collecte moyen 71 %. Films d'élevage : plus de 44 000 t collectés, taux de collecte 78 %, 85 % des films collectés recyclés. Films de maraîchage : 19 341 t, soit 78 % du gisement. Paillage : 97 % recyclés. Gisement de films usagés : 70 000 à 85 000 t/an. Financement : plus de 650 metteurs en marché ; prix aux partenaires 'couvrant les prix coûtants'."
  citation: "102 000 tonnes de plastiques et emballages usagés collectées | Taux de collecte moyen de 71 % | Avec plus de 44 000 tonnes en 2024, les quantités de films d'élevage usagés collectés continuent à croître | En 2024, 19 341 tonnes de films de maraîchage ont été collectées soit 78 % des quantités à récupérer | 85 % des films plastiques collectés auprès des éleveurs ont été recyclés. | La quantité totale de films usagés à collecter annuellement est estimée entre 70 et 85 000 tonnes. | + de 650 metteurs en marché, industriels ou importateurs contribuent au financement de la filière | Les filets balles rondes sont soit recyclés, soit traités en valorisation énergétique"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Taux rapportés au gisement à collecter, pas à la mise en marché. Aucun montant d'éco-contribution. Gratuité pour l'agriculteur non énoncée explicitement. PVC non mentionné."
A8-PRO-ADIVALOR-RA-2025:
  titre: "2025 Rapport d'activité (édition des 25 ans)"
  editeur: "A.D.I.VALOR"
  date: "2026"
  annee_donnees: "2025"
