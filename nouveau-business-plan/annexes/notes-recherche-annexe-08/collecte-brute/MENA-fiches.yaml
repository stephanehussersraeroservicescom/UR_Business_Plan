  emplacement: "p. 15, p. 16, p. 26, p. 27 (tableau « Sous-calcul prix de reprise Plastiques »)"
  contenu: "Prix de reprise moyen par flux plastique ménager, métropole, en €/t avec tonnes reprises : bouteilles/flacons PET clair (en extension) 347 €/t pour 99 597 t ; B/F/P/B PET clair 329 €/t pour 61 367 t ; PET foncé 99 €/t pour 8 587 t ; PE/PP 53 €/t pour 65 154 t ; PE/PP/PS 39 €/t pour 33 602 t ; PE 174 €/t pour 7 032 t ; PP 126 €/t pour 5 604 t ; pots/barquettes PS 0 €/t pour 702 t ; films PE 0 €/t pour 25 370 t ; films PE/PP 0 €/t* pour 72 009 t ; flux développement hors films 0 €/t* pour 66 005 t ; PSE (standard expérimental) 0 €/t* pour 793 t. Moyenne pondérée : 140 €/t pour 445 822 t. (*) hypothèse de prix nul. Série du prix plastique : 264 €/t (2022), 130 (2023), 140 (2024) ; prix retenu 178 €/t (moyenne 2022-2024). Recettes plastiques retenues : 135 M€. Sources des prix : observatoire de la reprise Citeo (option filière) et étude AMORCE-ADEME (options fédérations et individuelle), pondération SYDEREP."
  citation: "Sous-calcul prix de reprise Plastiques | _07.450 Bouteilles/Flacons PET clair (en extension) 347 €/t 99 597 t 22% | _07.442 Bouteilles/Flacons/Pots/Barquettes PET Clair (en extension) 329 €/t 61 367 t 14% | _07.443 Bouteilles/Flacons/Pots/Barquettes PET foncé (en extension) 99 €/t 8 587 t 2% | _07.444 Bouteilles/Flacons/Pots/Barquettes PE/PP (en extension) 53 €/t 65 154 t 15% | _07.445 Bouteilles/Flacons/Pots/Barquettes PE/PP/PS (en extension) 39 €/t 33 602 t 8% | _07.446 Bouteilles/Flacons/Pots/Barquettes PE (en extension) 174 €/t 7 032 t 2% | _07.447 Bouteilles/Flacons/Pots/Barquettes PP (en extension) 126 €/t 5 604 t 1% | _07.448 Pots/Barquettes PS (en extension) 0 €/t 702 t 0% | _07.422 Films emballages ménagers PE 0 €/t 25 370 t 6% | _07.423 Films emballages ménagers PE/PP* 0 €/t 72 009 t 16% | _07.451 Flux développement (en extension) hors films PE/PP* 0 €/t 66 005 t 15% | _07.449 PS expansé - Standard expérimental* 0 €/t 793 t 0% | Prix moyenné Plastiques 140 €/t 445 822 t 100% | * Hypothèse de prix de reprise nul | Plastiques 264,0 130 140 178 | Plastiques 783 21 178 135 | Prix option filière de l'observatoire de la reprise CITEO"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Meilleure source trouvée pour les prix par flux (Q2). Les prix nuls des films et du flux développement sont des hypothèses faute d'observation, pas des prix mesurés. L'année du tableau p. 27 (2024) est déduite de la concordance avec 140 €/t en colonne 2024 p. 26. Le sens des colonnes des lignes p. 15 « Plastiques 51% 606 30% 73% 865 » et p. 16 « Plastiques 46 30 37 1 076 73% 783 » n'a pas été éclairci : ne pas utiliser sans relecture. Pas de répartition par repreneur."

