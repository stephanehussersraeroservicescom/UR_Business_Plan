A8-MENA-CITEOMAG-2026:
  titre: "Les chiffres du recyclage en France"
  editeur: "Citeo"
  date: "18 juin 2026"
  annee_donnees: "2025"
  type: "etude_publique"
  url: "https://www.citeo.com/le-mag/les-chiffres-du-recyclage-en-france/"
  emplacement: "page web, liste Taux de recyclage par matériau"
  contenu: "Emballages ménagers France, périmètre Citeo + Adelphe, 2025 : taux de recyclage tous matériaux 73 % (estimation de filière, fin décembre 2025) ; plastiques 30 % ; acier 100 %, aluminium 43 %, papier-carton 83 %, verre 88 %. Recyclabilité des emballages plastiques 75 % ; matière recyclée incorporée 17 %. 3,8 Mt recyclées."
  citation: "Plastiques : 30% | Estimation pour l'ensemble de la filière établie fin décembre 2025 | + 10 points vs 2020 | + 4 points depuis 2021"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Pas de définition écrite du taux sur la page. La recyclabilité n'est pas un taux de recyclage. Lève l'ambiguïté du tableau de CITEO-RA-2025 p. 5."

A8-MENA-CITEORA-2024:
  titre: "Rapport d'activité 2024 (Mobiliser autour de la réduction des emballages)"
  editeur: "Citeo"
  date: "non indiquée (fichier 250704, donc juillet 2025 probable)"
  annee_donnees: "2024"
  type: "etude_publique"
  url: "https://www.adelphe.fr/wp-content/uploads/2026/01/250704_er_ra_citeo_2025_web.pdf"
  emplacement: "p. 7, p. 9, p. 36, p. 37"
  contenu: "Taux de recyclage des emballages ménagers 2024 : 69 % (3,9 Mt). Le graphique p. 36 affiche 57 % sous le libellé « nouvelle méthode de calcul », non expliqué. Plus de 150 000 t d'emballages plastiques reprises opérationnellement par Citeo (pas des tonnes recyclées). 65 % des plastiques ont une filière de recyclage ; 18 % de matière recyclée intégrée. 6 usines de recyclage mécanique et 4 de recyclage chimique partenaires. P. 37 : suite de valeurs non attribuables « 85% 77% 55% 26% 40% 92% 84% » (un taux plastique 2024 de 26 % est possible, mais NON CONFIRMÉ)."
  citation: "69% d'emballages ménagers recyclés, soit 3,9 MT | Taux de recyclage des emballages ménagers (nouvelle méthode de calcul) | en 2024, plus de 150000 tonnes d'emballages en plastique reprises opérationnellement par Citeo | avec 6 usines de recyclage mécanique et 4 usines de recyclage chimique."
  statut: "lu"
  consulte: "2026-10-15"
  note: "Hébergé sur adelphe.fr (filiale de Citeo). Le 57 % et le taux plastique 2024 sont à vérifier visuellement dans le PDF."

A8-MENA-CITEORA-2023:
