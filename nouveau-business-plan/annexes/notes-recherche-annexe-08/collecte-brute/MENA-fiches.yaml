A8-MENA-ADEME3R-2024:
  titre: "Bilan 3R en 2023 pour les emballages en plastique à usage unique. Réduction, réemploi, recyclage. Synthèse"
  editeur: "ADEME (étude In Extenso Innovation Croissance)"
  date: "2024"
  annee_donnees: "2018-2021"
  type: "etude_publique"
  url: "https://www.ecologie.gouv.fr/sites/default/files/documents/ADEME_Bilan%20indicateurs%20d%C3%A9cret%203R-Synthese.pdf"
  emplacement: "p. 13, p. 14"
  contenu: "66 % des emballages ménagers plastiques considérés recyclables en 2021 (recyclabilité, pas recyclage). Dont 50 % évalués via SYDEREP (PET clair, PE, PP, PET foncé, souples PE), 16 % estimés par Citeo (rigides PE et PP), 11 % de filières en développement (rigides PET et PS). 17 % sont des emballages en PVC, complexes ou d'autres résines (sans filière). Mises en marché d'emballages plastiques à usage unique : +3,3 % entre 2018 et 2021 (+0,7 % pour les ménagers). Aucun tonnage absolu lisible."
  citation: "66 % des emballages ménagers en plastique sont considérés recyclables | Parmi les 66 % de tonnages avec une filière de recyclage existante, il convient de distinguer : | 16 % estimés par Citeo, pour y ajouter les tonnages d’emballages rigides en PE et PP | 17 % d’emballages en PVC, et d’emballages complexes ou composées d’autres résines"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Utile pour Q4 (part sans filière). Les tonnages absolus seraient dans la figure 3, illisible."

