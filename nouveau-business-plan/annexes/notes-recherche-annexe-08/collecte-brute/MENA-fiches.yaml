  contenu: "Taux 2023 : estimation de filière 75 % ; selon la nouvelle norme européenne 67 % (contre 66 % en 2022). Gisement plastique contribuant 2023 : 1 190 kt. Contributions plastiques : 456 M€ en 2022, 470 M€ en 2023 (Citeo 447,0 + Adelphe 23,2). Soutiens tous matériaux 855 M€. Pas de taux plastique ni de soutien plastique."
  citation: "TAUX DE RECYCLAGE ESTIME FILIERE NOUVELLE NORME EUROPÉENNE 66 % 67 % | PLASTIQUES 432,7 23,2 456 447,0 23,2 470 3,1 % | PLASTIQUES 1 140 51 1 191 1 138 51 1 190"
  statut: "lu"
  consulte: "2026-10-15"
  note: "L'extraction s'arrête p. 38 ; les pages 55 à 70 (performances) n'ont pas été lues."

A8-MENA-PRIXREPRISE-2025:
  titre: "Actualisation pour 2026 des enveloppes de soutien dans le cadre d'un service optimisé de collecte et de tri des déchets d'emballages ménagers et de papiers graphiques (note de calcul métropole)"
  editeur: "Ministère de la Transition écologique, Direction de la Supervision des filières REP"
  date: "juillet 2025"
  annee_donnees: "prix et tonnages repris 2024 ; prix 2022 et 2023 en série"
  type: "statistique_publique"
