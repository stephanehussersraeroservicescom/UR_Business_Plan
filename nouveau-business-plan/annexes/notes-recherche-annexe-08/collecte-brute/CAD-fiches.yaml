  "contenu": "Objectifs de recyclage des emballages plastiques : 50 % fin 2025, 55 % fin 2030. Contenu recyclé minimal d'origine post-consommation au 1er janvier 2030 : 30 % (PET sensible au contact), 10 % (autres sensibles au contact), 30 % (bouteilles de boisson), 35 % (autres) ; au 1er janvier 2040 : 50 %, 25 %, 65 %, 65 %. La définition du recyclage des matériaux exclut la valorisation énergétique et la conversion en combustible. L'expression recyclage chimique n'apparaît pas (0 occurrence). Les technologies de recyclage seront évaluées dans des actes d'exécution (méthode de calcul, avant le 31/12/2026) et des actes délégués (critères de durabilité)."
  "citation": "i) 50 % pour le plastique; | i) 55 % pour le plastique; | d) 35 % pour les emballages en plastique autres que ceux visés aux points a), b) et c) du présent paragraphe. | d) 65 % pour les emballages en plastique autres que ceux visés aux points a), b) et c) du présent paragraphe. | à l’exception du traitement biologique des déchets, du retraitement des matières organiques, de la valorisation énergétique et de la conversion pour l’utilisation comme combustible ou pour des opérations de remblayage; | la Commission évalue les technologies de recyclage disponibles, en tenant compte de leurs performances économiques et environnementales | Il est applicable à partir du 12 août 2026."
