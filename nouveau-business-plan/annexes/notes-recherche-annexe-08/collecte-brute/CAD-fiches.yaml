  "date": "2019-04-17"
  "annee_donnees": "sans objet"
  "type": "reglementaire"
  "url": "https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32019D0665"
  "emplacement": "annexe II (point de calcul) ; art. 6 septies §1 ; art. 4 §1"
  "contenu": "Méthode de calcul : pour les plastiques, le recyclage est mesuré au point de calcul, c'est-à-dire les plastiques triés par polymère, sans traitement supplémentaire, avant granulation, extrusion ou moulage ; la quantité de déchets produits est recoupée avec les emballages mis sur le marché (pas d'équivalence imposée) ; les exportations hors UE ne sont comptées comme recyclage qu'avec preuve de conditions équivalentes."
  "citation": "Plastiques triés par polymères ne faisant pas l'objet d'un traitement supplémentaire | avant d'être soumis à des opérations de pelletisation, d'extrusion ou de moulage | y compris en utilisant des données sur la quantité d'emballages mis sur le marché | les déchets d'emballages exportés hors de l'Union ne sont comptabilisés comme valorisés ou recyclés que s'il existe"
  "statut": "lu"
  "consulte": "2026-10-15"
  "note": "WebFetch. Version initiale de l'acte modificatif ; la décision 2005/270/CE consolidée n'a pas été lue."
