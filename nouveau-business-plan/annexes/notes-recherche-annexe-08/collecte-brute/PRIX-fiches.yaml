  contenu: "Tarif OMr facture aux membres : 109,4 EUR/t en 2024, 2025 et 2026 (plus 6,3 EUR/hab part population). Objets encombrants 'classique' 145 EUR/t (2025), 146 EUR/t (2026). Vides de fours 2026 : 60 kt de dechets 'ordinaires' de tiers factures 108 EUR/t ; CSR 16 ou 84 EUR/t."
