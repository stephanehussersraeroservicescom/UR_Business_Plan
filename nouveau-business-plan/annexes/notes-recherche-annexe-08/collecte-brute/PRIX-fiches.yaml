- id: A8-PRIX-AMORCE-DT156-2023
  titre: "Recettes de vente d'electricite et de chaleur des Unites de Valorisation Energetique des dechets - donnees 2023 (DT156)"
  editeur: "AMORCE, avec le soutien de l'ADEME (ref. ADEME 012805)"
  date: "2025-05 (mise en ligne 2025-06-04)"
  annee_donnees: 2023
  type: "enquete associative (association de collectivites)"
  url: "https://amorce.asso.fr/publications/recettes-de-vente-d-electricite-et-de-chaleur-des-unites-de-valorisation-energetique-des-dechets-donnees-2023-dt156/download"
  emplacement: "p. 23, section 3.1.3 'Des ventes remuneratrices'"
  contenu: "Prix moyen par tonne traitee en UVE en 2023 : 120 EUR HT/t pour les clients prives ; 95 EUR HT/t pour les collectivites adherentes au syndicat de traitement."
  citation: "En 2023, le prix moyen par tonne traitée était de 120 € HT pour les clients privés, contre 95 € HT pour les collectivités adhérentes au syndicat de traitement des déchets."
  statut: lu
  consulte: "2026-10-15"
  note: "Successeur de DT139. HT explicite. TGAP incluse ou non : NON PRECISE dans la phrase (la Figure 18 voisine est 'hors taxes et hors TGAP' mais porte sur des recettes en MEUR). Transport : non precise. Echantillon : 59 questionnaires exploites (117 sollicites), 40 reponses pour la Figure 18 ; taille exacte pour ce prix non precisee. Contexte : paragraphe sur les ventes de vides de four (3e poste de recettes). Contradiction avec DT139 (2021 : 76 EUR/t collectivites, 133 EUR/t prives) : prive en baisse (133 -> 120), collectivites en hausse (76 -> 95) ; echantillons et definitions differents (DT139 : 'hors couts de transport', HT/TGAP non precises), donc evolution non interpretable directement."

