"A8-MENB-DGPR-COUTSREF-2026":
  "titre": "Actualisation pour 2026 des enveloppes de soutien dans le cadre d'un service optimisé de collecte et de tri des déchets d'emballages ménagers et de papiers graphiques : note de calcul métropole"
  "editeur": "Ministère de la transition écologique, Direction de la Supervision des filières REP"
  "date": "juillet 2025"
  "annee_donnees": "coûts des refus 2023 ; coûts de tri 2024 ; tonnages de référence 2026"
  "type": "reglementaire"
  "url": "https://www.ecologie.gouv.fr/sites/default/files/documents/ActualisationCoutsR%C3%A9f%C3%A9renceSPGD2026_note%20de%20calcul%20m%C3%A9tropole_vf.pdf"
  "url_2": "https://www.ecologie.gouv.fr/sites/default/files/documents/ActualisationCoutsR%C3%A9f%C3%A9renceSPGD2026_r%C3%A9sultats_vf.pdf"
  "emplacement": "§1.3 p. 5 ; annexe 3 (Tri) p. 24-25 ; annexe 6 p. 28 ; §10.2 p. 12 (pages déduites de l'extraction) ; url_2 : p. 4 et p. 11"
  "contenu": "Modèle de service optimisé, France métropolitaine, emballages légers et papiers ménagers. Taux de refus moyen : 21,1 % emballages légers (21,4 % en annexe 6), 6,4 % papiers. Refus calculés : 496 kt, dont 30 % repris par l'éco-organisme (hypothèse) et 347 kt à la charge des collectivités. Coût de gestion des refus : 159 € HT/t TGAP comprise (incinération 136, transport 23), sommes de médianes ADEME, données 2023. Coût de tri 2024 : 645,6 M€ hors refus, 700,7 M€ refus compris. Document de résultats (url_2) : coûts de refus 55 M€, hausse de 11 %."
  "citation": "21,1 % pour les emballages légers | TOTAL tonnages refusés [kt] 496 | Hypothèse tonnages refusés repris par l'EO [%] 30% | Coûts de gestion des refus (€ HT/t) 159 | Dont incinération (coût technique) 136 | Dont transport 23 | Somme des médianes des coûts complets (y compris TGAP) de transport | Générateur de référentiel 04.2025 – données métropole 2023 | Gestion des refus de tri : +11% dus à l'augmentation des coûts de valorisation énergétique"
  "statut": "lu"
  "consulte": "2026-10-15"
  "note": "Lu par WebFetch (extraction texte, citations courtes restituées par l'outil, pages à confirmer). Tonnages calculés, pas observés. Le texte ne justifie pas l'hypothèse de 30 %."
