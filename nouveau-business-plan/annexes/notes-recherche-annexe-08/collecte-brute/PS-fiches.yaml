A8-PS-CITEOAO-2022:
  titre: "Citeo donne le coup d'envoi de la filière de recyclage à grande échelle (communiqué PS, titre complet plus long)"
  editeur: "Citeo"
  date: "2022-12-21"
  annee_donnees: "2022 (mises en marché annuelles) et prévisions 2023-2024"
  type: "etude_publique"
  url: "https://bo.citeo.com/sites/default/files/2022-12/Citeo_CP%20PS%20AO%20recyclage_21122022.pdf"
  emplacement: "PDF, encadré « Le PS en France » et corps du texte (page non donnée par l'outil)"
  contenu: "PS ménager (emballages) France : 100 000 t mises en marché par an dont 60 000 t de pots sécables. Lauréats : Indaver (80 %, Anvers) et Eslava (20 %, Valence, Espagne, avec Valorplast). Engagement d'au moins 10 000 t/an. Capacité initiale Indaver annoncée 30 000 t, portée à 65 000 t/an. Contrats 9 ans (Indaver) et 6 ans (Eslava). Trois centres de sur-tri pour 70 000 t/an."
  citation: "100 000 tonnes mises en marché chaque année, dont 60 000 tonnes de pots sécables | avec un engagement d’au moins 10 000 tonnes par an. | Dès 2024, cette usine fonctionnera avec une capacité initiale de 30 000 tonnes, | et sera portée à une capacité de 65 000 tonnes par an. | 80% alimenteront la future usine Plastic2Chemicals de l’entreprise belge Indaver, à Anvers, | 20% approvisionneront l’usine de Valence de l’entreprise espagnole Eslava en partenariat avec | de haute qualité au PS, via la pyrolyse, dès sa mise en œuvre opérationnelle en 2024. | Les contrats avec ces entreprises ont été conclus pour 9 ans (Indaver) et 6 ans (Eslava),"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Communiqué d'éco-organisme. Prévisions, pas de réalisé. Le procédé Indaver y est appelé « pyrolyse » ; Indaver et Ineos parlent de dépolymérisation."
A8-PS-CITEOMAP-2024:
  titre: "Mise au point : les pots de yaourt pourront bien être recyclés en de nouveaux pots de yaourt en 2025"
  editeur: "Citeo"
  date: "2024-06-25"
  annee_donnees: "2024"
  type: "etude_publique"
  url: "https://bo.citeo.com/sites/default/files/2024-06/Citeo_CP_PS_25062024_1.pdf"
  emplacement: "PDF p. 1"
  contenu: "Les pots PS triés sont déjà recyclés chez Eslava (Espagne), avec des débouchés limités (pots de fleurs, cintres). Citeo reconnaît un retard de collecte et de tri."
  citation: "tous les pots de yaourt en PS collectés et triés via les bacs de tri des Français sont d'ores et déjà recyclés | dans l’usine Eslava en Espagne. | Leurs débouchés sont aujourd’hui limités, puisqu’ils sont principalement recyclés en pots de fleurs ou en cintres. | Oui, nous avons des progrès à faire sur la collecte et le tri de ces emballages, cela prend du temps."
  statut: "lu"
  consulte: "2026-10-15"
  note: "Aucun tonnage. Communiqué de défense de l'éco-organisme."
A8-PS-CITEOINDAVER-2025:
  titre: "Le pot de yaourt redevient un pot de yaourt : Lancement de la nouvelle filière de recyclage européenne du polystyrène avec l’usine Indaver"
  editeur: "Citeo"
  date: "2025-09-25"
  annee_donnees: "2025"
  type: "etude_publique"
  url: "https://www.citeo.com/wp-content/uploads/2025/11/CP-Citeo-Indaver-polystyrene.pdf"
  emplacement: "PDF, page unique"
  contenu: "Inauguration de l'usine Indaver (Anvers) le 25/09/2025. Répartition du PS ménager français : 80 % Indaver (recyclage chimique), 20 % Eslava (mécanique, depuis 2022). Aucun tonnage ni capacité."
  citation: "L’usine de la société Indaver, située à Anvers en Belgique et inaugurée ce jour, est la première capable de recycler | en boucle fermée le polystyrène compact issu des emballages ménagers | grâce à une technologie innovante de recyclage par pyrolyse. | Chez Indaver (Belgique) via ce procédé de recyclage chimique innovant (80 % des tonnages) ; | Chez Eslava (Espagne) via un recyclage mécanique (20 %), effectif depuis 2022."
  statut: "lu"
  consulte: "2026-10-15"
  note: "Ne vise que le PS compact, pas le PSE."
A8-PS-CITEOPSE-2025:
  titre: "Développer le recyclage des emballages ménagers en PSE (feuille de route)"
  editeur: "Citeo"
  date: "septembre 2025 (fichier mis en ligne en janvier 2026)"
  annee_donnees: "2025"
  type: "etude_publique"
  url: "https://www.citeo.com/wp-content/uploads/2026/01/Feuille-de-route-PSE.pdf"
  emplacement: "PDF p. 2, 3, 4, 5"
  contenu: "PSE ménager (emballages) : environ 15 000 t mises en marché ; moins de 20 % trié via le bac jaune ; environ 1 200 t/an triées ; PSE trié dégradé sans exutoire propre ; recycleurs n'acceptant que moins de 5 % en mélange. 15 % des déchèteries équipées ; plus de 600 t collectées sur 200 déchèteries ; standard expérimental lancé en 2023 avec 13 collectivités. Objectif : taux de recyclage du PSE supérieur à 50 % à moyen terme. Article 23 de la loi Climat et Résilience (interdiction au 1er janvier 2025) supprimé par l'article 37 de la loi DADDUE du 30/04/2025 ; échéances de recyclabilité PPWR à horizon 2030."
  citation: "Les emballages ménagers en PSE représentent aujourd’hui près de 15% des emballages ménagers styréniques | mis en marché, soit environ 15 000 tonnes. | Moins de 20% des emballages en PSE sont triés par les citoyens via le bac jaune ; | Avec seulement 1 200 T/an triées actuellement, le dispositif bac jaune ne constitue pas à date et | A l’issue du process de tri, le PSE dégradé, n’a pas d’exutoire en propre. | à date, les recycleurs n’acceptent le PSE que dans des proportions minimes (<5%). | Le recours à des solutions de recyclage du PSE non mélangé, aujourd’hui éprouvées et à l’échelle industrielle. | 15% des déchèteries en France sont déjà équipées pour la collecte du PSE | plus de 600 tonnes collectées sur 200 déchetteries | un taux de recyclage du PSE > 50% à moyen terme | supprime l’article 23 de la loi Climat et Résilience."
  statut: "lu"
  consulte: "2026-10-15"
  note: "Source la plus récente et la plus directe sur le PSE ménager. Les chiffres 1 200 t/an et 600 t sont des tonnages triés ou collectés, pas recyclés. Aucun tonnage recyclé, aucun prix, aucun recycleur nommé."
