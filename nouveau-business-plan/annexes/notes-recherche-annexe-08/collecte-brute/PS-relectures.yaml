RP2-030:
  ouvert: "oui"
  emplacement: "page unique, sans pagination"
  citation: "Le gisement national est estimé à 100 000 tonnes - composé essentiellement de pots de yaourt ou de compote, | de barquettes destinées à la viande ou au poisson. | Les emballages plastiques ménagers en PS qui respectent les critères d’écoconception déterminés par le COTREP | deviendraient donc “recyclables” en 2025 avec les deux usines de recyclage opérationnelles : à leur mise en service, | ce seraient ainsi près de 10 000 tonnes d’emballages PS qui seraient recyclées, | avec Eslava et Indaver, les 2 entreprises lauréates de l’appel d’offres Citeo sur les flux de déchets PS,"
  contenu: "Communiqué COTREP du 6 septembre 2023. Gisement PS ménager (emballages) France estimé à 100 000 t ; au conditionnel, environ 10 000 t recyclées à la mise en service des usines. Ni localisation des usines ni procédés."
  statut_propose: "lu"
  note: "URL valide. Prévision 2023, pas un tonnage recyclé constaté."
RP-060:
  ouvert: "oui"
  emplacement: "PDF p. 2 (art. 1), p. 3 (art. 3), p. 8 (annexe 1) ; tampon préfecture 21/01/2025 ; date de signature vide"
  citation: "en partenariat avec KNAUF Circular au départ des points d’enlèvement | Faire valoriser en Europe ces plastiques, dans le respect des conditions réglementaires et environnementales en vigueur | est fixé à : 55 € / tonne pour l’année 2025. | Qualité (pureté en poids) 98% | Produits refusés PSE issus de la déconstruction (chantiers, bâtiments…) et PSE colorés | Conditionné dans des sacs transparents de minimum 1 m3 (volume utile) et d’épaisseur supérieure à 40 µm"
  contenu: "Flux HCS PSE VRAC (calage et caisses de marée en PSE blanc, déchèterie ou activités économiques). Valorplast achète 55 €/t (2025) ; enlèvement Knauf Circular dès 20 m3 ; contrat jusqu'au 31/12/2027 ; valorisation « en Europe » sans pays ni recycleur final."
  statut_propose: "lu"
  note: "URL valide. Contrat type annexé à une délibération : prix propre à ce contrat, pas une moyenne nationale."
