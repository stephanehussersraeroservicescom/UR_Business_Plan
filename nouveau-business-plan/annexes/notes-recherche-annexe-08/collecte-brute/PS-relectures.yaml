  citation: "PEHD-PP-PS"
  contenu: "Observatoire de la reprise 2024 (Citeo/Adelphe, 06/10/2025). Aucun prix, tonnage, repreneur ou destination propre au PS ou au PSE ; le PS n'apparaît que dans ce libellé de catégorie qualité, sans valeur."
