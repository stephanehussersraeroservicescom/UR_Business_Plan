A8-DEV-JRC-PLASTICS-VEHICLES-2023:
  titre: "Towards recycled plastic content targets in new passenger cars and light commercial vehicles (EUR 31047 EN, JRC129008)"
  editeur: "Commission européenne, Centre commun de recherche (Maury, Tazi, Torres de Matos et al.)"
  date: "13/07/2023"
  annee_donnees: "composition : centres de traitement 2015-2018 ; VHU 2018 ; production 2019"
  type: "etude_publique"
  url: "https://publications.jrc.ec.europa.eu/repository/bitstream/JRC129008/JRC129008_01.pdf"
  emplacement: "résumé p. 5 ; §1.1.1 p. 12 ; §1.1.3 et §1.2.1 p. 15 ; §2.1.2-2.1.3 p. 22-25, tableau 4"
  contenu: "Plastiques : 14 à 18 % de la masse des voitures actuelles (190 à 360 kg) ; 12 % dans les VHU actuels (1 100 kg). Composition des VHU actuels : PP 37 %, PU 15 %, PA 12 %, PE 8 %, ABS 7 %, PET 5 %, PVC environ 3 %, PC environ 2 %. UE : environ 1,5 Mt/an de plastiques mixtes, environ 1 Mt collectée en centres de traitement ; plus de 75 % éliminés, 9 à 15 % recyclés (ailleurs : environ 19 % envoyés en recyclage). Démontage limité à 10 % au maximum. France (citant ADEME 2020) : 32 % des plastiques des VHU enfouis."
  citation: "plastics materials in current passenger cars range from 14 to 18% of | PP (37%); PUR (15%); PA (12%) | PVC is being significantly decreased from vehicles in Europe according to recyclers feedbacks, being around 3%. | mixed plastics materials account for around 1.5 million tonnes annually (Williams et al., 2020) | Currently more than 75% of the collected ELV plastics are disposed of, while only 9-15% is recycled. | only a small share (around 19%) is sent to recycling routes | an average of 32% of the total embodied plastic in ELVs is discarded in landfill"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Source primaire européenne. Le chiffre France (ADEME 2020) est cité de seconde main : lire l'étude ADEME 2020 d'origine."

