  contenu: "Gros électroménager (LHA) et appareils de froid (CFA) : brome moyen 1 200 ppm (LHA) et 330 ppm (CFA), d'après Hennebert 2015 ; petit électroménager (SDA) 3 500, écrans plats 6 900, tubes cathodiques 9 400 ppm. Environ 1,5 % des plastiques LHA bromés (estimation de l'UBA allemand). Seuil de tri de 2 000 ppm (EN 50625), non applicable aux LHA et CFA. Somme des PBDE : 260 ppm (LHA), 150 ppm (CFA)."
  citation: "on average 1.5% of LHA plastics are brominated | 2000 ppm Br sorting threshold exceeded in a few LHA samples | BFR-rich fraction must be separated before recycling | Currently applicable POP limit values are not exceeded in any LHA or CFA sample."
