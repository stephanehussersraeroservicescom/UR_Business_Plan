A8-DEV-ELV-REG-2026-1738:
  titre: "Règlement (UE) 2026/1738 du 8 juillet 2026 relatif aux exigences de circularité pour la conception des véhicules et à la gestion des véhicules hors d'usage (PE-CONS 13/1/26 REV 1 ; procédure 2023/0284(COD))"
  editeur: "Parlement européen et Conseil ; fiche de procédure de l'Observatoire législatif (OEIL)"
  date: "signé le 08/07/2026 ; JO L du 24/07/2026"
  annee_donnees: "sans objet"
  type: "reglementaire"
  url: "https://data.consilium.europa.eu/doc/document/PE-13-2026-REV-1/en/pdf"
  url_2: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2023/0284(COD)"
  emplacement: "PE-CONS : considérant 29 p. 27-28, considérant 82 p. 71 ; OEIL : tableau des événements"
  contenu: "Calendrier : vote du Parlement le 18/06/2026 ; adoption par le Conseil le 29/06/2026 ; signature le 08/07/2026 ; publication au JO le 24/07/2026 (règlement 2026/1738). 20 % de l'objectif de contenu recyclé doivent provenir de plastiques de VHU ; recyclage chimique admis avec bilan massique. Objectif spécifique de recyclage de 30 % des plastiques de VHU après une transition de 3 ans ; 85 % et 95 % maintenus pendant la transition."
  citation: "Regulation 2026/1738 | OJ L 24.07.2026 | 20 % should be achieved by including plastics recycled from end-of-life vehicles | To allow recycling methods other than mechanical recycling, including chemical recycling | a specific recycling target of 30 % of plastics from end-of-life vehicles | the current target for the reuse and recycling of 85 %"
