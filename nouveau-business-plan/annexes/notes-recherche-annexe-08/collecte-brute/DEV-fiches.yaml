A8-DEV-ECOSYSTEM-RA-2025:
  titre: "6 défis pour faire avancer la circularité, Rapport annuel 2025"
  editeur: "ecosystem (éco-organisme)"
  date: "2026"
  annee_donnees: "2025 (comparaison 2024)"
  type: "observatoire"
  url: "https://www.ecosystem.eco/document/483"
  emplacement: "p. 10 (taux de recyclage) ; p. 34-35 (collecte) ; p. 39, tableau « Substances réglementées et dangereuses extraites des EEE et des lampes En tonnes »"
  contenu: "Collecte totale ecosystem 2025 : 893 400 t (2024 : 856 651 t), dont EEE ménagers 703 510 t. Taux de recyclage EEE ménagers 79,6 %. Dépollution 2025 : 39 301,93 t de matières plastiques contenant des retardateurs de flamme bromés (RFB) extraites ; 13 297,16 t de câbles électriques ; total des substances extraites 93 143,81 t. Aucun chiffre sur les plastiques recyclés, valorisés ou éliminés ; aucune mention du PVC ni du recyclage chimique. Recettes de revente de matières : 114,2 M€, sans prix à la tonne."
  citation: "Substances réglementées et dangereuses extraites des EEE et des lampes En tonnes | Matières plastiques contenant des retardateurs de flamme bromés 39301,93 | Câbles électriques 13297,16 | Total 93143,81 | Total 856651 893400 +4,3% | Taux de recyclage 79,6% 82,3% 82,2% 76,2%* | 114,2 M€ de recettes liées à la revente de matières issues des déchets traités | extraire l’antimoine et le brome des plastiques ignifugés"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Rapport d'éco-organisme, périmètre ecosystem seul (Ecologic exclu). Le 39 301 t est le tonnage de plastiques orientés en dépollution RFB (fraction triée), pas une teneur mesurée en RFB. Le document /325 annoncé comme rapport 2024 renvoie en fait à une autre procédure (lien erroné)."

A8-DEV-ECOSYSTEM-RECYCHIM-2020:
  titre: "Recyclage chimique des plastiques : Application aux plastiques issus des DEEE"
  editeur: "ecosystem (étude réalisée par Lavoisier Circular Transition, Procetech, Bleu Safran)"
  date: "décembre 2020"
  annee_donnees: "2019"
  type: "etude_publique"
  url: "https://pro.ecosystem.eco/document/78"
  emplacement: "p. 4-6 (pyrolyse), p. 14 (gisement), p. 23-24 (tableau 5, part ignifugée), p. 29 (gate fee)"
  contenu: "Gisement potentiel de plastiques dans les DEEE ménagers d'ecosystem : environ 315 000 t, soit environ 17 % de la masse. En moyenne 8 % en masse des plastiques de petits appareils ménagers (PAM) et d'écrans sont ignifugés ; avec l'entraînement d'autres plastiques au tri par densité, environ 25 % sont considérés comme bromés et envoyés en incinération de déchets dangereux, à un coût dit « très significatif » (non chiffré). PAM : 69,89 % du thermoplastique recyclé, 13,19 % valorisé, 16,92 % éliminé, 11 100 t non recyclées. Gate fee des combustibles solides de récupération (CSR) issus de plastiques DEEE au Royaume-Uni : 160 à 260 €/t. Pyrolyse rapide évoquée pour la fraction bromée, moins mature que la solvolyse."
  citation: "La part potentielle des plastiques est estimée à 315 000t soit environ 17% de la masse. | évalue qu’en moyenne 8% en masse des plastiques de PAM et d’écrans sont ignifugés | De ce fait c’est alors environ 25% de plastiques considérés comme bromés. | Cette fraction est orientée vers l’incinération de déchets dangereux pour destruction. | Le coût de traitement de ces fractions plastiques est très significatif. | Tableau 5 : taux de recyclage par flux de DEEE et total du tonnage non recyclé (données ecosystem) | PAM 69,89% 13,19% 16,92% 30,11% 11 100 | le « gate fee » oscille entre 150£/t to 240£/t (160€/t to 260€/t). | la fraction des plastiques bromés pourrait être traitée soit par pyrolyse rapide soit par dissolution sélective"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Étude commandée par un éco-organisme, données 2019 (moins de 8 ans). Les colonnes du tableau 5 viennent de l'extraction de l'outil ; le libellé « valorisé » s'entend comme valorisation énergétique selon le texte. Source la plus directe trouvée sur les plastiques DEEE en France."

A8-DEV-INERIS-BROME-2020:
  titre: "Campagne d'analyse sur la teneur en brome et composés bromés dans les plastiques du broyage de déchets d'équipements électriques et électroniques (DEEE)"
  editeur: "Ineris (rapport Ineris-20-177538-2403850-v1.0)"
  date: "22/10/2020"
  annee_donnees: "2019-2020 (campagne sur 3 sites)"
  type: "etude_publique"
  url: "https://www.ineris.fr/sites/ineris.fr/files/contribution/Documents/Rapport-Ineris-20-177538-2403850_DEEE-v1.pdf"
  emplacement: "p. 5 (résumé), p. 8 note 3, p. 9-10 (§1.2.5), p. 13 (§1.3), p. 24, p. 29 tableau 11"
  contenu: "Seuil de tri : 2 000 ppm de brome total (TS 50625-3-1, courrier ministériel du 16/07/2014). Environ 5 à 7 % des broyats avant tri ont une forte teneur en brome ; après tri, moins de 2 % dépassent les limites. 25 installations françaises trient des plastiques de DEEE (22 PAM, 3 écrans plats). Les fractions denses bromées sont destinées à l'élimination ; pour les flux dépassant les seuils POP, seule l'élimination est possible (dont D10, incinération à terre)."
  citation: "seuls quelques broyats (environ 5 à 7 % pour les flux de broyats avant tri) avec une concentration élevée en brome | La proportion de broyats concernés est inférieure à 2 %. | au-delà de 2000 ppm (soit 0,2 %) de brome total, un plastique est réputé en contenir. | seule l’élimination est possible pour ces flux. | 22 pour des plastiques provenant de PAM et 3 pour des plastiques provenant d’écrans plats."
  statut: "lu"
  consulte: "2026-10-15"
  note: "Organisme public d'expertise. Ni tonnage national, ni coût, ni données sur le PVC."

A8-DEV-CIRCULAIRE-PLASTIQUES-DEEE-2012:
  titre: "Circulaire du 30/11/12 relative à la gestion des plastiques issus des déchets d'équipements électriques et électroniques (NOR DEVP1238608C)"
  editeur: "Ministère de l'écologie (BO MEDDE 2012/24), texte reproduit sur AIDA (Ineris)"
  date: "30/11/2012, publiée le 10/01/2013"
  annee_donnees: "sans objet"
  type: "reglementaire"
  url: "https://aida.ineris.fr/reglementation/circulaire-301112-relative-a-gestion-plastiques-issus-dechets-dequipements"
  emplacement: "corps de la circulaire et annexe I"
  contenu: "Les plastiques de DEEE sont présumés potentiellement dangereux, sauf ceux des gros appareils ménagers (GEM froid et GEM hors froid), présumés sans RFB. Tri obligatoire au minimum selon la présence de brome ; séparation des plastiques de GEM. Au-dessus des seuils POP : obligation d'incinération ou de destruction (D9, D10, R1)."
  citation: "Les déchets de plastiques non souillés issus des DEEE sont potentiellement des déchets dangereux | Les déchets de plastiques issus du démantèlement des GEM et des GEM HF étant présumés ne pas contenir de RFB | il est nécessaire de réaliser a minima un tri selon le premier niveau | fera l'objet d'une obligation d'incinération"
  statut: "lu"
  consulte: "2026-10-15"
  note: "DONNÉE DE PLUS DE 8 ANS (2012). AIDA la donne en vigueur, mais elle cite des textes abrogés (règlement 850/2004). Les seuils ont été remplacés par le règlement 2019/1021 et ses modifications."

A8-DEV-POP-ART7-2019:
  titre: "Règlement (UE) 2019/1021 concernant les polluants organiques persistants, article 7 (version d'origine adoptée)"
  editeur: "UE ; copie de legislation.gov.uk (National Archives)"
  date: "20/06/2019"
  annee_donnees: "sans objet"
  type: "reglementaire"
  url: "https://www.legislation.gov.uk/eur/2019/1021/article/7/adopted"
  emplacement: "article 7, paragraphes 2, 3 et 4 a)"
  contenu: "Les déchets dépassant les limites de l'annexe IV doivent être traités de façon que le POP soit détruit ou irréversiblement transformé. Les opérations pouvant conduire au recyclage ou à la réutilisation des POP sont interdites. En dessous des limites de l'annexe IV, élimination ou valorisation libres."
  citation: "the POP content is destroyed or irreversibly transformed | Disposal or recovery operations that may lead to recovery, recycling, reclamation or re-use | waste containing or contaminated by any substance listed in Annex IV may be otherwise disposed of or recovered | the content of the listed substances in the waste is below the concentration limits specified in Annex IV."
  statut: "secondaire"
  consulte: "2026-10-15"
  note: "EUR-Lex est inaccessible (robots). Copie en anglais de la version d'origine, non consolidée. Lire sur EUR-Lex la version consolidée (CELEX 02019R1021) et le texte français."

A8-DEV-POP-PBDE-2025:
  titre: "Règlement délégué de la Commission du 24.7.2025 modifiant le règlement (UE) 2019/1021 en ce qui concerne ... tétraBDE, pentaBDE, hexaBDE, heptaBDE et décaBDE, C(2025) 4797 final (doc. Conseil 12184/25)"
  editeur: "Commission européenne, transmis au Conseil de l'UE"
  date: "24/07/2025 (transmis le 21/08/2025)"
  annee_donnees: "sans objet"
  type: "reglementaire"
  url: "https://data.consilium.europa.eu/doc/document/ST-12184-2025-INIT/fr/pdf"
  emplacement: "exposé des motifs p. FR 1-2 ; considérants p. FR 4-6"
  contenu: "Annexe IV (déchets), limite pour la somme des PBDE (tétra, penta, hexa, hepta, déca) : abaissée de 1 000 à 500 mg/kg par le règlement (UE) 2022/2400, puis 350 mg/kg à partir du 30/12/2025 et 200 mg/kg à partir du 30/12/2027. Le décaBDE est le principal PBDE détecté dans les articles en plastique recyclé. Spectrométrie de fluorescence X : environ 30 mg/kg de brome (environ 5 mg/kg de PBDE). L'acte modifie les limites UTC (contaminants à l'état de traces) de l'annexe I, sans valeur lisible dans l'extraction."
  citation: "la limite de concentration pour la somme des concentrations des PBDE concernés dans les déchets | a été abaissée de 1 000 mg/kg à 500 mg/kg | sera encore réduite à 350 mg/kg et 200 mg/kg à partir du 30 décembre 2025 et du 30 décembre 2027 respectivement | réduit la limite de concentration dans les déchets pour la somme des substances tétraBDE, pentaBDE,"
  statut: "lu"
  consulte: "2026-10-15"
  note: "Document officiel, mais ce n'est pas le texte de l'annexe IV lui-même. Le règlement 2022/2400 (EUR-Lex bloqué) et le règlement 2025/1482 (référence vue dans les résultats de recherche, non lu) sont à lire sur EUR-Lex."

A8-DEV-SOFIES-BFR-2020:
  titre: "Study on the Impacts of Brominated Flame Retardants on the Recycling of WEEE plastics in Europe"
  editeur: "Sofies (A. Haarman, F. Magalini, J. Courtois), pour BSEF"
  date: "novembre 2020"
  annee_donnees: "modélisation 2020 ; échantillons 2010-2019"
  type: "etude_publique"
  url: "https://www.bsef.com/wp-content/uploads/2020/11/Study-on-the-impact-of-Brominated-Flame-Retardants-BFRs-on-WEEE-plastics-recycling-by-Sofies-Nov-2020-1.pdf"
  emplacement: "p. 6, 20-29, 36-37 (pages approximatives)"
  contenu: "UE28 + Suisse + Norvège : 2,6 Mt/an de plastiques DEEE générés, dont environ 9 % bromés (220 kt). Sur 1,3 Mt collectées, 22 % recyclées (560 kt) et 22 % valorisées énergétiquement (555 kt) ; 30 % non documentées. Sur 98 kt de plastiques RFB collectés, 76 kt incinérées, 19 kt enfouies, 2 kt recyclées. Seuil de séparation de 2 000 ppm de brome fixé par la série EN 50625. La France est un cas particulier : classement en déchet dangereux selon l'origine et la teneur en brome. Ni coût ni prix."
  citation: "In total, 2.6 million tons of WEEE plastics are generated annually | Brominated plastics represent about 9% of the total | It appears that 220 kt of BFR plastics arise annually in WEEE | ultimately 22% are recycled (560 kt), 22% energetically valorised (555 kt) | Out of the 98 kt of BFR plastics present in WEEE collected, 76 kt are incinerated | It introduces a separation threshold of 2,000 ppm Br to distinguish | France represents a unique case, where both origin of waste"
  statut: "lu"
  consulte: "2026-10-15"
  note: "SOURCE COMMERCIALE : financée par BSEF (industrie des retardateurs de flamme bromés). Périmètre européen."

A8-DEV-DSS-BSEF-2023:
  titre: "Brominated Flame Retardants and the Circular Economy of WEEE Plastics: State of Play"
  editeur: "dss+ (A. Haarman, S. Fedato, A. Holt), pour BSEF"
  date: "septembre 2023"
  annee_donnees: "non précisée (synthèse)"
  type: "etude_publique"
  url: "https://www.bsef.com/wp-content/uploads/2023/09/Brominated-Flame-Retardants-and-the-Circular-Economy-of-WEEE-Plastics.pdf"
  emplacement: "p. 9, 12-13, 35, 47"
  contenu: "Part moyenne de plastiques contenant des RFB dans les plastiques DEEE : 3,5 % (écrans et petits équipements 7 à 8 %). Seulement 7 % des plastiques DEEE générés en Europe (0,2 Mt) sont recyclés en Europe. Pyrolyse et recyclage chimique pas matures pour les plastiques DEEE. Cas particulier de la France."
  citation: "WEEE plastics contain an average of 3.5% BFR-containing plastics. | Only 7% (0.2 million tonnes) of all WEEE plastics generated in Europe are actually recycled within Europe. | are not mature and their application to WEEE plastics is still at a very early stage of development | France represents a unique case"
  statut: "lu"
  consulte: "2026-10-15"
  note: "SOURCE COMMERCIALE (BSEF). L'extraction s'arrête après la section 3.4.1."

