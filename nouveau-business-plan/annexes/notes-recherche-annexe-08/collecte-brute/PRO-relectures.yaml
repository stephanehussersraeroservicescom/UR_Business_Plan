PRE-FILMS-2018:
  ouvert: "oui"
  emplacement: "p. 2, 9, 12, 13 (figure 5), 16, 17, 22, 31"
  citation: "AN ESTIMATED 13-15 MT OF FLEXIBLE FILMS, OF WHICH 8.5-9 MT IS PE FLEXIBLE FILMS | 46% OF FLEXIBLE FILMS WERE ESTIMATED TO BE COLLECTED ACROSS THE EU28+2 IN 2018. | Of the total PE films POM, 23% was sent for recycling in 2018. | Only 23% of PE flexible films (and 15% of flexible films overall) were sent for recycling | In 2018 the EU28+2 reprocessed approximately 70% of commercial PE flexible films sent for recycling | encourage the use of more recyclable PE film and discourage use of PVC and PET films;"
  contenu: "UE28+2, données 2018 : 13 à 15 Mt de films mis en marché, dont 8,5 à 9 Mt de PE ; 46 % collectés ; 23 % des films PE envoyés au recyclage (15 % tous films). Figure 5 (étiquettes du graphique, à vérifier) : ménager 17 %, commercial 30 %, agricole 38 %."
  statut_propose: "lu"
  note: "Flexible Films Market in Europe: State of Play (Eunomia pour PRE), sans date de publication (URL déposée en 10/2022). Taux 'sent for recycling' = envoyé au recyclage, pas recyclé effectif. Données 2018, à la limite de huit ans."
PRE-FILMS-2023:
  ouvert: "oui"
  emplacement: "p. 6, 13, 19, 21, 23, 25, 37"
  citation: "In 2020, a total of 13.7 million tonnes of flexible films were placed on the EU27+3 market | In 2020, 5.7 million tonnes of flexible films were collected for recycling by separate collection schemes in Europe. | only 2.4 million tonnes of flexible films were used as input for recyclers in the region in 2020. | This represents a recycling rate of 18% in relation to the films placed on the market. | Commercial and Industrial waste stream accounted for 3.6 million tonnes of collected volumes | Agricultural waste stream accounted for 0.6 million tonnes of collected volumes | other polymers such as PVC, PA, PET, etc. are also used in the production of flexible films."
  contenu: "UE27+3, données 2020 : 13,7 Mt de films mis en marché ; 5,7 Mt collectés (dont 1,5 Mt ménager, 3,6 Mt commercial et industriel, 0,6 Mt agricole) ; 2,4 Mt en entrée de recycleurs ; environ 1,9 Mt de recyclat ; taux 18 % (entrées recycleurs / mise en marché). Pas de taux par segment."
  statut_propose: "lu"
  note: "PRE avec ICIS, 2023. Dernière édition PRE trouvée ; l'édition 2025 d'AMI est payante."
RP2-041:
  ouvert: "oui"
  emplacement: "p. 25 et 26 (section plastiques)"
  citation: "Au total, 1 024 000 tonnes de plastiques ont été collectées et recyclées en 2024, contre 1 004 700 tonnes en 2023. | Sur le tonnage total collecté en 2024, 31 % proviennent des déchets ménagers et 69 % des déchets industriels. | …pour atteindre 711 314 tonnes. | …ont recyclé 796 kt de matières plastiques | une large offre de PET, PVC et PE (vierges et recyclés) en provenance d'Asie du Sud-Est."
  contenu: "Le marché du recyclage 2024 (FEDERREC), données 2024 : 1 024 000 t de plastiques collectées et recyclées ; 31 % ménager, 69 % industriel ; collecte industrielle 711 314 t ; 796 kt régénérées en France dont 632 kt d'origine française. Rien sur films, chutes ou prix chiffrés."
  statut_propose: "lu"
  note: "URL fournie valide (federrec.com, la fédération a changé de nom) ; la variante federec.com renvoie vers elle par redirection 302. Pas de date de publication explicite (contenu situé en 2025). La p. 26 signale qu'une section 'fait l'objet d'une vérification'. Fédération professionnelle. Pas d'édition données 2025 trouvée."
