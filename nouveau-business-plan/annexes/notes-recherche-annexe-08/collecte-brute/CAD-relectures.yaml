  "citation": "c) de l’application d’un taux d’appel uniforme au poids des déchets d’emballages en plastique non recyclés produits dans chaque État membre. Le taux d’appel uniforme est de 0,80 EUR par kilogramme. Pour certains États membres, une réduction forfaitaire annuelle, définie au paragraphe 2, troisième alinéa, s’applique;"
