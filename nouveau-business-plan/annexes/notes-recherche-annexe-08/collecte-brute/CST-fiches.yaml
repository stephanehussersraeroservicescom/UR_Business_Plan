  emplacement: "rescrit, texte unique"
  contenu: "La loi n° 2026-103 du 19/02/2026 (article 81) transfère la composante déchets de la TGAP dans le CIBS à compter du 1er mars 2026. Elle devient trois taxes : déchets métalliques radioactifs, déchets mis en décharge (tarifs : L. 433-57), déchets incinérés (tarifs : L. 433-86). Aucun montant en €/t."
