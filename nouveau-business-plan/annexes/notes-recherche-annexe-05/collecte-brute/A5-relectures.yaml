    contenu: "Part dans les OMR et humidite par fraction : S01 dechets de jardin 3,0 % et 59,7 % ; S02 autres putrescibles 26,3 % et 59,6 % ; S03 papiers 5,7 % et 28,9 % ; S04 cartons 6,6 % et 33,7 % ; S05 emballages composites 1,8 % et 28,3 % ; S06 autres composites 0,1 % et 18,8 % ; S07 textiles 4,9 % et 33,7 % ; S08 textiles sanitaires 17,0 % et 60,0 % ; S09 films plastiques (07.01 a 07.03) 8,6 % et 35,8 % ; S10 autres plastiques (07.04 a 07.14) 7,0 % et 20,1 % ; S11 emballages bois 0,3 % et 13,0 % ; S12 autres bois 0,7 % et 26,0 % ; S13 verre 4,7 % et 2,2 % ; S14 metaux 3,3 % et 13,2 % ; S15 autres matieres organiques 1,4 % et 27,5 % ; S17 autres matieres minerales 2,0 % et 14,1 % ; S18 fines de moins de 8 mm 5,4 % et 46,3 % ; moyenne 42,1 %. Somme des parts : 98,8 % (pas de ligne pour les dechets dangereux). Dans ce jeu, les fines de moins de 8 mm forment une fraction a part (5,4 %), alors que le jeu de composition omrcs-compo-jdd n'a pas de fines pour les OMR."
    citation: '"S09","07.01; 07.02; 07.03","8,6%","35,8%","4,81%" | "S18","14.02","5,4%","46,3%","6,35%" | "Moyenne",,,"42,1%","5,78%"'
    statut: lu
RP2-004:
  relecture_a5_2026_11_19:
    lu_par: "Claude, chat 5 annexe 5 : WebFetch (texte) et lecture visuelle de la p. 23 dans le navigateur de Stephane"
    titre_exact: "MODECOM 2024, Campagne nationale de caracterisation des dechets menagers et assimiles, Synthese, decembre 2025 (brochure ref. 013089-02), ADEME, realise par ECOGEOS"
    emplacement: "p. 13 (methode), p. 14, p. 21, p. 22 (tableau 1 et note 16), p. 23 (tableaux 2 et 3), p. 41 (tableaux 7 et 8)"
    contenu: "Methode : 100 echantillons d'OMR dans 50 communes, 16 strates ; 5 retires, 95 analyses ; humidite sur 20 echantillons, PCI sur 15 ; normes NF X30-413 et NF X30-408 ; ratios extrapoles avec l'enquete Collecte 2023. OMR 2024 : pres de 14,7 Mt, 223 kg/hab. Textiles sanitaires 38 kg/hab, dont papiers souilles 19,2, couches bebe 13,0, autres dechets hygieniques 5,8 kg/hab. Humidite moyenne 42,1 % (plus ou moins 6,3 %), 36,9 % en 2017. Note 16 : les elements fins de moins de 8 mm des OMR sont majoritairement composes de dechets putrescibles. PCI global 16,3 MJ/kg de matiere seche (plus ou moins 2,9), 8,4 MJ/kg sur brut ; verre, metaux, autres matieres minerales et DMS comptes a zero, d'ou une legere sous-estimation. PCI 2024 par fraction (J/g de matiere seche, lecture visuelle du tableau 2) : dechets de jardin 16 606 ; autres fractions putrescibles 16 975 ; papiers 14 398 ; cartons 15 635 ; emballages composites 19 794 ; autres fractions composites 19 251 ; textiles 18 466 ; textiles sanitaires 18 040 ; films plastiques 27 808 ; autres fractions plastiques 25 616 ; emballages en bois 17 300 ; autres fractions en bois 17 822 ; autres matieres organiques 16 781 ; elements fins de moins de 8 mm 9 819 ; verre, metaux, autres minerales, DMS non analyses. Tableau 8 p. 41 : total OMR 14 752 013 t, 223,46 kg/hab."
    citation: "Le taux d'humidité moyen des OMR est ainsi de 42,1 % | 16,3 MJ/kgMS (± 2,9 MJ/kgMS) | Les éléments fins < 8 mm des OMR sont majoritairement composés de déchets putrescibles. | Cinq échantillons caractérisés ont été retirés de l'analyse car présentant des valeurs aberrantes"
    statut: lu
    note: "Miroir de l'observatoire normand (OBDEC) ; le rapport technique complet (librairie ADEME, ref. 013089) est sur formulaire (R-042). La synthese ne dit pas comment les fines sont reparties dans la composition par categorie."
