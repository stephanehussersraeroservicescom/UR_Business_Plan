A5-BHATT-2026-RSCADV:
  titre: "Co-pyrolysis of mixed municipal solid waste components in a semi-pilot scale rotary kiln: synergistic effects on pyrolysis oil and biochar properties"
  editeur: "RSC Advances (Royal Society of Chemistry), auteurs Bhatt M., Panicker T.F., Mishra R.K., Sharma A., Ganesh M., Sheth P.N., Joshi J.B."
  date: 2026
  annee_donnees: 2026
  type: etude_publique
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13329883/
  doi: 10.1039/d6ra02636b
  emplacement: "RSC Adv. 16(35):35523-35545 ; resume ; section 2.5 (four rotatif semi-batch, 2 kg par essai, 500 C, 20 C/min, 90 min) ; section 3.3 (rendements) ; tableau 3 (eau de l'huile)"
  contenu: "Four rotatif semi-pilote, 2 kg par essai, 500 C. Papier et textiles : huile 20 a 25 % en masse, char 28 a 32 %, gaz 45 a 48 %. Plastiques melanges (LDPE et PP, moins de 2 % de PS et HDPE) : huile 40 a 45 %, char 5 a 7 % (corps du texte) ; le resume donne 43 % d'huile et 16 % de char. Le resume donne 30 a 40 % de char pour le papier. Eau de l'huile (tableau 3) : papier 8,01 % ; textile 3,21 % ; plastiques 1,22 %."
  citation: "Waste paper and textile wastes exhibit relatively lower pyrolysis oil yields (20–25 wt%) and higher char (28–32 wt%). | The gas yield for these materials remains comparatively high (45–48 wt%) | The pure plastics exhibit a markedly different trend, yielding the highest pyrolysis oil content (40–45 wt%) and the lowest char content (5–7 wt%). | Mixed plastics yielded the highest pyrolysis oil content (43 wt%) and the lowest char yield (16 wt%), whereas wastepaper produced the highest char (30–40 wt%)."
  statut: lu
  consulte: '2026-11-19'
  note: "Article a comite de lecture, acces libre. Lu par Claude dans le navigateur de Stephane (texte integral PMC) le 19/11/2026. Contradictions internes entre resume et corps (char du papier, char et huile des plastiques). Les rendements par matiere ne sont donnes qu'en fourchettes dans le texte (valeurs exactes sur la figure 5 seulement). Essais a l'echelle semi-pilote, conditions differentes de l'Urban Rig (pas de vapeur surchauffee)."

A5-JIA-2020-POLYMERS-PET:
  titre: "Catalytic Fast Pyrolysis of Poly (Ethylene Terephthalate) (PET) with Zeolite and Nickel Chloride"
  editeur: "Polymers (MDPI), auteurs Jia H., Ben H., Luo Y., Wang R."
  date: 2020-03-23
  annee_donnees: 2020
  type: etude_publique
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7183261/
  doi: 10.3390/polym12030705
  emplacement: "Polymers 12(3):705 ; section methodes (nacelle en quartz, 450 et 600 C, 30 min) ; section resultats, figure 3 ; tableau 1 (analyse du PET)"
  contenu: "Pyrolyse rapide de PET en laboratoire, 450 et 600 C. Sans catalyseur : produits cireux (acide benzoique, acide terephtalique) d'environ 59,50 et 67,70 % en masse, gaz d'environ 20 % ; le catalyseur ZSM-5 fait tomber les cires sous 10 % et environ 23 % et porte le gaz au-dela de 50 %. Analyse du PET (tableau 1, base seche) : matieres volatiles 88,54 %, carbone fixe 9,37 %, cendres 2,09 % ; C 61,87 %, H 4,35 %, O 33,78 %."
  citation: "In Figure 3, the yield of waxy products without any catalyst decreased from about 59.50 wt % and 67.70 wt % to below 10 wt % and about 23 wt % at different pyrolytic temperatures when the ZSM-5 was added as catalyst. | On the contrary, the yield of gases increased from about 20 wt % to over 50 wt % on average | heated up to a diverse final temperature (450, 600 °C)"
  statut: lu
  consulte: '2026-11-19'
  note: "Article a comite de lecture, acces libre. Lu par Claude dans le navigateur de Stephane le 19/11/2026. Echelle de quelques grammes ; conditions differentes de l'Urban Rig. Le texte ne precise pas quelle valeur (59,50 ou 67,70) correspond a quelle temperature."

