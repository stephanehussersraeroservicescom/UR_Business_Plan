
# === ANNEXE 5, scenarios et couches (chat 5, 19/11/2026, D-047 et D-048) ===

CALC-A5-SANIT-COUCHES-PART:
  description: Part des couches bebe et autres produits d'hygiene (06.01 et 06.02) dans les textiles sanitaires des OMR
  formule: (a + b) / t * 100
  entrees:
    a:
      valeur: 859734
      unite: t
      source: ADEME-MODECOM-2024-DATA
      emplacement: '06.01'
    b:
      valeur: 380662
      unite: t
      source: ADEME-MODECOM-2024-DATA
      emplacement: '06.02'
    t:
      calc: CALC-A5-CAT06-T
  unite: '%'
  resultat: 49.502
