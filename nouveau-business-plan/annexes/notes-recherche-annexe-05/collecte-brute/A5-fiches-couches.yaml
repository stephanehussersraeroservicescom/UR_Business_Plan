  date: 2021
  annee_donnees: 2021
  type: etude_publique
  url: https://www.mdpi.com/1996-1073/14/9/2399
  doi: 10.3390/en14092399
  emplacement: "Energies 14(9):2399 ; resume ; section 2.1 (materiaux) ; tableau 3 (analyses immediate et elementaire) ; tableau 5 ; section 3 (ICP-AES, sodium ; agglomeration du lit)"
  contenu: "Deux materiaux : couches neuves broyees (AHPam, rebut de production) et fraction cellulosique de couches usagees sterilisees (AHPus). Tableau 3 (base brute) : humidite 5,8 et 6,6 % ; cendres 7,5 et 10,7 % ; matieres volatiles 82,8 et 81,5 % ; carbone fixe 3,9 et 1,2 %. Base seche : C 65,3 et 43,5 % ; H 10,3 et 6,6 % ; S 1,1 et 1,8 % ; O 23,3 et 48,0 %. Sodium (venant du polyacrylate de sodium du superabsorbant) : 2 a 3 % en masse dans les couches neuves. Le sodium et d'autres mineraux forment des eutectiques a bas point de fusion entre 500 et 800 C : agglomeration du sable du lit observee. Devolatilisation a 500, 600, 700 et 800 C ; sous azote a 700-800 C, meilleur gaz : H2 29,5 et 23,7 % en volume, hydrocarbures 14,8 et 7,4 %, 53,7 et 46,0 Nl de gaz pour 100 g. Fin de decomposition en combustion (ATG, 20 C/min) : 540 C pour les deux materiaux."
  citation: "ICP-AES analyses indicated that Na content in AHPam was in the range of 2–3 wt% | Ashes 7.5 10.7 Volatile matter 82.8 81.5 Fixed carbon 3.9 1.2 | can lead to the formation of eutectics [35], which can in turn generate low-melting ashes at the temperatures of those processes investigated in this work"
  statut: lu
  consulte: '2026-11-19'
  note: "Article a comite de lecture, acces libre. Texte integral du PDF lu par Claude dans le navigateur de Stephane le 19/11/2026. Lit fluidise de laboratoire (chauffage tres rapide), pas une pyrolyse lente ; les rendements en char, huile et gaz en % massique ne sont pas donnes dans les passages lus."

