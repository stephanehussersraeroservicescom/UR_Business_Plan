    Majoration communale possible 2 EUR/t max. Indexation inflation a partir de 2027.
  reserve: >
    Le modele ne contient aucune ligne de TGAP pour Urban Rig.
    La qualification du procede (valorisation matiere vs incineration) reste a etablir juridiquement.
    L'article 42 de la directive 2010/75/UE assimile a l'incineration tout procede dont les gaz sont brules.

