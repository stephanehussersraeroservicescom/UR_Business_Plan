# === ANNEXE 2 : questions de Stephane du 14/10/2026 (chlore, catalyseur, eaux, SEA CORAL) ===

CHIBA-PROCEDE-HUILE:
  titre: 'Rapport Chiba, section 7 : recuperation et mesure de l''huile produite'
  type: rapport_essai
  fiabilite: mesure_interne
  nature: mesure_exploitant
  statut: lu
  date: 2022-09
  chemin: reference/preuves/tests-independants/prefecture-shiba-test-data-2.pdf
  emplacement: PDF p. 29 (impr. 23)
  citation: 熱分解炉で発生したガスは、触媒反応槽を通過して、コンデンサーで凝縮されドレンポットを通過して油水分離層へ導かれる。
  citation_mesure: 油水分離層から油水ともポンプでドラム缶に移送し、ドラム缶で静置分離後に検尺棒を使用して油水量を計量した。
  contenu: Sur l'unite d'essai de Noda, le gaz du four de pyrolyse traverse un reservoir de reaction catalytique (触媒反応槽) avant le condenseur, puis un pot de purge (ドレンポット) et le separateur huile-eau. Huile et eau sont pompees en futs, decantees, puis mesurees au jaugeage (検尺棒) ; l'eau est reperee a la pate de detection d'eau ; huile = volume total moins eau.
  reserve: Le rapport ne dit ni la fonction du catalyseur (dechloration ou autre), ni sa nature, ni son etat. Le poids d'huile des fiches est le volume jauge multiplie par la densite indiquee sur chaque fiche.
CHIBA-CONSTATS:
  titre: 'Rapport Chiba, section 8 : constats de la campagne (exigences, qualite, environnement, bilans, limites)'
  type: rapport_essai
  fiabilite: mesure_interne
  nature: mesure_exploitant
  statut: lu
  date: 2022-09
  chemin: reference/preuves/tests-independants/prefecture-shiba-test-data-2.pdf
  emplacement: PDF p. 39 et 40 (impr. 33 et 34)
  citation: 本試験装置は、排水処理工程を持たないため、排水処理前の原水の分析結果は水質基準値を超過する結果となっている。これを踏まえて、実用機の排水処理設備に反映する。
  citation_unite: 本試験研究に使用した熱分解油化装置は、テスト用の装置であるため、その処理能力を充分に発揮することができなかった。
  citation_dioxines: ダイオキシン類は0.067ng-TEQ/N㎥という測定結果であり、いずれも規制値以下となった。
  contenu: 'L''unite de Noda est une unite d''essai (テスト用の装置), sans etape de traitement des eaux ; les eaux brutes depassent les normes et le traitement sera prevu sur la machine commerciale. Echantillons d''eau des 9 et 15/09/2022. Dioxines 0,067 ng-TEQ/Nm3 sous la valeur reglementaire. Problemes : capacite, pannes du surchauffeur et du bruleur ; axes : capacite, bilan energetique, melanges contenant du PET, fractionnement.'
  reserve: Constats de l'exploitant (Asada Shokai), pas d'un laboratoire.
