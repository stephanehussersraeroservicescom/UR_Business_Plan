jours_exploitation:
  justification: AFF-JRS-00
  valeur_v3: 330
  label: "Jours d'exploitation par an"
  valeur: 330
  unite: "j/an"
  statut: hypothese
  preuves: [BP-CHAPITRE-5, UVE-DISPONIBILITE, DECLARE-CONSTRUCTEUR-MAINT]
  decision: D-011
  bornes: {bas: 250, haut: 358}
  valeurs_reference:
    - {valeur: 282, libelle: "UVE SITRU four 2 (2018)"}
    - {valeur: 314, libelle: "UVE SITRU four 1 (2018)"}
    - {valeur: 330, libelle: "Retenu (plan d'affaires 90-92%)"}
    - {valeur: 333, libelle: "Base de conception UVE (8 000 h)"}
    - {valeur: 358, libelle: "Constructeur, 1 semaine d'arret"}
  note: >
    Machine concue pour fonctionner en continu. Le constructeur annonce une semaine de
    maintenance par an, soit 358 jours au maximum, mais ce plafond exclut les arrets non
    planifies. Le plan d'affaires retient 90 a 92% de disponibilite, soit 329 a 336 jours.
    Les UVE francaises matures sont concues sur 8 000 h (333 jours) et realisent entre
    282 et 314 jours par four. 330 est coherent avec un parc mature ; un premier exemplaire
    peut etre en dessous les premieres annees.
