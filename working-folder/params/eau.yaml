  valeur: 0.78
  unite: fraction
  statut: calcule
  preuves: [SEACORAL-JP]
  note: "Derive de l'essai : chlorures 31 000 -> 140 000 mg/L dans le concentrat."

cout_concentrat:
  label: "Cout d'elimination du concentrat"
  valeur: 110
  unite: "EUR/T"
  statut: hypothese
