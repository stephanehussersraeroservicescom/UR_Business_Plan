    par le plastique est pris a 10 % de la masse de plastique entrante. Raisonnement de Stephane, egalement HYPOTHESE :
    l'eau se condense dans le separateur ; le gaz sec est reinjecte ; sa composition est supposee proche de celle du gaz
    analyse (B2002600 hors air, D-021) ; la difficulte porte sur la quantite, pas sur la composition. Ordre de grandeur
    pour des ordures menageres a 10 % de plastique : environ 1 % de la masse entrante en gaz issu du plastique, plus une
