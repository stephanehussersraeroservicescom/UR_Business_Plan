D-020:
  date: 2026-10-14
  titre: "Annexe 2 : poids donne a la documentation OneWorld et presentation des performances"
  de: "documentation OneWorld presentee avec reserve, au meme niveau que les points non demontres"
  vers: "documentation OneWorld utilisee comme base de conception de l'URC-2000, toujours attribuee et etiquetee CONSTRUCTEUR"
  unite: "-"
  motif: >
    Decision de Stephane du 14/10/2026, apres lecture de la premiere redaction de l'annexe 2.
    Stephane accorde une grande confiance a la documentation d'Urban Rig et de OneWorld (prolonge D-016).
    Consignes de presentation : montrer chaque essai dans un tableau ; ajouter au rendement en huile la part
    transformee en gaz (hydrocarbures et hydrogene, brules comme combustible) ; ne pas resumer les essais par
    leur valeur la plus basse ; pour les dechets municipaux, montrer la part non plastique et calculer les
    rendements hors metaux et corps etrangers ; comparer les emissions aux valeurs limites en vigueur et aux
    niveaux les plus stricts (MTD). Les regles de rigueur restent appliquees : chaque chiffre reste source et
    etiquete, et les contradictions restent montrees (section des demandes a OneWorld).
  preuves: []
  a_verifier: "-"

D-021:
  date: 2026-10-14
  titre: "Annexe 2 : valeurs energetiques des produits et base du bilan energetique"
  de: "gaz et char sans valeur energetique ; bilan energetique tire des essais en lots"
  vers: "gaz a 37,4 MJ/kg (composition B2002600 hors air) ; char a 32 090 J/g ; huile a 46 000 J/g ; bilan sur les chiffres OneWorld de l'URC-2000"
  unite: "-"
  motif: >
    Decision de Stephane du 14/10/2026. (1) L'off-gas est preleve a la sortie, melange a l'air : l'oxygene et
    l'azote ne viennent pas du plastique. Tout ce qui ne sort pas en huile, char ou metal est compte comme gaz de
    la composition B2002600 (hydrogene a dioxyde de carbone) ; son PCI est la moyenne ponderee des PCI de ses
    composants (donnees NIST). (2) Le char d'Urban Rig est pris a 32 090 J/g (rapport Izumitec R35-339439),
    pour toutes les charges. (3) L'huile est prise a 46 000 J/g (PCS calcule JLOS). (4) Les essais en lots
    servent aux coefficients de transformation et a la qualite des produits, pas au bilan energetique : un petit
    reacteur en lots ne represente pas la consommation d'une machine continue. (5) Le bilan energetique de
    l'URC-2000 repose sur les chiffres de OneWorld, admis comme justes : bruleur de 833 kcal/s, combustible de
    10 000 L/jour (valeur haute), electricite de 600 kW. Le choix de 600 kW plutot que 20 kW (brochure) a ete
    propose par Claude, a confirmer par Stephane.
  preuves: [KANSO-B2002600, NIST-WEBBOOK-GAZ, IZUMITEC-R35-339439, CHIBA-JLOS-HUILES, UR2000-JP-P08-SPEC, OW-CONSO-ENERGIE]
  a_verifier: "Electricite de l'URC-2000 : 600 kW ou 20 kW."

D-022:
  date: 2026-10-14
  titre: "Annexe 2 : presentation par liens vers des fiches de preuve et taux de confiance"
  de: "etiquettes LU, CALCULE, CONSTRUCTEUR dans le texte"
  vers: "lien vers une fiche de preuve (annexe-02-preuves/) et taux de confiance dans le texte ; etiquettes dans les fiches"
  unite: "-"
  motif: >
    Decision de Stephane du 14/10/2026. Chaque argument renvoie par lien hypertexte a un fichier de preuve
    numerote (Annex 2.1.a, etc.) qui donne le nom exact du fichier source, la page, la citation et les valeurs,
    ou, pour un calcul, sa base, sa formule et son resultat. Echelle de confiance : 100 % pour les essais
    externes (rapports d'essai remis aux autorites, laboratoires independants), 95 % pour la documentation du
    constructeur ; le reste a la discretion de Claude : 100 % pour la reglementation et les donnees de reference,
    95 % pour la litterature evaluee et les calculs sur donnees a 95 % ou plus, 90 % pour les calculs utilisant
    une hypothese de travail, un tableau constructeur sans auteur imprime et les brevets, 80 % pour les sources
    secondaires. Un calcul n'est jamais note au-dessus de son entree la moins fiable ni au-dessus de 95 %.
  preuves: []
  a_verifier: "-"

D-023:
