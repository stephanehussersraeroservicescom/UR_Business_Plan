  vers: "gaz issu du plastique = 10 % de la masse de plastique entrante (HYPOTHESE) ; 'oil + gas by difference (operator definition, Chiba report p. 27)' avec reserve sur l'humidite des essais municipaux ; autosuffisance citee seulement comme declaration de OneWorld, sur son exemple a 90 % de resines ; bilan energetique des dechets menagers renvoye a l'annexe 5"
