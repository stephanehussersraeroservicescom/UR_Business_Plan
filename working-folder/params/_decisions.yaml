D-018:
  date: 2026-10-14
  titre: "Perimetre de l'annexe 8 (dechets plastiques) et limite avec l'annexe 7"
  de: "limite entre les annexes 7 et 8 a confirmer"
  vers: "annexe 8 = toutes les filieres plastiques, menageres et industrielles ; annexe 7 = dechets d'activites economiques en melange"
  unite: "-"
  motif: >
    Decision de Stephane du 14/10/2026. L'annexe 8 etudie les filieres du plastique, quelle que
    soit l'origine (menages ou entreprises), en priorite celles qui sont peu ou pas recyclees :
    tonnages, taux de recyclage reel, devenir de ce qui n'est pas recycle, qui paie quoi.
    Exemple donne par Stephane, a verifier : le polystyrene, selon sa comprehension, est fondu
    ou compacte en blocs sans debouche reel de valorisation derriere. Les flux de plastique
    seul d'origine industrielle (films, chutes) relevent de l'annexe 8, pas de l'annexe 7.
  preuves: []
  a_verifier: "Pour chaque filiere plastique, sourcer tonnages, taux de recyclage et devenir des non-recycles."

