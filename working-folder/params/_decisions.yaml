  titre: "Correction de la teneur en chlore de l'huile"
  de: 100
  vers: 1
  unite: ppm
  motif: >
    ERREUR DE RECOPIE dans TECHNICAL-REFERENCE-VALIDATED-DATA.md. Le 100 ppm est un SEUIL
