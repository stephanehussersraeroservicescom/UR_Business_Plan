  base: experience_industrielle
  preuves: [LITT-TCHOBANOGLOUS]

AFF-DEN-02:
  enonce: "La benne URC-2000 accepte jusqu'a 0,927 t/m3"
  base: specification_constructeur
  preuves: [UR2000-JP]
  detail: >
    Benne de 1 x 3 x 1,5 m, soit 4,5 m3, pour un poids maximal de 4,17 t.
