# ---------------------------------------------------------------------------
# GRAPHE DES JUSTIFICATIONS
#
# Chaque parametre du modele pointe vers une affirmation racine (champ
# "justification" dans les fichiers de parametres). Chaque affirmation
# s'appuie sur d'autres affirmations et, au bout de la chaine, sur des
# preuves brutes du registre _evidence.yaml.
#
# BASE DE L'AFFIRMATION, ET CONFIANCE PAR DEFAUT
#   experience_interne ........ 1.00  essai mene par nous ou pour nous
#   experience_industrielle ... 1.00  pratique etablie, des centaines d'operateurs
#   loi_physique .............. 1.00  chimie, thermodynamique, geometrie
#   mesure_certifiee .......... 1.00  rapport de laboratoire tiers
#   decision_commerciale ...... 1.00  parametre fixe par nous, certain par definition
#   publication_scientifique .. 0.80  A DISCUTER : reproductibilite, conditions
#   reglementaire ............. 1.00  texte de loi ou taux officiel
#   specification_constructeur  0.90  A DISCUTER : 80 a 100 %, le constructeur ne publie rien sans essai
#   declaration ............... 0.60  A DISCUTER : oral, non documente
#   hypothese ................. 0.50  choix de modelisation non etaye
#   calcul .................... herite de ses appuis
#   inconnu ................... 0.00
#
# Un champ "confiance" explicite remplace la valeur par defaut.
#
# PROPAGATION
#   mode: tous       tous les appuis sont necessaires  -> maillon le plus faible
#   mode: un_suffit  chaque appui suffit seul          -> meilleur appui
#   La confiance effective ne depasse jamais celle de l'affirmation elle-meme.
#
# contre_indications : affichees en rouge, n'entrent pas dans le calcul,
#   mais doivent etre discutees avant d'accepter le chiffre.
# ---------------------------------------------------------------------------


# =========================================================== MASSE VOLUMIQUE
AFF-DEN-00:
  enonce: "Les dechets peuvent etre charges a 0,70 t/m3 dans la benne URC-2000"
  base: calcul
  mode: tous
  appuis: [AFF-DEN-01, AFF-DEN-02]
  consequence: >
    Necessite une presse a balles sur site. Equipement supplementaire, non
    redhibitoire, a porter au CAPEX.
  pour_passer_a_1: "Un essai de remplissage d'une benne URC-2000 avec des OMR reelles pressees, avec pesee."

AFF-DEN-01:
  enonce: "Les ordures menageres se compactent industriellement bien au-dela de 0,70 t/m3"
  base: experience_industrielle
  appuis: [AFF-DEN-01a, AFF-DEN-01b, AFF-DEN-01c]
  mode: un_suffit
  detail: >
    Mise en balles courante des OMR : 0,59 t/m3 ; fourchette 0,30 a 0,89.
    Presse haute compression : 0,95 t/m3. Centre de stockage compacte par engin :
    0,55 a 0,85 t/m3. Des centaines d'operateurs pratiquent ces compactions.

AFF-DEN-01a:
  enonce: "Mise en balles des OMR : 300 a 890 kg/m3, valeur preferentielle 593 kg/m3"
  base: experience_industrielle
  preuves: [BREVETS-BALLES]

AFF-DEN-01b:
  enonce: "Presse haute compression : environ 950 kg/m3"
  base: experience_industrielle
  preuves: [BREVETS-BALLES]

AFF-DEN-01c:
