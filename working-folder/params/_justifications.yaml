# =========================================================== PCI DU GAZ
AFF-PCI-00:
  enonce: "Le gaz de procede issu du plastique a un PCI de 37,3 MJ/kg"
  base: calcul
  mode: tous
  appuis: [AFF-PCI-01, AFF-PCI-02, AFF-PCI-03]
  detail: >
    Calcul molaire sur la composition chromatographique apres retrait des 78,1% de
    diluant (azote et air). Le 5,54 MJ/kg du rapport d'essai est celui de
    l'echantillon dilue.
  pour_passer_a_1: "Deja a 1 sur le calcul. Reste a verifier la representativite par une mesure sur gaz non dilue en continu."

AFF-PCI-01:
  enonce: "Composition du gaz : H2 12,7%, CH4 3,2%, C2-C3 1,5%, CO 0,6%, CO2 1,7%, N2 65,8%, O2 12,3%"
  base: mesure_certifiee
  preuves: [GC-B2002600]

AFF-PCI-02:
  enonce: "PCI des gaz purs : H2 241,8 ; CH4 802,3 ; CO 283,0 kJ/mol"
  base: loi_physique
  detail: "Constantes thermodynamiques tabulees."

AFF-PCI-03:
  enonce: "Une charge de PE, PP et PS ne contient que du carbone et de l'hydrogene"
  base: loi_physique
  appuis: [AFF-PCI-03a]
  mode: tous
  detail: "Donc les 11,7 kg de gaz de l'essai ne peuvent etre ni du CO2 ni de l'eau."

AFF-PCI-03a:
  enonce: "Bilan matiere de l'essai du 26/05/2022 : 60 kg entrants, 43,1 + 5,2 + 11,7 = 60,0 kg sortants"
  base: experience_interne
  preuves: [ICHIMURA-2022]

AFF-PCO-00:
  enonce: "Le gaz de procede issu de l'organique a un PCI d'environ 11 MJ/kg"
  base: publication_scientifique
  preuves: [LITT-CHALMERS]
  detail: "Pyrolyse de biomasse a 600 degres C. Conditions a comparer avec le procede UR."
  pour_passer_a_1: "Un essai de pyrolyse UR sur charge organique non plastique, avec mesure de debit et de PCI."


