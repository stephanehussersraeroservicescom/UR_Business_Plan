  base: experience_industrielle
  preuves: [LITT-TCHOBANOGLOUS]
  detail: "OMR en vrac 0,10 a 0,30 t/m3 ; en camion a compaction 0,30 a 0,50 t/m3."

AFF-DEN-04:
  enonce: "La valeur 0,70 t/m3 est celle retenue dans la feuille de calcul Lufthansa"
  base: specification_constructeur
  preuves: [LUFTHANSA-WS]
  detail: "Origine historique du chiffre. Non justifiee par une mesure dans la feuille."


