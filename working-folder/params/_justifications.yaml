# =========================================================== TRAITEMENT DE L'EAU
AFF-EAU-00:
  enonce: "Le chlore passe dans l'eau puis est neutralise et concentre, l'eau est recyclee"
  base: calcul
  mode: tous
  appuis: [AFF-EAU-01, AFF-EAU-02, AFF-EAU-03]

AFF-EAU-01:
  enonce: "CaCO3 + 2 HCl donne CaCl2 + H2O + CO2 ; le chlorure de calcium est un sel non volatil"
  base: loi_physique
  detail: "Neutralisation acide-base. Pratique courante en traitement des eaux depuis des siecles."

AFF-EAU-02:
  enonce: "Neutraliser avant de decanter augmente la force ionique et ameliore la separation des organiques"
  base: loi_physique
  detail: "Relargage salin : la solubilite des organiques baisse quand la salinite monte."

AFF-EAU-03:
  enonce: "Le SEA CORAL retient 99,9% des chlorures, rendement en eau 78%"
  base: specification_constructeur
  preuves: [SEACORAL-JP]
  detail: "Essai constructeur sur eau de mer : 31 000 -> 31 mg/L. Non encore reproduit sur eau de pyrolyse."
  pour_passer_a_1: "Une analyse d'eau traitee sur eau de procede reelle."


