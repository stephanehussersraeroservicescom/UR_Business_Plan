en_attente:
  prix_entree_dae:
    label: "Prix d'entree, DAE en melange"
    valeur: 100
    unite: "EUR/T"
    point: B18
    note: "Proposition de Claude (25/11/2026), alignee sur les OMR (D-039). Reference lue : refus de tri payes environ 200 EUR/t TGAP comprise (A7-ADEME-TRI-DAE-2025)."
    preuves: [A7-ADEME-TRI-DAE-2025]
