  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02008L0098-20180705"
  emplacement: "Article 3, points (15) et (17) ; article 4(1) (a) a (e)"
  contenu: >
    Valorisation (recovery) : operation dont le resultat principal est que des dechets servent a des fins utiles
    en remplacant d'autres matieres. Recyclage : valorisation par laquelle les dechets sont retraites en produits,
    matieres ou substances ; n'inclut pas la valorisation energetique ni le retraitement en matieres destinees a
    servir de combustible. Hierarchie : prevention, preparation en vue du reemploi, recyclage, autre valorisation
    (notamment energetique), elimination.
  citation: "It includes the reprocessing of organic material but does not include energy recovery and the reprocessing into materials that are to be used as fuels or for backfilling operations;"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par Claude via WebFetch sur EUR-Lex (version consolidee, non authentique). A recontroler ; verifier s'il existe une consolidation posterieure."

IED-2010-75-ART3-42:
  titre: "Directive 2010/75/UE, article 3 points 40 et 41 (installations d'incineration et de co-incineration) et article 42(1) (exclusion de la pyrolyse et de la gazeification sous conditions)"
  editeur: "Parlement europeen et Conseil (EUR-Lex)"
  date: 2010-11-24
  type: reglementaire
  url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32010L0075"
  emplacement: "Article 3 points (40) et (41) ; article 42(1) second alinea"
  contenu: >
    Une installation d'incineration de dechets comprend les autres procedes de traitement thermique, tels que la
    pyrolyse, la gazeification ou le plasma, si les substances qui en resultent sont ensuite incinerees. Le
    chapitre IV ne s'applique pas aux installations de gazeification ou de pyrolyse si les gaz sont purifies au
    point de ne plus etre des dechets avant leur incineration et ne peuvent pas emettre plus que la combustion du
    gaz naturel.
  citation: "This Chapter shall not apply to gasification or pyrolysis plants, if the gases resulting from this thermal treatment of waste are purified to such an extent that they are no longer a waste prior to their incineration"
  citation_art3_40: "such as pyrolysis, gasification or plasma process"
  statut: lu
  consulte: 2026-10-15
  note: "Lu par Claude via WebFetch sur EUR-Lex, texte d'origine (JO L 334 du 17/12/2010) ; les modifications de 2024 (directive (UE) 2024/1785) n'ont pas ete lues. Complete IED-2010-75-ANX6-P3."

JRC-2023-PLASTIC-RECYCLING:
  titre: "Garcia-Gutierrez P. et al., Environmental and economic assessment of plastic waste recycling: a comparison of mechanical, physical, chemical recycling and energy recovery of plastic waste (JRC132067, EUR 31423 EN)"
  editeur: "Commission europeenne, Centre commun de recherche (Publications Office of the EU)"
  date: 2023
  type: etude_publique
  url: "https://publications.jrc.ec.europa.eu/repository/bitstream/JRC132067/JRC132067_01.pdf"
  emplacement: "Resume (p. 5 selon l'extraction) ; definitions (p. 8) ; pages a confirmer sur le PDF"
  contenu: >
    Le recyclage (mecanique, physique ou chimique) est preferable a la valorisation energetique dans toutes les
    filieres etudiees ; entre recyclage mecanique et chimique, aucun classement net ne peut etre etabli. Le
    recyclage chimique se subdivise en depolymerisation, pyrolyse et gazeification ; l'etude retient comme
    recyclage la production de matiere qui n'est pas utilisee comme combustible.
  citation: "Recycling (mechanical, physical or chemical) is preferable to energy recovery in all pathways analysed"
  statut: lu
