A3-PURO-BIOCHAR-2025:
  titre: Puro Biochar Methodology, Edition 2025 V2
  editeur: Puro.earth
  date: '2025-11-27'
  type: norme
  url: https://7518557.fs1.hubspotusercontent-na1.net/hubfs/7518557/Puro%20Biochar%20Methodology%20-%20Edition%202025%20(version%202)%20-%20For%20Publication.pdf
  emplacement: Couverture p. 1 ; règles 3.4.5 (p. 24-25), 3.4.8 (p. 27), 3.4.16 (p. 30), 3.4.26 (p. 33) ; glossaire ; sections 3.1.1, 3.4.4, 3.4.5
    (catégories A et J non admises), 3.4.8, 3.4.16, 3.4.24, 3.4.26
  contenu: 'Seule méthodologie Puro liée à la pyrolyse (biochar, retrait de CO2). Les déchets municipaux en mélange et assimilés sont en catégorie
    « non autorisée » (pas de crédits CORC), y compris la fraction organique triée après collecte ; plastiques ajoutés volontairement tolérés
    seulement si volatils et ≤ 5 % m/m sec, PVC et pneus interdits ; pas de co-combustion avec charbon ou fioul ; le carbone fossile est réputé
    entièrement réémis. Le char d''Urban Rig (ordures ménagères et plastiques) n''est donc pas éligible. || La biomasse est la matière organique
    d''origine récente ; toute part de matière non démontrée éligible rend le biochar inéligible. Les déchets municipaux en mélange et assimilés
    (catégorie A) ne sont pas admis, même après tri post-collecte d''une fraction organique. Plastiques non volatilisables, composites et caoutchoucs
    synthétiques interdits ; thermoplastiques ajoutés limités à 5 % m/m sec ; carbone fossile du gisement estimé et considéré comme intégralement
    réémis. Conclusion du sous-agent : un char de déchets municipaux et plastiques mélangés n''est pas éligible aux CORC Puro.'
  citation: 'Edition 2025 V2 | Approved 27 November 2025 | Status: Approved ; Non-allowed categories for biochar production: ; Mixed municipal
    solid waste (MSW) and assimilated waste. ; post-collection sorting of MSW to extract an organic fraction feedstock is also not deemed eligible
    ; the total plastic content must not exceed 5% w/w (dry basis) | « Mixed municipal solid waste (MSW) and assimilated waste. » [...] « Any
    share of biomass feedstock which cannot be demonstrated to be eligible will lead to the resulting biochar not being eligible. » [...] « The
    inclusion of non-volatilizing plastics, composite materials or synthetic rubbers » [...] « the total plastic content must not exceed 5% w/w
    (dry basis). » [...] « Biomass is not allowed to be mixed and co-fired with fossil coal nor fossil oil. »'
  statut: lu
  consulte: 2026-10-15
  note: 'Lu par un sous-agent de recherche le 15/10/2026 via WebFetch. Liste des 8 méthodologies Puro lue sur https://puro.earth/carbon-removal-methods
