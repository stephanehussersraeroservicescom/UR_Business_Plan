  emplacement: articles 1er, 2 et 3
  contenu: 'Seuil de l''article L. 811-1 du code de l''énergie : 3,38 kgCO2éq/kgH2. Méthode pour l''hydrogène renouvelable : annexe du règlement
    2023/1185 ; pour l''hydrogène bas-carbone (depuis l''arrêté du 7 juillet 2026) : annexe du règlement délégué 2025/2359, avec certification
    par un système volontaire reconnu (régime transitoire par le directeur de l''énergie). L''arrêté ne mentionne ni déchets, ni carbone recyclé
    ; or le règlement 2025/2359 exclut les RCF : le traitement d''un hydrogène issu de déchets plastiques au regard du seuil français n''est donc
    pas réglé explicitement (lecture de l''agent, à confirmer juridiquement).'
