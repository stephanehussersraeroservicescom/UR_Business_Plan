A4-CIBS-L433-74-89-2026:
  titre: "Code des impositions sur les biens et services, articles L. 433-73 a L. 433-90 (taxe sur les dechets incineres), dans la loi n. 2026-103 du 19/02/2026 de finances pour 2026"
