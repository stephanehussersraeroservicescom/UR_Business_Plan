  annee_donnees: 2026
  type: reglementaire
  url: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000053508155
  fichier: pdf/joe_20260220_0043_0001.pdf
  emplacement: "PDF p. 59 (articles L. 433-74 a L. 433-81) et p. 61 (articles L. 433-89 et L. 433-90)"
  contenu: "L. 433-74 : est taxee la reception de dechets en vue de leur traitement thermique dans une installation classee autorisee au titre du traitement thermique de dechets. L. 433-77 : exemption de l'installation incinerant exclusivement ses propres dechets. L. 433-78 : exemption, pour les dechets non dangereux, de l'installation classee autorisee au titre de la co-incineration. L. 433-80 : exemption du dechet destine a une valorisation matiere, ou a une transformation en un combustible destine a cesser d'etre un dechet (L. 541-4-3) ou a etre utilise dans une installation autorisee au titre de la co-incineration ; pour les hydrocarbures, exemption du traitement thermique sans combustion. L. 433-89 : le tarif des residus de tri performant (8 EUR/t en 2026, L. 433-90) suppose une installation de performance au moins egale a 70 % et un residu d'une operation de tri de dechets collectes separement, visant la valorisation matiere et repondant a des criteres de performance fixes par arrete."
  citation: "La réception de déchets en vue de leur traitement thermique dans une installation classée autorisée au titre du traitement thermique de déchets | Est exemptée, pour les déchets non dangereux, l'installation classée autorisée au titre de la co-incinération | Une transformation en un combustible qui est destiné : | a) A cesser d'être un déchet en application de l'article L. 541-4-3 du code de l'environnement ; | b) A l'utilisation dans une installation classée autorisée au titre de la co-incinération ; | Pour les hydrocarbures, un traitement thermique dans le cadre duquel n'intervient aucune combustion | Il s'agit du résidu d'une opération de tri de déchets ayant fait l'objet d'une collecte séparée"
  statut: lu
