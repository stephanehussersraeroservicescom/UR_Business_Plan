  note: "Lu par Claude dans la copie locale du JORF (pdftotext) le 25/11/2026, a la suite du lot 3 de Codex (annexe 4). L'application de ces exemptions a une unite de pyrolyse n'est pas etablie (R-050)."

A4-IED-2024-1785-ART42:
  titre: "Directive (UE) 2024/1785 du 24 avril 2024 modifiant la directive 2010/75/UE (emissions industrielles), article 1er, point 35 (article 42, paragraphe 1, second alinea)"
  editeur: "EUR-Lex, Journal officiel de l'Union europeenne"
  date: 2024-04-24
  annee_donnees: 2024
  type: reglementaire
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32024L1785
  emplacement: "article 1er, point (35)"
  contenu: "Le chapitre IV (incineration) ne s'applique pas aux installations de gazeification ou de pyrolyse si les gaz ou liquides issus du traitement thermique des dechets sont traites avant leur incineration de sorte que : (a) l'incineration emet moins que la combustion des combustibles les moins polluants disponibles sur le marche qui pourraient etre brules dans l'installation ; (b) pour les emissions autres que NOx, SOx et poussieres, elle n'emet pas plus que l'incineration ou la co-incineration de dechets. Directive (UE) 2024/1785, article 1er, point 35, en 2024. Remplace la redaction de 2010 (gaz purifies au point de ne plus etre des dechets, emissions pas superieures au gaz naturel). Transposition en droit francais non verifiee."
  citation: "This Chapter shall not apply to gasification or pyrolysis plants, if the gases or liquids resulting from such thermal treatment of waste are treated prior to their incineration to such an extent that: | the incineration causes emissions lower than the combustion of the least polluting fuels available on the market that could be combusted in the installation"
  statut: lu
  consulte: '2026-11-25'
  note: "Lu par Claude dans le navigateur de Stephane (EUR-Lex, texte du JO) le 25/11/2026, a la suite du lot 2 de Codex (annexe 4)."
