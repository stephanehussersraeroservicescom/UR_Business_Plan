    pas été lues (statut secondaire pour HYDRIX). Coût SMR de 2025 antérieur à la hausse du gaz de 2026 (Banque mondiale au registre : 25,42 USD/mmbtu
    en sept. 2026).'
  parametres:
  - cout_h2_gris_ue
