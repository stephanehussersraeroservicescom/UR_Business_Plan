A3J-CRE-2025-229-AVIS-CDC-H2:
  titre: Délibération n° 2025-229 du 1er octobre 2025 portant avis sur un projet de cahier des charges relatif à une procédure de mise en concurrence
    avec dialogue concurrentiel portant sur le soutien à la production d'hydrogène renouvelable ou bas-carbone
  editeur: Commission de régulation de l'énergie
  date: '2025-10-01'
  type: reglementaire
  url: https://www.cre.fr/fileadmin/Documents/Deliberations/2025/251001_2025-229_Avis_CDC_H2.pdf
  emplacement: page 1 (volume), page 3 (objet, durée, 200 MW, note 2 usages), page 8 (plafond), page 10 (notes 15 et 17)
  contenu: 'Le mécanisme de soutien français est réservé à l''hydrogène produit par électrolyse de l''eau (article L. 812-1 du code de l''énergie)
    : un hydrogène issu de pyrolyse de déchets n''y est PAS éligible. Aide au fonctionnement sur 15 ans, prix d''enchère plafonné à 4 EUR/kg,
    1 GW sur trois périodes jusqu''en 2027 (200 MW en 1re période), projets de 5 à 100 MW ; usages exclus : chauffage (sauf > 400 °C), injection
    réseau de gaz, production d''électricité, transports. Seuil 3,38 kgCO2éq/kgH2 présenté comme -70 % par rapport à l''hydrogène fossile. Rappel
    de L. 811-1 : renouvelable = électrolyse avec électricité renouvelable ou autre technologie utilisant exclusivement des sources renouvelables
    ; bas-carbone = émissions inférieures ou égales au seuil.'
  citation: « Conformément à l'article L. 812-1 du code de l'énergie qui indique que le soutien est exclusivement réservé à la production d'hydrogène
    renouvelable ou bas carbone par électrolyse de l'eau. » ; « Enfin, le prix d'enchère est plafonné à 4 € par kilogramme d'hydrogène produit.
    » ; « Hydrogène bas-carbone = « l'hydrogène dont le procédé de production engendre des émissions inférieures ou égales au seuil retenu pour
    la qualification d'hydrogène renouvelable (…). » ; « Fixé à 3,38 kgCO2éq/kgH2, il permet de réduire les émissions de gaz à effet de serre
    de 70 % par rapport à l'hydrogène fossile. »
  statut: lu
  consulte: 2026-10-15
  note: 'Lu le 15/10/2026 via WebFetch (citations restituées par l''outil en extraits). Le texte de l''article L. 811-1 est cité ici par la CRE,
    pas lu sur Légifrance (bloqué) : statut secondaire pour L. 811-1 lui-même. Il s''agit d''un avis sur un PROJET de cahier des charges ; le
    cahier des charges définitif et les résultats n''ont pas été lus. L''hydrogène carboné (ni renouvelable ni bas-carbone) n''est pas défini
    dans l''extrait.'
  parametres:
  - soutien_h2_france
  - eligibilite_h2_pyrolyse
  - plafond_aide_h2

A3J-AIDA-RAPPORT-ORD-2021-167:
  titre: Rapport au Président de la République relatif à l'ordonnance n° 2021-167 du 17 février 2021 relative à l'hydrogène
  editeur: Gouvernement (reprise AIDA/INERIS)
  date: '2021-02-17'
  type: reglementaire
