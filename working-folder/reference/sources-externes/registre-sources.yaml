  relecture_a5_2026_11_19:
    lu_par: 'Claude, chat 5 annexe 5 : WebFetch (texte) et lecture visuelle de la p. 23 dans le navigateur de Stephane'
    titre_exact: MODECOM 2024, Campagne nationale de caracterisation des dechets menagers et assimiles, Synthese, decembre 2025 (brochure ref. 013089-02), ADEME, realise par ECOGEOS
    emplacement: p. 13 (methode), p. 14, p. 21, p. 22 (tableau 1 et note 16), p. 23 du PDF (tableaux 2 et 3 ; page imprimee 24 selon le verificateur), p. 41 (tableaux 7 et 8)
    recontrole_a5: 'Recontrole independant par un sous-agent, 19/11/2026 : points cles conformes (95 echantillons, humidite, PCI, textiles sanitaires, note 16, 14 752 013 t). Tableau 2 : 9 valeurs conformes ; 5 lignes ambigues dans le texte extrait (16 975, 19 251, 25 616, 17 822, 16 781), lues par Claude sur l image de la page (colonne 2024) le 19/11/2026.'
    contenu: 'Methode : 100 echantillons d''OMR dans 50 communes, 16 strates ; 5 retires, 95 analyses ; humidite sur 20 echantillons, PCI sur 15 ; normes NF X30-413 et NF X30-408 ; ratios extrapoles avec l''enquete Collecte 2023. OMR 2024 : pres de 14,7 Mt, 223 kg/hab. Textiles sanitaires 38 kg/hab, dont papiers souilles 19,2, couches bebe 13,0, autres dechets hygieniques 5,8 kg/hab. Humidite moyenne 42,1 % (plus ou moins 6,3 %), 36,9 % en 2017. Note 16 : les elements fins de moins de 8 mm des OMR sont majoritairement composes de dechets putrescibles. PCI global 16,3 MJ/kg de matiere seche (plus ou moins 2,9), 8,4 MJ/kg sur brut ; verre, metaux, autres matieres minerales et DMS comptes a zero, d''ou une legere sous-estimation. PCI 2024 par fraction (J/g de matiere seche, lecture visuelle du tableau 2) : dechets de jardin 16 606 ; autres fractions putrescibles 16 975 ; papiers 14 398 ; cartons 15 635 ; emballages composites 19 794 ; autres fractions composites 19 251 ; textiles 18 466 ; textiles
      sanitaires 18 040 ; films plastiques 27 808 ; autres fractions plastiques 25 616 ; emballages en bois 17 300 ; autres fractions en bois 17 822 ; autres matieres organiques 16 781 ; elements fins de moins de 8 mm 9 819 ; verre, metaux, autres minerales, DMS non analyses. Tableau 8 p. 41 : total OMR 14 752 013 t, 223,46 kg/hab.'
    citation: Le taux d'humidité moyen des OMR est ainsi de 42,1 % | 16,3 MJ/kgMS (± 2,9 MJ/kgMS) | Les éléments fins < 8 mm des OMR sont majoritairement composés de déchets putrescibles. | Cinq échantillons caractérisés ont été retirés de l'analyse car présentant des valeurs aberrantes
    statut: lu
