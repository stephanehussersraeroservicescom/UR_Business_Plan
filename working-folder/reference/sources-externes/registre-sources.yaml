  emplacement: corps du rapport, 2e et 3e paragraphes
  contenu: 'L''ordonnance définit trois types d''hydrogène (renouvelable, bas carbone, carboné) et deux systèmes de traçabilité : garanties d''origine
    (cessibles séparément) et garanties de traçabilité (cédées avec l''hydrogène), gérées par un organisme indépendant. Ces garanties ne concernent
    que l''hydrogène renouvelable ou bas-carbone : un hydrogène issu de déchets plastiques qui ne serait ni l''un ni l''autre (hydrogène carboné)
    n''y aurait pas accès.'
  citation: La présente ordonnance que nous soumettons à votre approbation définit les différents types d'hydrogènes qui feront l'objet de régimes
    particuliers, hydrogène renouvelable, bas carbone ou carboné. Il prévoit deux systèmes de traçabilité de l'hydrogène pour que son caractère
    bas-carbone ou renouvelable puisse être connu de l'acheteur [...] Les garanties d'origine et de traçabilité seront gérées par un organisme
    indépendant, sur le modèle de celui qui existe déjà pour les garanties d'origine de l'électricité renouvelable.
  statut: lu
