A3I-UE-DIR-2003-87-ANNEXE-I:
  titre: Directive 2003/87/CE établissant un système d'échange de quotas d'émission de gaz à effet de serre dans l'Union, version consolidée au
    01/03/2024 (CELEX 02003L0087-20240301), article 2(1), article 3(t), annexe I
  editeur: Union européenne (EUR-Lex)
  date: 2024-03-01 (dernière version consolidée listée par EUR-Lex le 15/10/2026)
  type: reglementaire
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02003L0087-20240301
  emplacement: Article 2(1) ; article 3, point (t) ; annexe I, point 5 et ligne « Combustion of fuels »
  contenu: 'Le SEQE s''applique aux activités de l''annexe I. La combustion est toute oxydation de combustibles, quel que soit l''usage de l''énergie
    produite. L''activité « combustion » vise les installations de puissance thermique nominale totale > 20 MW, sauf les installations d''incinération
    de déchets dangereux ou municipaux ; depuis le 01/01/2024, l''incinération de déchets municipaux > 20 MW est seulement soumise à surveillance
    et déclaration (articles 14 et 15), sans restitution. Le SEQE est un système de quotas (obligation de restituer), il ne crée aucun crédit
    pour une installation qui réduit ou évite des émissions. Conséquence pour Urban Rig (lecture du sous-agent) : si la combustion du gaz de pyrolyse
    sur site dépasse 20 MW thermiques et que l''installation n''est pas une installation d''incinération de déchets municipaux, elle pourrait
    entrer dans le SEQE comme émetteur (coût), jamais comme générateur de crédits. Puissance thermique du brûleur Urban Rig : non connue du sous-agent,
    non estimée.'
  citation: This Directive shall apply to the activities listed in Annexes I and III ; ‘combustion’ means any oxidation of fuels, regardless of
    the way in which the heat, electrical or mechanical energy produced by this process is used ; Combustion of fuels in installations with a
    total rated thermal input exceeding 20 MW (except in installations for the incineration of hazardous or municipal waste) From 1 January 2024,
    combustion of fuels in installations for the incineration of municipal waste with a total rated thermal input exceeding 20 MW, for the purposes
    of Articles 14 and 15.
  statut: lu
  consulte: 2026-10-15
  note: 'Lu par un sous-agent de recherche le 15/10/2026 dans le navigateur Chrome de l''utilisateur (EUR-Lex, texte intégral, lecture seule)
    car WebFetch tronque la page à 119 000 caractères. Version anglaise. Le point 5 de l''annexe I dit aussi : « all units in which fuels are
    combusted, other than units for the incineration of hazardous or municipal waste, shall be included ». Remplace la fiche secondaire A3-ZWE-SEQE-ART30-2024
    pour l''annexe I.'
  parametres:
  - seqe_perimetre_pyrolyse
  - credit_carbone_seqe

A3I-UE-DIR-2003-87-ART11A:
  titre: Directive 2003/87/CE consolidée au 01/03/2024, article 11a « Use of CERs and ERUs from project activities in the EU ETS before the entry
    into force of an international agreement on climate change »
  editeur: Union européenne (EUR-Lex)
  date: '2024-03-01'
  type: reglementaire
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02003L0087-20240301
  emplacement: Article 11a, paragraphes 1 à 4 (modifié par M14, directive (UE) 2023/958)
  contenu: Dans la version en vigueur, l'article 11a ne permet plus l'usage de crédits internationaux qu'aux exploitants d'aéronefs (unités de
    l'article 6(4) de l'accord de Paris, programmes CORSIA, accords bilatéraux, et « crédits délivrés pour des projets de niveau Union au titre
    de l'article 24a »). Les paragraphes sur les installations fixes ne visent que les projets MOC/MDP jusqu'au 31/12/2012. Aucune disposition
    ne permet à une installation fixe d'utiliser ou de générer des crédits ; aucune ne permet de créer des crédits pour un projet situé en France.
  citation: aircraft operators that hold an air operator certificate issued by a Member State [...] shall be able to use the following units [...]
    (d) credits issued in respect of Union level projects pursuant to Article 24a. ; Until 31 December 2012, for JI and CDM project activities
    which reduce or limit directly the emissions of an installation falling within the scope of this Directive, ERUs and CERs may be issued only
    if an equal number of allowances is cancelled
  statut: lu
  consulte: 2026-10-15
  note: Lu par un sous-agent de recherche le 15/10/2026 dans le navigateur Chrome (EUR-Lex, texte intégral). Les [...] marquent des coupures du
    sous-agent. Le texte ne contient pas de date « fin d'usage après 2020 » pour les installations ; la fin de l'usage par les installations résulte
    de l'absence de toute disposition en ce sens dans la version en vigueur (lecture, pas citation).
  parametres:
  - credit_carbone_seqe
  - credits_internationaux_seqe

A3I-UE-DIR-2003-87-ART24A:
  titre: Directive 2003/87/CE consolidée au 01/03/2024, article 24a « Harmonised rules for projects that reduce emissions »
  editeur: Union européenne (EUR-Lex)
  date: '2024-03-01'
  type: reglementaire
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02003L0087-20240301
  emplacement: Article 24a, paragraphes 1 et 3 (paragraphe 2 supprimé)
  contenu: 'La Commission PEUT adopter des mesures (actes délégués) pour délivrer des quotas ou crédits pour des projets gérés par les États membres
    réduisant des émissions hors SEQE, sans double comptage. C''est une faculté. Le paragraphe 3 permet à un État membre de refuser des crédits
    pour certains types de projets sur son territoire. Aucun acte délégué établissant cette procédure n''a été trouvé (voir NON TROUVÉ) : l''article
    est donc inopérant à ce jour. Le considérant 20 du règlement (UE) 2018/842 (répartition de l''effort) mentionne la possibilité de partenariats
    public-privé pour ces projets.'
  citation: the Commission may adopt measures for issuing allowances or credits in respect of projects administered by Member States that reduce
    greenhouse gas emissions not covered by the EU ETS ; Any such measures shall not result in the double-counting of emission reductions ; A
    Member State can refuse to issue allowances or credits in respect of certain types of projects that reduce greenhouse gas emissions on its
    own territory.
  statut: lu
  consulte: 2026-10-15
  note: Lu par un sous-agent de recherche le 15/10/2026 dans le navigateur Chrome (EUR-Lex, texte intégral). L'absence d'acte délégué est un constat
