A3J-ACER-H2-MARKETS-2025:
  titre: European hydrogen markets, 2025 Monitoring Report
  editeur: ACER (Agence de l'Union européenne pour la coopération des régulateurs de l'énergie)
  date: 2025 (données janvier à octobre 2025 ; webinaire 9 décembre 2025)
  type: etude_publique
  url: https://www.acer.europa.eu/sites/default/files/documents/Publications/ACER-2025-European-hydrogen-markets.pdf
  emplacement: pages 40 et 41 (paragraphes 78 à 80, figure 15, notes 65 et 66)
  contenu: 'Coûts de production (estimations S&P Global, janv.-oct. 2025) : hydrogène conventionnel par vaporeformage (SMR) un peu plus de 2 EUR/kg
    ; SMR avec captage 2,8 EUR/kg (hors transport et stockage du CO2) ; électrolyse Pays-Bas environ 7 EUR/kg (oct. 2025) ; RFNBO environ 8 EUR/kg
    (7 à 10 selon le pays). Prix de marché : indice EEX HYDRIX (hydrogène « vert », pas nécessairement renouvelable, offert en Allemagne) environ
    8,2 EUR/kg en moyenne 2025, contre environ 7,8 EUR/kg en 2023 ; indice MIBGAS IBHYX (coût de production RFNBO, Espagne) autour de 6 EUR/kg
    en 2025 ; HYCLICX (coût marginal Pays-Bas) entre 6 et 8 EUR/kg depuis mi-2025.'
  citation: in 2025 (January to October), the average cost of conventional hydrogen produced via SMR was a bit higher than 2 EUR/kg, following
    the price trend of natural gas. Carbon capture brings the average cost of abated hydrogen during the same period to 2.8 EUR/kg, excluding
    CO 2 transportation and storage costs. [...] Notably, the average cost of RFNBO hydrogen remains significantly higher at around 8 EUR/kg,
    ranging between 7-10 EUR/kg [...] The market-based HYDRIX index issued by the European Energy Exchange (EEX) for renewable hydrogen has seen
    a slight increase in 2025, averaging approximately 8.2 EUR/kg up from approximately 7.8 EUR/kg in 2023. [...] EEX HYDRIX is a market-based
    index that aims to reflect the price for “green”, not necessarily renewable, hydrogen offered in Germany.
  statut: lu
  consulte: 2026-10-15
  note: 'PDF lu le 15/10/2026 dans le navigateur Chrome (WebFetch refusé, robots.txt), texte extrait par pdf.js. Les coûts SMR sont des estimations
