    § 3d p. 17 (biomasse) ; § 4 p. 19-20 (projets Airvault, Saint-Pierre-la-Cour). Pagination approximative selon l'outil.
  contenu: '25 cimenteries en France (5 groupes : Heidelberg Materials, Eqiom/CRH, Imerys, Lafarge/Holcim, Vicat). Combustibles fossiles : principalement
    coke de pétrole, charbon (13 à 17 % du mix selon les années) et gaz naturel ; la part du coke de pétrole diminue et doit être remplacée par
    des combustibles alternatifs. Combustibles de substitution : 29 % de la consommation d''énergie en 2011, 44 % en 2021. Déchets consommés :
    964 kt en 2015, 1 054 kt en 2021 ; objectif 80 % de la consommation d''énergie en 2030 (1 528 kt) et 85 % en 2050 (1 649 kt). Biomasse : 422
    kt (2015) puis 577 kt (2021) ; part de biomasse dans les déchets visée 52,5 % en 2030 et 60 % en 2050. Projet Airvault : 88 % de combustibles
    alternatifs, plus de 200 000 t/an de déchets dont jusqu''à 150 000 t/an de CSR.'
