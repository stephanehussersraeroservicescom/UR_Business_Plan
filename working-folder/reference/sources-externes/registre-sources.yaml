A3J-UE-DIR-2018-2001-ART2-RCF:
  titre: Directive (UE) 2018/2001 relative à la promotion de l'utilisation de l'énergie produite à partir de sources renouvelables (texte consolidé
    au 16.07.2024, intégrant la directive (UE) 2023/2413)
  editeur: Union européenne (EUR-Lex)
  date: 2024-07-16 (version consolidée)
  type: reglementaire
  url: https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:02018L2001-20240716
  emplacement: article 2, points 24 (biomasse), 35 (carburants à base de carbone recyclé) et 36 (RFNBO)
  contenu: 'Un combustible gazeux (dont l''hydrogène) produit à partir de déchets solides d''origine non renouvelable (plastiques fossiles) qui
    ne se prêtent pas à la valorisation matière relève de la catégorie « combustibles ou carburants à base de carbone recyclé » (RCF). Il ne peut
    pas être un RFNBO, dont l''énergie doit provenir de sources renouvelables autres que la biomasse. La fraction biodégradable des déchets municipaux
    est de la biomasse : la part du gaz issue de la fraction biogénique des ordures ménagères relève donc des règles biomasse (article 29 et 31),
    pas des RCF.'
  citation: '35) «combustibles ou carburants à base de carbone recyclé»: les combustibles ou carburants liquides et gazeux qui sont produits à
    partir de flux de déchets liquides ou solides d''origine non renouvelable ne se prêtant pas à la valorisation de matières conformément à l''article
    4 de la directive 2008/98/CE, ou à partir de gaz issus du traitement des déchets et de gaz d''échappement d''origine non renouvelable qui
    découlent inévitablement et involontairement de processus de production dans des installations industrielles; 36) «carburants renouvelables
    d''origine non biologique»: les carburants et combustibles liquides et gazeux dont le contenu énergétique provient de sources renouvelables
    autres que la biomasse; 24) «biomasse»: [...] ainsi que la fraction biodégradable des déchets, notamment les déchets industriels et municipaux
    d''origine biologique;'
  statut: lu
  consulte: 2026-10-15
  note: 'Lu le 15/10/2026 dans le navigateur Chrome (EUR-Lex refuse WebFetch, robots.txt). Version consolidée du 16.07.2024 ; une consolidation
    postérieure peut exister. La qualification RCF exige que les déchets « ne se prêtent pas à la valorisation de matières » (hiérarchie des déchets)
    : à démontrer pour les plastiques entrants.'
  parametres:
  - statut_h2_dechets_plastiques
  - definition_rcf

