# === ANNEXE 2 : NORMES D'EMISSION ET CONVERSIONS (chat 1 v3, 14/10/2026) ====

IED-2010-75-ANX6-P3:
  titre: "Directive 2010/75/UE relative aux emissions industrielles, annexe VI, partie 3 : valeurs limites d'emission dans l'air des installations d'incineration des dechets"
  editeur: "Parlement europeen et Conseil (texte adopte, reproduit par legislation.gov.uk)"
  date: 2010-11-24
  type: reglementaire
  url: "https://legislation.gov.uk/eudr/2010/75/annex/VI/part/3/adopted?view=plain"
  emplacement: "Annexe VI, partie 3, points 1, 1.1, 1.4 et 1.5 ; article 42(1) second alinea"
  contenu: >
    Valeurs a 273,15 K, 101,3 kPa, gaz sec, 11 % d'oxygene. Moyennes journalieres (mg/Nm3) : poussieres 10 ;
    COT 10 ; HCl 10 ; HF 1 ; SO2 50 ; NOx (en NO2) 200 pour les installations neuves ou existantes de plus de
    6 t/h, 400 pour les existantes de 6 t/h au plus. Dioxines et furannes 0,1 ng/Nm3 sur 6 a 8 h. CO 50 mg/Nm3
    en moyenne journaliere. Article 42(1) : le chapitre ne s'applique pas a une pyrolyse dont les gaz sont
    purifies au point de ne plus etre des dechets et n'emettent pas plus que la combustion de gaz naturel.
  citation: "All emission limit values shall be calculated at a temperature of 273,15 K, a pressure of 101,3 kPa"
  statut: verifie
  consulte: 2026-10-14
  note: "Lu sur la reproduction legislation.gov.uk du texte adopte ; a relire sur EUR-Lex (JO L 334 du 17/12/2010)."

