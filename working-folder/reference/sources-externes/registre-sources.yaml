  contenu: >
    L. 433-57 stockage : non dangereux 69 (2026), 73, 77, 81, 85 (2030) ; dangereux 30,36 puis indexation.
    L. 433-86 traitement thermique : non dangereux, performance 65-100 % : 16, 17, 18, 19, 20 ;
    performance < 65 % : 29, 33, 37, 41, 45 ; dangereux 15,18 puis indexation.
