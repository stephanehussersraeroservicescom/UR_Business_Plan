    (kgCO2éq/kgH2), prévu à l'article L. 811-1 du code de l'énergie, est fixé à 3,38 kgCO2éq/kgH2. [...] (Article 3) « Les émissions de gaz à
    effet de serre [...] d'hydrogène bas-carbone, sont déterminées selon les règles définies pour le calcul des émissions de gaz à effet de serre
    de l'hydrogène décrites dans l'annexe du règlement délégué (UE) 2025/2359 [...] »
